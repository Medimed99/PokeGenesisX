   ============================================================ */
function ownedSorted(){
  return Object.keys(S.dex).map(Number).sort((a,b)=>{
    const ea = S.dex[a], eb = S.dex[b];
    return (POKE[b].bst * (1+eb.lvl/100)) - (POKE[a].bst * (1+ea.lvl/100));
  });
}
function teamFighters(ids, boost){
  return ids.filter(id=>S.dex[id]).map(id=>makeFighter(id, S.dex[id].lvl, {shiny:S.dex[id].shiny, boost:boost||1}));
}
/* ---------- sélecteur d'équipe ----------
   Recherche par nom, ordre explicite, retrait d'un geste. L'ordre compte :
   le premier de la liste entre en jeu, les suivants prennent le relais. */
let TP = null;
function teamPicker(title, max, onConfirm, preset){
  TP = {
    sel: (preset || S.team.slice(0, max)).filter(id=>S.dex[id]),
    max, title, onConfirm, q: "", sort: "power"
  };
  drawTeamPicker();
}
function tpPool(){
  const q = TP.q.trim().toLowerCase();
  let ids = Object.keys(S.dex).map(Number);
  if(q) ids = ids.filter(id=>POKE[id].name.toLowerCase().includes(q)
                          || String(id).padStart(3,"0").includes(q));
  const sorters = {
    power: (a,b)=>(POKE[b].bst*(1+S.dex[b].lvl/100)) - (POKE[a].bst*(1+S.dex[a].lvl/100)),
    level: (a,b)=>S.dex[b].lvl - S.dex[a].lvl,
    num:   (a,b)=>a-b,
    name:  (a,b)=>POKE[a].name.localeCompare(POKE[b].name)
  };
  return ids.sort(sorters[TP.sort] || sorters.power);
}
function drawTeamPicker(){
  const pool = tpPool();
  const full = TP.sel.length >= TP.max;
  sheet(`${sheetHead(TP.title)}
    <div class="tiny muted" style="margin-bottom:8px">
      L'ordre compte : le premier entre en jeu, les autres prennent le relais.
      Touchez une flèche pour le déplacer.</div>

    <div class="tp-sel">
      ${TP.sel.length ? TP.sel.map((id,i)=>`
        <div class="tp-row">
          <span class="tp-pos">${i+1}</span>
          <span class="sprbox" style="width:38px;height:38px">${sprite(id, S.dex[id].shiny, "")}</span>
          <div class="grow">
            <div class="tiny">${esc(POKE[id].name)}</div>
            <div class="wrap" style="gap:3px;margin-top:2px">${typeTags(POKE[id].types)}
              <span class="tt t1">N.${S.dex[id].lvl}</span></div>
          </div>
          <div class="tp-ord">
            <button class="tp-b" data-act="tpmove" data-i="${i}" data-d="-1" ${i===0?"disabled":""}>▲</button>
            <button class="tp-b" data-act="tpmove" data-i="${i}" data-d="1" ${i===TP.sel.length-1?"disabled":""}>▼</button>
          </div>
          <button class="tp-x" data-act="tpdel" data-i="${i}" aria-label="Retirer">${ic("cross")}</button>
        </div>`).join("")
        : `<div class="empty" style="padding:16px">Aucun Pokémon sélectionné.</div>`}
      ${Array.from({length: Math.max(0, TP.max - TP.sel.length)}, ()=>
        `<div class="tp-row ghost"><span class="tp-pos">—</span>
          <div class="grow tiny dim">emplacement libre</div></div>`).join("")}
    </div>

    <button class="btn pri wide" style="margin:9px 0" data-act="tconfirm"
      ${TP.sel.length?"":"disabled"}>Valider (${TP.sel.length}/${TP.max})</button>

    <div class="row" style="gap:6px;margin-bottom:7px">
      <input id="tp-q" type="text" placeholder="Rechercher un Pokémon…" value="${esc(TP.q)}"
        oninput="tpSearch(this.value)" style="flex:1">
    </div>
    <div class="chipbar">
      ${[["power","Puissance"],["level","Niveau"],["num","Numéro"],["name","Nom"]].map(([k,n])=>
        `<button class="chip ${TP.sort===k?"on":""}" data-act="tpsort" data-s="${k}">${n}</button>`).join("")}
    </div>

    ${pool.length ? `<div class="dexgrid">
      ${pool.slice(0,80).map(id=>{
        const on = TP.sel.includes(id);
        return `<div class="dexcell owned r${POKE[id].rar} ${on?"picked":""} ${(!on&&full)?"muted-cell":""}"
            data-act="tptoggle" data-id="${id}">
          <span class="no">${S.dex[id].lvl}</span>
          ${on?`<span class="cnt">${TP.sel.indexOf(id)+1}</span>`:""}
          ${sprite(id, S.dex[id].shiny, "")}
          <span class="nm">${esc(POKE[id].name)}</span>
        </div>`;}).join("")}
      </div>`
      : `<div class="empty">Aucun Pokémon ne correspond.</div>`}`);
  const inp = document.getElementById("tp-q");
  if(inp && TP.q){ try { inp.focus(); inp.setSelectionRange(TP.q.length, TP.q.length); } catch(e){} }
}
/* la recherche ne doit pas redessiner la feuille a chaque frappe */
function tpSearch(v){
  if(!TP) return;
  TP.q = v;
  clearTimeout(TP._t);
  TP._t = setTimeout(()=>drawTeamPicker(), 180);
}
ACTIONS.tptoggle = d => {
  const id = +d.id;
  const i = TP.sel.indexOf(id);
  if(i >= 0) TP.sel.splice(i, 1);
  else if(TP.sel.length < TP.max) TP.sel.push(id);
  else { toast("Équipe complète — retirez-en un d'abord", "bad", "cross"); return; }
  drawTeamPicker();
};
ACTIONS.tpdel  = d => { TP.sel.splice(+d.i, 1); drawTeamPicker(); };
ACTIONS.tpmove = d => {
  const i = +d.i, j = i + (+d.d);
  if(j < 0 || j >= TP.sel.length) return;
  [TP.sel[i], TP.sel[j]] = [TP.sel[j], TP.sel[i]];
  drawTeamPicker();
};
ACTIONS.tpsort = d => { TP.sort = d.s; drawTeamPicker(); };
ACTIONS.tconfirm = () => {
  const sel = TP.sel.slice();
  const cb = TP.onConfirm;
  TP = null;
  closeSheet();
  S.team = sel.slice();
  saveSoon();
  cb(sel);
};

function guardianKey(rk, id){ return rk + ":" + id; }
function guardianBeaten(rk, id){ return S.bosses.includes(guardianKey(rk, id)); }
function guardianAvailable(r, g, idx){
  if(dexCount(r.key) < g.need) return false;
  if(idx > 0 && !guardianBeaten(r.key, r.guardians[idx-1].id)) return false;
  return true;
}
function guardianLevel(r, idx){ return [30, 44, 58][idx] + (r.act-1)*18; }
function guardianBoost(r, idx){
  return (1.18 + idx*0.1 + (r.act-1)*0.06) * (cycleMod("m_tough") ? 1.3 : 1);
}
/* le bandeau tactique renforce l'equipe, pas l'adversaire */
function allyBoost(){ return heldActive("boss") ? 1.12 : 1; }

ACTIONS.bossgo = d => {
  const r = regionDef(d.r), i = +d.i, g = r.guardians[i];
  if(!guardianAvailable(r, g, i)) return;
  pzFlash(pzLine("boss"));
  teamPicker(`Équipe contre ${g.name}`, 3, ids=>{
    if(!ids.length) return;
    startGuardian(r, i, ids);
  });
};

function startGuardian(r, i, ids){
  const g = r.guardians[i];
  const allies = teamFighters(ids, allyBoost());
  const foe = makeFighter(g.id, guardianLevel(r, i), {boost: guardianBoost(r, i)});
  foe.name = g.name;
  S.daily.dayBoss++; questTick("dayBoss",1);
  createBattle(allies, [foe], {
    title: g.title,
    intro: `<span class="bad">${esc(g.name)}</span> maintient le verrou du secteur ${esc(r.name)}.`,
    boss: g,
    onEnd: win => onGuardianEnd(r, i, win)
  });
  go("battle", {mode:"boss", region:r.key, idx:i});
}

function onGuardianEnd(r, i, win){
  const g = r.guardians[i];
  if(win){
    const first = !guardianBeaten(r.key, g.id);
    if(first) S.bosses.push(guardianKey(r.key, g.id));
    S.stats.bossWins++;
    const lvl = guardianLevel(r, i);
    if(first){
      addToDex(g.id, lvl, false);
      addIntegrity(g.core ? 5 : 2.5);
      /* un noyau emet une illustration ancienne : c'est la recompense de prestige */
      const cs = rollCardSeries(g.id, g.core ? 3.2 : 1.8);
      const cNew = grantCardV(cs, g.id);
      gain("cores", g.core ? 4 : 2);
    } else addIntegrity(0.4);
    const fw = consumeFirstWin("boss");
    gain("coins", Math.round((900 + lvl*30) * fw));
    gain("shards", Math.round((40 + i*20) * fw));
    addXp(Math.round((400 + lvl*10) * fw));
    save();
    sheet(`<div class="center">
      <div class="h">VERROU LEVÉ</div>
      <span class="sprbox" style="width:132px;height:132px;margin:0 auto">${sprite(g.id, false, "", {anim:true, eager:true})}<i class="sprshadow"></i></span>
      <div style="font-size:15px">${esc(g.name)}</div>
      <div class="tiny muted" style="margin-bottom:7px">${esc(g.title)}</div>
      ${first?`<div class="panel" style="text-align:left">
        <div class="tiny ok">Entité restaurée et ajoutée à votre archive.</div>
        <div class="tiny">Carte émise : <b style="color:${CARD_SERIES_DEF[cs].c}">${esc(CARD_SERIES_DEF[cs].n)}</b>
          ${cNew?"":' <span class="dim">(doublon)</span>'}</div>
        <div class="tiny">Intégrité : <b class="ok">+${g.core?5:2.5}%</b></div>
      </div>`:`<div class="tiny muted">Verrou déjà levé — récompenses réduites.</div>`}
      <button class="btn pri wide" data-act="bossdone">Continuer</button></div>`, true);
    checkAchievements();
    guideTick();
  } else {
    if(!S.story.includes("pz_first_guardian_fail")) S.flags.guardFail = true;
    sheet(`<div class="center"><div class="h" style="color:var(--magenta)">ÉCHEC DE L'ASSAUT</div>
      <div class="tiny muted" style="margin:8px 0">Le verrou tient. Votre équipe est renvoyée au tampon.</div>
      <div class="tiny">Montez le niveau de vos Pokémon en expédition, ou ramenez une équipe
        avec un meilleur avantage de type.</div>
      <button class="btn wide" style="margin-top:9px" data-act="bossdone">Retour</button></div>`, true);
  }
}

ACTIONS.bspeed = () => {
  const order = [0.5, 1, 2, 4];
  const i = order.indexOf(BATTLE.speed);
  BATTLE.speed = order[(i + 1) % order.length];
  S.settings.battleSpeed = BATTLE.speed;
  saveSoon(); renderArena(); refresh();
};
ACTIONS.useitem = d => {
  if(!BATTLE || BATTLE.over || BATTLE.busy) return;
  const k = d.k;
  if((S.items[k]||0) <= 0){ toast("Aucun objet de ce type", "bad", "cross"); return; }
  if(k === "potion"){
    const A = activeAlly();
    if(A.hp >= A.maxHp){ toast("Déjà au maximum", "bad", "cross"); return; }
    S.items.potion--;
    A.hp = Math.min(A.maxHp, A.hp + Math.floor(A.maxHp*0.55));
    blog(`<span class="ok">${esc(A.name)} est restauré.</span>`);
  } else {
    const ko = BATTLE.allies.find(x=>x.hp <= 0);
    if(!ko){ toast("Aucun Pokémon désindexé", "bad", "cross"); return; }
    S.items.revive--;
    ko.hp = Math.floor(ko.maxHp*0.5);
    blog(`<span class="ok">${esc(ko.name)} est réindexé.</span>`);
  }
  saveSoon(); renderArena(); refresh();
  setTimeout(()=>doTurn(0), 300);
};

/* ---------- helpers de run ---------- */
function randomWildId(){
  const regs = unlockedRegions();
  const r = pick(regs);
  for(let k=0;k<40;k++){ const id = randInt(r.from, r.to); if(POKE[id] && !POKE[id].leg) return id; }
  return r.from;
}
function newRunMon(run, id, lvl){
  const level = lvl || run.level;
  const f = makeFighter(id, level, {shiny: S.dex[id]?.shiny});
  applyRelics(run, f);
  return {id, level, hp:f.maxHp, maxHp:f.maxHp};
}
function runFighter(run, m){
  const f = makeFighter(m.id, m.level, {shiny: S.dex[m.id]?.shiny});
  applyRelics(run, f);
  f.maxHp = m.maxHp || f.maxHp;
  f.hp = clamp(m.hp, 0, f.maxHp);
  f.ref = m;
  return f;
}
function applyRelics(run, f){
  for(const rid of run.relics){
    const r = RELICS.find(x=>x.id===rid);
    if(r && r.f) r.f(f);
  }
  f.atk=Math.floor(f.atk); f.spa=Math.floor(f.spa); f.def=Math.floor(f.def);
  f.spd=Math.floor(f.spd); f.spe=Math.floor(f.spe);
}
function relicVal(run, key){
  let v = 0;
  for(const rid of run.relics){ const r = RELICS.find(x=>x.id===rid); if(r && r[key]) v += r[key]; }
  return v;
}
function hasRelic(run, id){ return run.relics.includes(id); }
function grantRelic(run){
  const avail = RELICS.filter(r=>!run.relics.includes(r.id));
  if(!avail.length) return null;
  const r = pick(avail);
  run.relics.push(r.id);
  return r;
}
function healTeam(run, pct){
  for(const m of run.team){ m.hp = Math.min(m.maxHp, m.hp + Math.ceil(m.maxHp*pct)); }
}
function damageTeam(run, pct){
  for(const m of run.team){ m.hp = Math.max(1, m.hp - Math.floor(m.maxHp*pct)); }
}

/* ---------- generation de carte ---------- */
function genMap(seed){
  const r = mulberry32(seed);
  const rows = [];
  for(let y=0; y<EXP_ROWS; y++){
    let cols;
    if(y === 0) cols = shuffle([0,1,2,3], r).slice(0, 2 + Math.floor(r()*2)).sort();
    else if(y === EXP_ROWS-1) cols = [1];
    else cols = shuffle([0,1,2,3], r).slice(0, 2 + Math.floor(r()*3)).sort((a,b)=>a-b);
    rows.push(cols.map(c=>({c, t:nodeTypeFor(y, r), next:[], done:false})));
  }
  /* liens : chaque noeud vers 1-2 noeuds proches de la rangee suivante */
  for(let y=0; y<EXP_ROWS-1; y++){
    const nx = rows[y+1];
    for(const n of rows[y]){
      const sorted = nx.slice().sort((a,b)=>Math.abs(a.c-n.c)-Math.abs(b.c-n.c));
      const k = 1 + (r() < 0.45 && sorted.length > 1 ? 1 : 0);
      n.next = sorted.slice(0,k).map(x=>nx.indexOf(x));
    }
    /* garantir que chaque noeud de la rangee suivante est atteignable */
    nx.forEach((n,i)=>{
      if(!rows[y].some(p=>p.next.includes(i))){
        const closest = rows[y].reduce((a,b)=>Math.abs(b.c-n.c)<Math.abs(a.c-n.c)?b:a);
        closest.next.push(i);
      }
    });
  }
  return rows;
}
function nodeTypeFor(y, r){
  if(y === EXP_ROWS-1) return "boss";
  if(y === 0) return "fight";
  if(y === 1) return r() < 0.5 ? "fight" : "event";
  if(y === EXP_ROWS-2) return "rest";
  const x = r();
  if(x < 0.40) return "fight";
  if(x < 0.54) return "event";
  if(x < 0.65) return "elite";
  if(x < 0.76) return "rest";
  if(x < 0.88) return "shop";
  return "treasure";
}

/* ---------- lancement ---------- */
function startExpedition(ids){
  const seed = Math.floor(rng()*1e9);
  const avg = Math.round(ids.reduce((a,id)=>a+S.dex[id].lvl,0)/ids.length);
  const run = {
    seed, map: genMap(seed), row: -1, col: -1, avail: null,
    level: clamp(avg, 5, 95), relics: [], bits: 60, corruption: 0,
    heals: 1 + (heldActive("exp") ? 1 : 0), usedHeal: false,
    team: [], floor: 0, log: [], ended:false
  };
  run.team = ids.map(id=>newRunMon(run, id, S.dex[id].lvl));
  if(heldActive("relic")) grantRelic(run);
  run.avail = run.map[0].map((_,i)=>i);
  S.expedition = run;
  S.stats.expRuns++;
  save();
  go("expedition");
}
function endExpedition(win){
  const run = S.expedition;
  if(!run || run.ended) return;
  run.ended = true;

  /* niveaux permanents : on garde l'avant et l'apres pour pouvoir les montrer */
  const bonusLv = 1 + relicVal(run, "xp") + (win ? 1 : 0);
  const gains = [];
  for(const m of run.team){
    if(!S.dex[m.id]) continue;              /* une recrue sauvage n'entre pas a l'archive */
    const before = S.dex[m.id].lvl;
    const add = m.hp > 0 ? bonusLv : 0;
    S.dex[m.id].lvl = Math.min(100, before + add);
    gains.push({id:m.id, before, after:S.dex[m.id].lvl, alive:m.hp > 0});
  }

  const mult = (win ? 1 : 0.35) * (win ? consumeFirstWin("expedition") : 1);
  const shards = Math.round((60 + run.floor*12 + run.corruption*18) * mult);
  const coins  = Math.round((500 + run.floor*140) * mult);
  const xp     = Math.round((260 + run.floor*55) * mult);
  gain("shards", shards); gain("coins", coins); addXp(xp);

  /* butin exclusif : les oeufs ne s'obtiennent quasiment que par ici */
  const loot = [];

    S.stats.expWins++; S.daily.dayExp++; questTick("dayExp",1);
    if(!run.usedHeal) S.flags.expNoHeal = true;
    addIntegrity(0.5);
    gain("cores", 1);
    const tier = run.corruption >= 4 ? "e_origin" : run.corruption >= 2 ? "e_epic"
               : run.floor >= 11 ? "e_rare" : "e_common";
    grantEgg(tier);
    loot.push({icon:"box", label:EGG_TIERS[tier].n, sub:"éclôt avec vos captures",
               color:EGG_TIERS[tier].c, big:tier !== "e_common"});
    /* le noyau emet une carte : la corruption prise en chemin ameliore la serie */
    const cw = randomCard(1 + run.corruption * 0.55);
    const cwNew = grantCardV(cw.s, cw.id);
    run._card = cwNew ? cw : null;
    loot.push({icon:"cards", label:POKE[cw.id].name,
               sub:"carte " + CARD_SERIES_DEF[cw.s].n + (cwNew ? "" : " · doublon"),
               color:CARD_SERIES_DEF[cw.s].c, big:true});
    if(rng() < 0.5){
      const h = randomHeld();
      if(h && grantHeld(h))

  sheet(`<div class="center exprecap">
    <div class="h" style="justify-content:center;color:${win?"var(--cyan)":"var(--magenta)"}">

    <div class="tiles" style="margin:10px 0">
      <div class="tile accent"><div class="k">Fragments</div><div class="v">+${shards}</div></div>
      <div class="tile gold"><div class="k">PokéCoins</div><div class="v">+${fmt(coins)}</div></div>
      <div class="tile"><div class="k">Expérience</div><div class="v">+${fmt(xp)}</div></div>
      <div class="tile"><div class="k">${win?"Noyaux":"Intégrité"}</div>
        <div class="v ${win?"vi":"dim"}">${win?"+1":"—"}</div></div>
    </div>

    ${loot.length?`<div class="h sm">BUTIN EXCLUSIF</div>
      <div class="baglist" style="margin-bottom:11px">
        ${loot.map(it=>`<div class="bagrow">

    <div class="h sm">NIVEAUX PERMANENTS</div>
    ${gains.length?`<div class="lvlist">

ACTIONS.expnode = d => {
  const run = S.expedition;
  const y = +d.y, i = +d.i;
  if(!(run.row === y-1 || (run.row === -1 && y === 0))) return;
  if(!(run.avail||[]).includes(i)) return;
  run.row = y; run.col = i; run.floor = y;
  const node = run.map[y][i];
  node.done = true;
  run.avail = y < EXP_ROWS-1 ? node.next : [];
  save();
  enterNode(run, node);
};

function enterNode(run, node){
  switch(node.t){
    case "fight": case "elite": case "boss": return expFight(run, node.t);
    case "rest":     return expRest(run);
    case "shop":     return expShop(run);
    case "treasure": return expTreasure(run);
    case "event":    return expEvent(run);
  }
}

/* Difficulte de l'expedition.
   Les points de vie ne se regenerent pas : la menace est l'usure, pas la
   puissance brute d'un combat isole. Les adversaires restent donc proches
   du niveau de l'equipe, et c'est leur accumulation qui fait le defi. */
function enemyTeamFor(run, kind){
  const n = kind === "boss" ? 2 : kind === "elite" ? 2 : (run.floor > 9 ? 2 : 1);
  const lvBonus = kind === "boss" ? 4 : kind === "elite" ? 2 : 0;
  const boost = (kind === "boss" ? 1.12 : kind === "elite" ? 1.05 : 1)
              * (1 + run.corruption*0.06) * (cycleMod("m_tough") ? 1.3 : 1);
  const out = [];
  for(let k=0;k<n;k++){
    let id = randomWildId();
    if(kind === "boss"){
      const r = regionDef(S.region);
      const pool = [];
      /* fourchette bornee : un noyau reste un morceau, pas un mur */
      for(let j=r.from;j<=r.to;j++)
        if(POKE[j] && POKE[j].bst >= 460 && POKE[j].bst <= 560 && !POKE[j].leg) pool.push(j);
      if(pool.length) id = pick(pool);
    } else if(kind === "elite"){
      /* meilleur de deux, et non de sept : sinon l'Elite aligne des 600 de total */
      const alt = randomWildId();
      if(POKE[alt].bst > POKE[id].bst) id = alt;
    }
    const f = makeFighter(id, clamp(run.level + Math.floor(run.floor*0.7) + lvBonus, 3, 100), {boost});
    out.push(f);
  }
  return out;
}

function expFight(run, kind){
  const allies = run.team.filter(m=>m.hp>0).map(m=>runFighter(run, m));
  if(!allies.length){ endExpedition(false); return; }
  const foes = enemyTeamFor(run, kind);
  const titles = {fight:"CONTACT HOSTILE", elite:"SIGNATURE ÉLITE", boss:"NOYAU DE COUCHE"};
  createBattle(allies, foes, {
    ai: true, speed: S.settings.battleSpeed || 1,
    title: titles[kind],
    intro: kind === "boss" ? `Le noyau de la couche se manifeste.`
                           : `Des entités hostiles bloquent le passage.`,
    onEnd: win => {
      for(const f of allies) if(f.ref){ f.ref.hp = Math.max(0, f.hp); }
      if(!win && relicVal(run,"revive") && run.team.some(m=>m.hp<=0)){
        const m = run.team.find(x=>x.hp<=0);
        m.hp = Math.floor(m.maxHp*0.4);
        toast("Réindexation automatique déclenchée", "warn", "heart");
        go("expedition"); save(); return;
      }
      if(!win){ endExpedition(false); return; }
      /* l'entite vaincue est celle qu'on pourra recruter : c'est elle qu'on a affrontee */
      const beaten = foes.map(f=>f.id);
      afterFightRewards(run, kind, beaten);
    }
  });
  go("battle");
}

function afterFightRewards(run, kind, beaten){
  const heal = 0.25 + relicVal(run, "post");
  healTeam(run, heal);
  const bitsMul = relicVal(run, "bits") || 1;
  const eliteMul = kind === "elite" ? (relicVal(run,"elite")||1) : 1;
  const bits = Math.round((28 + run.floor*7 + run.corruption*6) * bitsMul * eliteMul *
                          (kind==="elite"?1.7:1));
  run.bits += bits;
  const shardGain = relicVal(run, "shard");
  if(shardGain) gain("shards", shardGain);

  if(kind === "boss"){ save(); endExpedition(true); return; }

  const relic = (kind === "elite") ? grantRelic(run) : (rng() < 0.22 ? grantRelic(run) : null);
  const held  = (kind === "elite" && rng() < 0.45) ? randomHeld() : null;
  if(held) grantHeld(held);

  /* un contact hostile propose l'entite qu'on vient de vaincre */
  const candidate = (kind === "fight" && beaten && beaten.length)
    ? beaten[randInt(0, beaten.length-1)] : null;
  run.pendingRecruit = candidate;
  save();

  sheet(`<div class="center">
    <div class="h" style="justify-content:center">COUCHE DÉGAGÉE</div>
    <div class="tiles" style="margin:8px 0">
      <div class="tile gold"><div class="k">Bits</div><div class="v">+${bits}</div></div>
      <div class="tile accent"><div class="k">Récupération</div><div class="v">+${Math.round(heal*100)}%</div></div>
    </div>
    ${relic?`<div class="panel tight" style="text-align:left">
      <div class="row"><div class="bag-ic">${ic("shard2")}</div>
        <div class="grow"><div class="tiny">Relique : <b class="vi">${esc(relic.n)}</b></div>
          <div class="tiny muted">${esc(relic.d)}</div></div></div></div>`:""}
    ${held?`<div class="panel tight" style="text-align:left">
      <div class="row"><span class="sprbox" style="width:34px;height:34px">${sprite(HELD_ITEMS[held].spr,false,"")}</span>
        <div class="grow"><div class="tiny">Objet tenu : <b class="vi">${esc(HELD_ITEMS[held].n)}</b></div>
          <div class="tiny muted">${esc(HELD_ITEMS[held].d)}</div></div></div></div>`:""}

    ${candidate ? recruitBlock(run, candidate) : `
      <button class="btn pri wide" data-act="expcontinue">Continuer</button>`}
  </div>`, true);
}

/* ===== 60-poker.js ===== */
/* ============================================================
   60 — POKE-POKER
   Les cartes ne sont pas des rangs et des couleurs : ce sont des
   Pokemon. Les combinaisons se lisent en especes identiques, en
   familles d'evolution, en types et en chromatiques.
   ============================================================ */

/* ---------- familles d'evolution ---------- */
const FAM_ROOT = {}, FAM_STAGE = {}, FAM_MEMBERS = {};
(function buildFamilies(){
  for(const id of POKE_IDS){
    let cur = id, depth = 0, guard = 0;
    while(POKE[cur].from && guard++ < 5){ cur = POKE[cur].from; depth++; }
    FAM_ROOT[id] = cur; FAM_STAGE[id] = depth;
    (FAM_MEMBERS[cur] = FAM_MEMBERS[cur] || []).push(id);
  }
})();
function famOf(id){ return FAM_ROOT[id]; }
function stageOf(id){ return FAM_STAGE[id]; }
function famSize(root){ return (FAM_MEMBERS[root]||[]).length; }
function isLegend(id){ return POKE[id].leg > 0; }

/* ---------- valeur d'une carte ---------- */
function cardChips(c){
  const p = POKE[c.id];
  let v = 8 + Math.floor(p.bst / 20);
  v += stageOf(c.id) * 6;
  if(c.shiny) v += 25;
  if(isLegend(c.id)) v += 40;
  if(c.ed === "corrupt") v += 45;
  return v;
}

/* ---------- types de mains ---------- */
/* chaque entree : detecte la combinaison et renvoie les cartes qui marquent */
const HANDS = [

   f:cs=>{ if(cs.length<5) return null;
           for(let a=1;a<=18;a++){
             const A=cs.filter(c=>POKE[c.id].types.includes(a));
             if(A.length<3) continue;
             const rest=cs.filter(c=>!A.slice(0,3).includes(c));
             for(let b=1;b<=18;b++){ if(b===a) continue;
               const B=rest.filter(c=>POKE[c.id].types.includes(b));
               if(B.length>=2) return [...A.slice(0,3),...B.slice(0,2)]; } }
           return null; }},

  {id:"duo_evo", n:"Duo Évolutif", chips:25, mult:3,
   d:"Deux cartes de la même famille, espèces différentes.",
   f:cs=>{ for(const g of groupBy(cs,c=>famOf(c.id)))
             if(g.length>=2 && new Set(g.map(c=>c.id)).size>=2){
               const seen=new Set(), out=[];
               for(const c of g){ if(!seen.has(c.id)){ seen.add(c.id); out.push(c); } if(out.length===2) break; }
               return out; }
           return null; }},

  {id:"paire", n:"Paire", chips:15, mult:2,
   d:"Deux fois la même espèce.",
   f:cs=>groupBy(cs,c=>c.id).find(g=>g.length>=2)?.slice(0,2) || null},

  {id:"sauvage", n:"Rencontre Sauvage", chips:5, mult:1,
   d:"Aucune combinaison.",
   f:cs=>cs.length ? [cs.slice().sort((a,b)=>cardChips(b)-cardChips(a))[0]] : null}
];
const HANDS_BY_ID = Object.fromEntries(HANDS.map(h=>[h.id,h]));

function groupBy(arr, key){
  const m = new Map();
  for(const x of arr){ const k = key(x); (m.get(k) || m.set(k,[]).get(k)).push(x); }
  return [...m.values()].sort((a,b)=>b.length-a.length);
}

function handLevel(id){ return (S && S.poker && S.poker.levels && S.poker.levels[id]) || 0; }
function handBase(id){
  const h = HANDS_BY_ID[id], lv = handLevel(id);
  return {chips: h.chips + lv*Math.max(12, Math.round(h.chips*0.35)),
          mult:  h.mult  + lv*Math.max(1,  Math.round(h.mult *0.30))};
}
/* on evalue toutes les combinaisons possibles et on garde la plus rentable */
function evalHand(cards){
  let best = null, bestVal = -1;
  for(const h of HANDS){
    let cs = null;
    try { cs = h.f(cards); } catch(e){ cs = null; }
    if(!cs || !cs.length) continue;
    const b = handBase(h.id);
    const v = b.chips * b.mult;
    if(v > bestVal){ bestVal = v; best = {key:h.id, n:h.n, scoring:cs}; }
  }
  return best || {key:"sauvage", n:"Rencontre Sauvage", scoring:cards.slice(0,1)};
}

const ANTE_BASE = [0, 300, 800, 2000, 5000, 11000, 20000, 35000, 50000,
                   80000, 130000, 210000, 340000, 550000, 900000, 1500000];
function anteTarget(ante, blind, boss){
  const i = Math.min(ante, ANTE_BASE.length-1);
  const base = ANTE_BASE[i] || ANTE_BASE[ANTE_BASE.length-1] * Math.pow(1.6, ante-15);
  let t = base * [1, 1.5, 2][blind];
  if(boss && boss.f.target) t *= boss.f.target;
  return Math.round(t);
}

/* ---------- construction du deck ---------- */
const BASE_FAMS = [1,4,7,10,13,16,19,21,23,25,27,29,32,41,43,46,50,54,58,60,63,66,69,74,92,129,133];
function newDeck(){
  const out = [];
  let u = 0;
  const push = (id, shiny) => out.push({u:u++, id, shiny:!!shiny, ed:""});
  /* chaque famille retenue apporte sa lignee complete : les combos evolutifs sont atteignables */
  const fams = shuffle(BASE_FAMS).slice(0, 14);
  for(const root of fams) for(const m of (FAM_MEMBERS[root]||[root])) push(m);
  /* on complete a 52 par des doublons, ce qui rend paires et brelans possibles */
  const pool = out.map(c=>c.id);
  while(out.length < 52) push(pick(pool));
  return out.slice(0, 52);
}

/* ---------- etat de partie ---------- */
function startPoker(){
  S.poker = {
    ante:1, blind:0, state:"blind",
    score:0, target:anteTarget(1,0),
    hands:4, discards:3, handsLeft:4, discardsLeft:3,
    handSize:8, slots:5, econ:0,
    deck:newDeck(), draw:[], hand:[], sel:[],
    jokers:[], licences:[], levels:{},
    boss:null, playedTypes:{}, discardedThisRound:0, roundHands:0, noDiscard:true,
    stage:"ante", eliteIdx:0, badges:[],
    octets:4, shop:null, endless:false, lastHand:null
  };
  S.pokerMeta.unlocked = true;
  tutoMaybe("poker");
  save(); go("poker");
}

function pkStartRound(){
  const P = S.poker;
  P.boss = P.blind === 2 ? pick(BOSS_BLINDS) : null;
  const f = P.boss ? P.boss.f : {};
  const st = pkStage();
  let base;
  if(st === "elite")         base = Math.round(anteTarget(9, 2) * (1 + (P.eliteIdx||0) * 0.45));
  else if(st === "champion") base = Math.round(anteTarget(9, 2) * 3.4);
  else                       base = anteTarget(P.ante, P.blind, P.boss);
  P.target = Math.round(base * (P.discount || 1));
  P.discount = 1;
  P.score = 0;
  P.handsLeft = f.oneHand ? 1 : P.hands - (f.lessHand||0);
  P.discardsLeft = Math.max(0, P.discards - (f.lessDiscard||0));
  P.draw = shuffle(P.deck.map(c=>Object.assign({}, c)));
  P.hand = []; P.sel = [];
  P.roundHands = 0; P.discardedThisRound = 0;
  P.state = "play";
  pkDraw();
  save();
}
function drawSize(){
  const P = S.poker;
  return P.handSize + P.jokers.filter(j=>jokerDef(j)?.passive==="draw").length;
}
function pkDraw(){
  const P = S.poker;
  while(P.hand.length < drawSize() && P.draw.length) P.hand.push(P.draw.pop());
  P.hand.sort((a,b)=> famOf(a.id)-famOf(b.id) || a.id-b.id);
}
function selCards(){
  const P = S.poker;
  return P.sel.map(u=>P.hand.find(c=>c.u===u)).filter(Boolean);
}
function pkToggle(u){
  const P = S.poker;
  const i = P.sel.indexOf(u);
  if(i >= 0) P.sel.splice(i,1);
  else { if(P.sel.length >= 5) return; P.sel.push(u); }
  pkRenderLive();
}

/* ---------- calcul du score ----------
   En plus du total, on enregistre la trace : quelle carte, quel programme,
   dans quel ordre, et ce que chacun a ajoute. C'est cette trace qui est
   rejouee a l'ecran pour que le joueur voie d'ou vient son score. */
function pkScore(preview){
  const P = S.poker;
  const played = selCards();
  if(!played.length) return null;
  const ev = evalHand(played);
  const f = P.boss ? P.boss.f : {};
  const base = handBase(ev.key);

  const x = {chips:base.chips, mult:base.mult, handKey:ev.key, handName:ev.n,
             played, inHandLeft:P.hand.length - played.length, st:P, cancel:false,
             scored:[], steps:[], base};

  /* chaque etape note l'etat AVANT, pour pouvoir afficher le delta a l'ecran */
  const step = (kind, label, ref) => {
    const c0 = x.chips, m0 = x.mult;
    return () => x.steps.push({kind, label, ref,
      dc: Math.round(x.chips - c0), dm: +(x.mult - m0).toFixed(2),
      chips: Math.round(x.chips), mult: +x.mult.toFixed(2),
      mulMode: Math.abs(x.mult - m0) > 0.001 && Math.abs((x.mult / (m0 || 1)) - 1) > 0.001 && m0 > 0
               && Math.abs(x.mult - m0 - Math.round(x.mult - m0)) > 0.001});
  };

  x.steps.push({kind:"base", label:ev.n, dc:base.chips, dm:base.mult,
                chips:base.chips, mult:base.mult});

  let scoring = ev.scoring.slice();
  if(f.maxScore) scoring = scoring.filter(c=>played.indexOf(c) < f.maxScore);

  for(const c of scoring){
    if(f.deadType && POKE[c.id].types.includes(f.deadType)) continue;
    if(f.deadEvo && stageOf(c.id) > 0) continue;
    if(f.deadShiny && c.shiny) continue;
    if(f.deadLegend && isLegend(c.id)) continue;
    const commit = step("card", POKE[c.id].name, c.u);
    x.chips += cardChips(c);
    if(c.ed === "glass") x.mult *= 2;
    if(c.ed === "gold" && !preview) P.octets += 3;
    x.scored.push(c);
    for(const j of P.jokers){
      const def = jokerDef(j);
      if(def && def.onCard) def.onCard(c, x, j);
    }
    commit();
  }
  for(let i=0;i<P.jokers.length;i++){
    let def = jokerDef(P.jokers[i]);
    if(def && def.mirror && i > 0) def = jokerDef(P.jokers[i-1]) || def;
    if(def && def.onHand){
      const commit = step("joker", def.n, i);
      def.onHand(x, P.jokers[i]);
      commit();
    }
  }
  if(f.firstZero && P.roundHands === 0){
    const commit = step("boss", P.boss.n);
    x.chips = 0; x.mult = 0; commit();
  }
  if(x.cancel){
    const commit = step("boss", "Main annulée");
    x.chips = 0; x.mult = 0; commit();
  }
  x.total = Math.round(x.chips * x.mult);
  /* on ne garde que les etapes qui ont reellement change quelque chose */
  x.steps = x.steps.filter((st,i)=> i === 0 || st.dc !== 0 || Math.abs(st.dm) > 0.001);
  return x;
}

/* ---------- résolution animée ----------
   Le score ne saute plus d'un coup : chaque carte puis chaque programme
   se declenche a l'ecran, avec son apport. C'est la seule facon de
   comprendre d'ou vient un gros score, et de vouloir le reproduire. */
let RESOLVE = null;

function pkPlay(){
  const P = S.poker;
  if(P.state !== "play" || !P.sel.length || P.handsLeft <= 0 || RESOLVE) return;
  const res = pkScore(false);
  if(!res) return;
  P.resolvePlayed = selCards().map(c=>c.u);
  P.state = "resolve";
  RESOLVE = {res, i:0, chips:0, mult:0, timer:null, done:false};
  refresh();
  RESOLVE.timer = setTimeout(stepResolve, 260);
}

function stepResolve(){
  if(!RESOLVE) return;
  const st = RESOLVE.res.steps[RESOLVE.i];
  if(!st){ endResolveSteps(); return; }
  RESOLVE.i++;
  RESOLVE.chips = st.chips;
  RESOLVE.mult  = st.mult;
  paintResolve(st);
  RESOLVE.timer = setTimeout(stepResolve, st.kind === "base" ? 430 : 330);
}

function paintResolve(st){
  const line = document.getElementById("pk-score-line");
  if(line){
    line.innerHTML = `<span class="pk-hn">${esc(RESOLVE.res.handName)}</span>
      <span class="chips" id="pk-chips">${fmt(RESOLVE.chips)}</span><span class="muted">×</span>
      <span class="mult" id="pk-mult">${RESOLVE.mult.toFixed(RESOLVE.mult % 1 ? 2 : 0)}</span>`;
    const cEl = document.getElementById("pk-chips"), mEl = document.getElementById("pk-mult");
    if(st.dc) bump(cEl);
    if(Math.abs(st.dm) > 0.001) bump(mEl);
  }
  /* cible du declenchement : carte jouee ou programme */
  let target = null;
  if(st.kind === "card") target = document.querySelector(`#hand .pcard[data-u="${st.ref}"]`);
  if(st.kind === "joker") target = document.querySelector(`#jokers .joker[data-i="${st.ref}"]`);
  if(st.kind === "boss")  target = document.querySelector(".blind-card");
  if(target){
    target.classList.remove("trigger"); void target.offsetWidth; target.classList.add("trigger");
    floatDelta(target, st);
  }
  if(st.kind === "joker"){ Sfx.wobble(); buzz(8); }
  else if(st.kind === "boss"){ Sfx.glitch(); }
  else Sfx.click();
}
function bump(el){
  if(!el) return;
  el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick");
}
function floatDelta(target, st){
  const host = document.getElementById("poker-felt");
  if(!host) return;
  const parts = [];
  if(st.dc) parts.push({t:"+" + fmt(st.dc), c:"var(--cyan)"});
  if(Math.abs(st.dm) > 0.001){
    parts.push(st.mulMode ? {t:"×" + (st.mult / Math.max(0.01, st.mult - st.dm)).toFixed(2), c:"var(--magenta)"}
                          : {t:"+" + st.dm.toFixed(st.dm % 1 ? 1 : 0) + " Mult", c:"var(--magenta)"});
  }
  if(!parts.length) return;
  const r = target.getBoundingClientRect(), h = host.getBoundingClientRect();
  parts.forEach((p, k)=>{
    const d = document.createElement("div");
    d.className = "pkdelta";
    d.textContent = p.t;
    d.style.color = p.c;
    d.style.left = (r.left - h.left + r.width/2 - 20) + "px";
    d.style.top  = (r.top  - h.top  - 6 + k*14) + "px";
    host.appendChild(d);
    setTimeout(()=>d.remove(), 900);
  });
}

function endResolveSteps(){
  if(!RESOLVE || RESOLVE.done) return;
  RESOLVE.done = true;
  const total = RESOLVE.res.total;
  const line = document.getElementById("pk-score-line");
  if(line){
    line.innerHTML = `<span class="pk-total">${fmt(total)}</span>`;
    const el = line.firstElementChild;
    if(el){ el.classList.add("burst"); }
  }
  const felt = document.getElementById("poker-felt");
  if(felt && total > 0){
    Sfx.win();
    burstEl(felt, {n: total > S.poker.target*0.4 ? 28 : 14, spread:110,
      colors:["#35f0d6","#ffc857","#ffffff"], dur:900});
  }
  RESOLVE.timer = setTimeout(commitResolve, 820);
}
/* un appui saute l'animation sans rien changer au resultat */
function skipResolve(){
  if(!RESOLVE || RESOLVE.done) return;
  clearTimeout(RESOLVE.timer);
  RESOLVE.i = RESOLVE.res.steps.length;
  const last = RESOLVE.res.steps[RESOLVE.res.steps.length-1];
  if(last){ RESOLVE.chips = last.chips; RESOLVE.mult = last.mult; }
  endResolveSteps();
}

function commitResolve(){
  const P = S.poker;
  if(!RESOLVE) return;
  const res = RESOLVE.res;
  clearTimeout(RESOLVE.timer);
  RESOLVE = null;
  const played = P.resolvePlayed || [];
  P.resolvePlayed = null;
  P.state = "play";

  P.playedTypes[res.handKey] = (P.playedTypes[res.handKey]||0) + 1;
  P.score += res.total;
  P.handsLeft--; P.roundHands++;
  P.lastHand = {key:res.handKey, n:res.handName, chips:Math.round(res.chips),
                mult:+res.mult.toFixed(2), total:res.total};

  for(const j of P.jokers){
    const def = jokerDef(j);
    if(def && def.onAfter) def.onAfter(res, j);
    if(def && def.fragile) j.uses = (j.uses||0)+1;
  }
  P.jokers = P.jokers.filter(j=>{
    const def = jokerDef(j);
    if(def && def.fragile && (j.uses||0) >= def.fragile){
      toast(def.n + " s'est brisé.", "bad", "cross"); return false;
    }
    return true;
  });
  for(const c of res.played) if(c.ed === "glass") P.deck = P.deck.filter(x=>x.u !== c.u);

  P.hand = P.hand.filter(c=>!played.includes(c.u));
  P.sel = [];
  pkDraw();
  buzz(14);

  if(P.score >= P.target){ pkWinBlind(); return; }
  if(P.handsLeft <= 0){ pkLose(); return; }
  save(); refresh();
}

function pkDiscard(){
  const P = S.poker;
  if(P.state !== "play" || !P.sel.length || P.discardsLeft <= 0) return;
  P.discardsLeft--;
  P.noDiscard = false;
  P.discardedThisRound += P.sel.length;
  P.hand = P.hand.filter(c=>!P.sel.includes(c.u));
  P.sel = [];
  pkDraw();
  Sfx.click(); save(); refresh();
}

ACTIONS.pkshop = () => { closeSheet(); const P = S.poker; P.state = "shop"; pkRollShop(); save(); refresh(); };
function pkRollShop(){
  const P = S.poker;
  const owned = P.jokers.map(j=>j.id);
  const pool = JOKERS.filter(j=>!owned.includes(j.id));
  const weighted = [];
  for(const j of pool){ const w = [10,6,3,1][j.rar]; for(let i=0;i<w;i++) weighted.push(j); }
  const offer = [];
  for(let i=0;i<2 && weighted.length;i++){ const j = pick(weighted); if(!offer.includes(j)) offer.push(j); }
  const lic = LICENCES.filter(l=>!P.licences.includes(l.id));
  const prev = P.shop?.rerolls || 0;
  P.shop = {
    jokers: offer.map(j=>({id:j.id, cost:j.cost})),
    boosters: shuffle(BOOSTERS).slice(0,2).map(b=>({id:b.id, cost:b.cost})),
    licence: lic.length ? {id:pick(lic).id} : null,
    consum: (()=>{  /* une planète le plus souvent, un spectre de temps en temps */
      if(rng() < 0.72){ const p = pick(PLANETS); return {kind:"planet", id:p.id, cost:p.cost}; }
      const sp = pick(SPECTRALS); return {kind:"spectral", id:sp.id, cost:sp.cost};
    })(),
    rerolls: prev, rerollCost: Math.max(1, 2 + prev - (P.rerollCut||0))
  };
}
ACTIONS.pkreroll = () => {
  const P = S.poker;
  if(P.octets < P.shop.rerollCost) return;
  P.octets -= P.shop.rerollCost;
  const r = P.shop.rerolls + 1;
  pkRollShop(); P.shop.rerolls = r; P.shop.rerollCost = Math.max(1, 2 + r - (P.rerollCut||0));
  save(); refresh();
};
function jokerSlots(){
  const P = S.poker;
  return P.slots + P.jokers.filter(j=>jokerDef(j)?.passive==="slot").length;
}
ACTIONS.pkbuyj = d => {
  const P = S.poker, off = P.shop.jokers[+d.i];
  if(!off || P.octets < off.cost) return;
  if(P.jokers.length >= jokerSlots()){ toast("Aucun emplacement libre", "bad", "cross"); return; }
  const def = JOKERS.find(j=>j.id===off.id);
  P.octets -= off.cost;
  P.jokers.push({id:off.id, mem:0, uses:0});
  if(def.passive === "discard") P.discards++;
  if(def.passive === "hand") P.hands++;
  P.shop.jokers.splice(+d.i,1);
  Sfx.coin(); save(); refresh();
};
ACTIONS.pkbuylic = () => {

/* ---------- boosters : ajouter des cartes au deck ---------- */
function boosterPool(kind){
  const P = S.poker;
  const arch = Object.keys(S.dex).map(Number);
  let pool = arch.length >= 12 ? arch : POKE_IDS.filter(i=>i<=151);
  if(kind === "evo")    pool = pool.filter(i=>stageOf(i) > 0);
  if(kind === "legend") pool = POKE_IDS.filter(i=>isLegend(i) && (S.dex[i] || i<=151));
  if(kind === "type"){
    const t = randInt(1,18);
    const f = pool.filter(i=>POKE[i].types.includes(t));
    if(f.length >= 3) pool = f;
  }
  if(P.rareBoost) pool = pool.slice().sort((a,b)=>POKE[b].bst-POKE[a].bst).slice(0, Math.max(8, Math.floor(pool.length/3)));
  if(!pool.length) pool = POKE_IDS.filter(i=>i<=151);
  return pool;
}
ACTIONS.pkbuyb = d => {
  const P = S.poker, off = P.shop.boosters[+d.i];
  if(!off || P.octets < off.cost) return;
  const b = BOOSTERS.find(x=>x.id===off.id);
  P.octets -= off.cost;
  P.shop.boosters.splice(+d.i,1);
  const pool = boosterPool(b.kind);
  const picks = [];
  for(let i=0;i<3 && pool.length;i++){ const id = pick(pool); if(!picks.includes(id)) picks.push(id); }
  const shiny = b.kind === "shiny" || rng() < 0.04*(P.shinyBoost||1);
  P.pendingBooster = {picks, shiny, n:b.n};
  save(); pkShowBooster();
};

function applyPlanet(id){
  const P = S.poker;
  const pl = PLANETS.find(x=>x.id===id);
  P.levels[pl.hand] = (P.levels[pl.hand]||0) + 1;
  const b = handBase(pl.hand);
  toast(`${HANDS_BY_ID[pl.hand].n} niveau ${P.levels[pl.hand]+1} — ${b.chips} × ${b.mult}`, "warn", "bolt");
  Sfx.win();
}
function applySpectral(id){
  const P = S.poker;
  const sp = SPECTRALS.find(x=>x.id===id);
  if(sp.card){ pkPickCard(id); return; }
  if(id === "sp_hole"){
    for(const h of HANDS) P.levels[h.id] = (P.levels[h.id]||0) + 1;
    toast("Toutes les combinaisons gagnent un niveau", "warn", "star"); Sfx.win();
  }
  if(id === "sp_forge"){
    const owned = P.jokers.map(j=>j.id);
    const pool = JOKERS.filter(j=>j.rar === 3 && !owned.includes(j.id));
    if(!pool.length || P.jokers.length >= jokerSlots()){
      P.octets += 8; toast("Aucun emplacement libre — 8 Octets rendus", "bad", "coin"); return;
    }
    const j = pick(pool);
    P.jokers.push({id:j.id, mem:0, uses:0});
    toast("Programme légendaire : " + j.n, "warn", "star"); Sfx.win();
  }
  if(id === "sp_ante"){ P.discount = 0.75; toast("Prochain verrou abaissé de 25%", "warn", "bolt"); }
}
function pkPickCard(spectralId){
  const P = S.poker;
  const sp = SPECTRALS.find(x=>x.id===spectralId);
  const pool = shuffle(P.deck).slice(0, 12);
  sheet(`${sheetHead(sp.n)}
    <div class="tiny muted" style="margin-bottom:9px">${esc(sp.d)}</div>
    <div class="wrap" style="justify-content:center">

ACTIONS.pkspcard = d => {
  const P = S.poker;
  const c = P.deck.find(x=>x.u === +d.u);
  if(!c) return;
  const k = d.k;
  if(k === "sp_del"){ P.deck = P.deck.filter(x=>x.u !== c.u); toast("Carte retirée", "", "cross"); }
  else if(k === "sp_dup"){
    const maxU = P.deck.reduce((a,x)=>Math.max(a,x.u), 0);
    P.deck.push(Object.assign({}, c, {u:maxU+1}));
    toast("Carte dupliquée", "", "check");
  }
  else if(k === "sp_shiny"){ c.shiny = true; toast("Carte chromatique", "warn", "star"); }
  else if(k === "sp_evo"){
    const evo = POKE[c.id].evo;
    if(evo && evo.length){ c.id = evo[0].to; toast("Réécrite en " + POKE[c.id].name, "warn", "bolt"); }
    else toast("Cette espèce n'évolue pas", "bad", "cross");
  }
  else c.e = {sp_gold:"gold", sp_glass:"glass", sp_corrupt:"corrupt"}[k];
  closeSheet(); save(); refresh();
};
ACTIONS.pkbuycon = () => {

  if(!off || P.octets < off.cost) return;
  P.octets -= off.cost;
  P.shop.consum = null;
  if(off.kind === "planet") applyPlanet(off.id); else applySpectral(off.id);

ACTIONS.pknext = () => {
  const P = S.poker;
  const st = pkStage();
  if(st === "elite"){
    P.eliteIdx = (P.eliteIdx || 0) + 1;
    if(P.eliteIdx >= ELITE_NAMES.length){ P.stage = "champion"; P.eliteIdx = 0; }
  } else if(st === "champion"){
    /* au-dela, la Couche Zero recommence le cycle des antes */
    P.stage = "ante"; P.ante++; P.blind = 0;
  } else {
    P.blind++;
    if(P.blind > 2){
      P.blind = 0; P.ante++;
      if(P.ante > 8 && (P.badges||[]).length >= 8){ P.stage = "elite"; P.eliteIdx = 0; }
    }
  }
  P.state = "blind"; save(); refresh();
};

  toast(`Contourné : +${3+P.blind} Octets et ${HANDS_BY_ID[k].n} niveau ${P.levels[k]+1}`, "warn", "bolt");

};

let DEX_FILTER = {region:"kanto", mode:"all", type:0};

function dupCost(id){ return 2 + POKE[id].rar; }
function evoCoinCost(id){ return 400 * (POKE[id].rar + 1); }
function canEvolve(id, e){
  const en = S.dex[id];
  if(!en) return {ok:false, why:"Espèce non archivée."};
  if(en.lvl < e.lvl) return {ok:false, why:`Niveau ${e.lvl} requis (actuel ${en.lvl}).`};
  if(en.c < dupCost(id)) return {ok:false, why:`${dupCost(id)} exemplaires requis (${en.c}).`};
  if(!canPay("coins", evoCoinCost(id))) return {ok:false, why:`${fmt(evoCoinCost(id))} PokéCoins requis.`};
  if(e.stone && (S.stones[e.stone]||0) <= 0)
    return {ok:false, why:`${STONES[e.stone]?.name||"Pierre"} requise.`};
  return {ok:true};
}

ACTIONS.evolve = d => {
  const id = +d.id, to = +d.to;
  const ev = POKE[id].evo.find(x=>x.to === to);
  const chk = canEvolve(id, ev);
  if(!chk.ok) return;
  pay("coins", evoCoinCost(id));
  if(ev.stone) S.stones[ev.stone]--;
  const en = S.dex[id];
  en.c -= dupCost(id);
  const lvl = en.lvl;
  const isNew = addToDex(to, lvl, false);
  S.dex[to].lvl = Math.max(S.dex[to].lvl, lvl);
  S.stats.evolutions++; S.daily.dayEvo++; questTick("dayEvo",1);
  addIntegrity(RARITY[POKE[to].rar].integ * (isNew?0.85:0.05));
  addXp(80 + POKE[to].bst/4);
  pzFlash(pzLine("evolve"));
  save(); checkAchievements(); guideTick();
  closeSheet();

/* ---------- animation d'évolution ----------
   Reprise du rythme des jeux officiels : la silhouette blanchit, les deux
   formes alternent de plus en plus vite, puis la nouvelle s'impose. */
let EVO = null;
function playEvolution(from, to, isNew){
  const box = document.getElementById("discover");
  if(!box){ toast(POKE[to].name + " !", "warn", "star"); return; }
  box.className = "on evo";
  box.style.setProperty("--ac", TYPE_TINT[POKE[to].types[0]-1]);
  box.innerHTML = `
    <div class="evo-rays"></div>
    <div class="dc-inner">
      <div class="dc-kicker" id="ev-kick">RÉÉCRITURE EN COURS</div>
      <div class="evo-stage" id="ev-stage">
        <span class="evo-ring"></span><span class="evo-ring d2"></span><span class="evo-ring d3"></span>
        <span class="evo-spr" id="ev-spr">
          <span class="sprbox" style="width:150px;height:150px">${sprite(from, false, "")}</span>
        </span>
      </div>
      <div class="dc-name" id="ev-name"></div>
      <div class="wrap dc-tags" id="ev-tags" style="justify-content:center"></div>
      <div class="dc-lore" id="ev-lore"></div>
      <button class="btn pri wide dc-ok" id="ev-ok" data-act="dcdone">Continuer</button>
    </div>`;

  EVO = {timers:[], from, to};
  const at = (ms, fn) => EVO.timers.push(setTimeout(fn, ms));
  const holder = () => document.getElementById("ev-spr");
  const setForm = id => {
    const h = holder();
    if(h) h.innerHTML = `<span class="sprbox" style="width:150px;height:150px">${sprite(id, false, "")}</span>`;
  };

  /* la silhouette blanchit, puis les formes alternent de plus en plus vite */
  at(220, ()=>{ const h = holder(); if(h) h.classList.add("white"); Sfx.wobble(); });
  const rhythm = [700, 1120, 1500, 1840, 2140, 2400, 2620, 2800, 2950, 3070, 3170, 3255];
  rhythm.forEach((t, i)=>at(t, ()=>{
    setForm(i % 2 === 0 ? to : from);
    const h = holder(); if(h) h.classList.add("white");
    Sfx.click(); if(i % 3 === 0) buzz(8);
  }));

  at(3420, ()=>{
    setForm(to);
    const h = holder();
    if(h){ h.classList.remove("white"); h.classList.add("done"); }
    box.classList.add("flash");
    setTimeout(()=>box.classList.remove("flash"), 300);
    const st = document.getElementById("ev-stage");
    if(st) burstEl(st, {n:34, spread:170, colors:["#ffffff","#35f0d6","#ffc857"], dur:1000});
    Sfx.win(); buzz([25,45,80]);

    const k = document.getElementById("ev-kick");
    if(k){ k.textContent = isNew ? "NOUVELLE ENTRÉE D'ARCHIVE" : "RÉÉCRITURE TERMINÉE"; k.classList.add("done"); }
    const n = document.getElementById("ev-name");
    if(n){ n.innerHTML = `${esc(POKE[from].name)} <span class="evo-arrow">▸</span> ${esc(POKE[to].name)}`;
           n.classList.add("in"); }
    const tg = document.getElementById("ev-tags");
    if(tg){ tg.innerHTML = typeTags(POKE[to].types) + rarTag(POKE[to].rar) +
      `<span class="tt t1">Niv.${S.dex[to].lvl}</span>` +
      (isNew ? '<span class="tt" style="color:var(--green);border-color:var(--green)">INÉDIT</span>' : "");
      tg.classList.add("in"); }
    const lo = document.getElementById("ev-lore");
    if(lo){ lo.textContent = loreOf(to); lo.classList.add("in"); }
    const ok = document.getElementById("ev-ok");
    if(ok) ok.classList.add("in");
    EVO = null;
  });
}

/* teintes de type, partagees avec les cartes de collection */
const TYPE_TINT = ["#66665a","#94503a","#546c9e","#7e4599","#8e7845","#7e704f","#6c852f","#5f4f9e",
  "#728292","#aa6025","#3471ad","#338f51","#ab9427","#a94173","#4f97a5","#5647ad","#70584c","#a86694"];
function weaknessOf(p){
  let best = 0, bestM = 1;
  for(let t = 1; t <= 18; t++){ const m = typeMult(t, p.types); if(m > bestM){ bestM = m; best = t; } }
  return best;
}

let PROF_TAB = "stats";

/* L'avatar n'est plus « le dernier Pokemon archivé » : c'est un choix, et
   certaines pieces se meritent. */
function avatarPool(){
  const out = [];
  const owned = ownedSorted();
  for(const id of owned) out.push({k:"mon:"+id, id, n:POKE[id].name, g:"Archive"});
  for(const id of owned) if(S.dex[id].shiny)
    out.push({k:"shiny:"+id, id, shiny:true, n:POKE[id].name + " chromatique", g:"Chromatiques"});
  for(const r of REGIONS) for(const g of r.guardians){
    const beaten = S.bosses.includes(r.key + ":" + g.id);
    out.push({k:"guard:"+g.id, id:g.id, n:g.name, g:"Verrous levés",
              locked:!beaten, why:"Relâcher " + g.name});
  }
  out.push({k:"pz", id:474, n:"Porygon-Z", g:"Prestige",
            locked:!S.flags.climax, why:"Atteindre l'épilogue"});
  out.push({k:"mn", id:0, n:"Sans index", g:"Prestige",
            locked:!(S.cards && S.cards["mn:0"]), why:"Obtenir la pièce secrète"});
  return out;
}
function avatarKey(){
  const k = S.cos.avatar;
  if(k && typeof k === "string") return k;
  if(typeof k === "number" && S.dex[k]) return "mon:" + k;     /* ancienne sauvegarde */
  const ids = ownedSorted();
  return ids.length ? "mon:" + ids[0] : "mon:25";
}
function avatarHtml(size){
  const k = avatarKey();
  const [kind, raw] = k.split(":");
  const id = +raw;
  if(kind === "mn") return `<span class="spr missing" style="width:${size}px;height:${size}px"></span>`;
  if(kind === "pz") return pzFace(pzMood(), size);
  return `<span class="sprbox" style="width:${size}px;height:${size}px">
    ${sprite(id || 25, kind === "shiny", "", {anim:true})}</span>`;
}

/* ===== 72-bag.js ===== */
/* ============================================================
   72 — SAC
   Tout ce que le joueur possède, au même endroit, avec l'usage
   possible sur place. Rien ne s'achète plus « dans le vide » :
   un objet acheté se range ici et s'active quand on le décide.
   ============================================================ */

let BAG_TAB = "balls";

function bagCounts(){
  const nBalls   = Object.values(S.balls || {}).reduce((a,b)=>a+b, 0);
  const nBerries = Object.values(S.berries || {}).reduce((a,b)=>a+b, 0);
  const nBoosts  = Object.values(S.bagBoosts || {}).reduce((a,b)=>a+b, 0);
  const nItems   = (S.items.potion||0) + (S.items.revive||0) + (S.items.radar||0);
  const nStones  = Object.values(S.stones || {}).reduce((a,b)=>a+b, 0);
  const nTreas   = Object.values(S.treasures || {}).reduce((a,b)=>a+b, 0);
  const nHeld    = heldOwned().length;
  return {balls:nBalls, berries:nBerries, boosts:nBoosts, items:nItems,
          stones:nStones, treasures:nTreas, held:nHeld};
}

/* une ligne d'objet : visuel, nom, description, quantité, action éventuelle */
function bagRow(opts){
  return `<div class="bagrow">
    <div class="bag-ic">${opts.spr !== undefined
      ? `<span class="sprbox" style="width:34px;height:34px">${sprite(opts.spr,false,"")}</span>`
      : ic(opts.icon || "star")}</div>
    <div class="grow">
      <div class="row between" style="gap:6px">
        <span class="bag-n">${esc(opts.n)}</span>
        <span class="bag-q mono-num">×${fmt(opts.q)}</span>
      </div>
      <div class="bag-d">${opts.d}</div>
      ${opts.extra || ""}
    </div>
    ${opts.action || ""}
  </div>`;
}

SCREENS.bag = {
  html(){
    const c = bagCounts();
    /* le sac ne liste que ce sur quoi on agit ; le reste se consulte en un coup d'oeil */
    const tabs = [
      ["boosts","Boosts",c.boosts], ["items","Objets",c.items],
      ["held","Tenus",c.held], ["treasures","Trésors",c.treasures]
    ];

  /* consommables rattaches a un ecran precis : on les montre, on n'y agit pas */

      const items = entries.filter(([,q])=>q > 0);

      return `<div class="resrow">
        <div class="res-l">${label}</div>

    return `<div class="panel tight reserves">
      <div class="h sm">RÉSERVES</div>${body}</div>`;
  },

  balls(){
    const rows = Object.entries(BALLS).filter(([k])=>(S.balls[k]||0) > 0);
    if(!rows.length) return this.empty("Aucun conteneur. Sans ball, aucune capture n'est possible.");
    return `<div class="baglist">
      ${rows.map(([k,b])=>bagRow({icon:b.icon, n:b.name, q:S.balls[k], d:esc(b.d),

    </div>`;
  },

  berries(){
    const rows = Object.entries(BERRIES).filter(([k])=>(S.berries[k]||0) > 0);
    if(!rows.length) return this.empty("Aucune baie. Elles se consomment avant un lancer et n'ont d'effet que sur la rencontre en cours.");

      }).join("")}

  },

  items(){
    const list = [];
    if(S.items.potion) list.push(bagRow({icon:"heart", n:"Restauration", q:S.items.potion,
      d:"Rend 55% des points de vie d'un Pokémon, pendant un combat.",
      extra:`<div class="tiny dim">S'utilise depuis l'écran de combat.</div>`}));
    if(S.items.revive) list.push(bagRow({icon:"refresh", n:"Réindexation", q:S.items.revive,

    if(S.items.radar) list.push(bagRow({icon:"boss", n:"Radar Légendaire", q:S.items.radar,

    if(!list.length) return this.empty("Aucun objet. Les restaurations servent en combat, le radar force une rencontre légendaire.");

/* ===== 73-cards.js ===== */
/* ============================================================
   73 — CARTES DE COLLECTION
   Uniquement des légendaires des trois premières générations, plus
   une pièce secrète. Chacun existe en plusieurs illustrations, une
   par génération où il est apparu : plus l'illustration est ancienne,
   plus elle est rare. Quatre légendaires seulement ont une
   illustration Rouge/Bleu — ce sont les pièces de prestige du jeu.
   ============================================================ */

const CARD_SERIES_DEF = {
  art: {n:"Standard",      w:100, c:"#9aa6b5", d:"Illustration contemporaine. La plus répandue."},
  g5:  {n:"Holographique", w:45,  c:"#4fb2ff", d:"Sprite Noir et Blanc. Tirage courant mais recherché."},
  g3:  {n:"Corrompue",     w:18,  c:"#ff3d7f", d:"Sprite Émeraude. L'image tremble par endroits."},
  g2:  {n:"Originelle",    w:6,   c:"#c9a13c", d:"Sprite Cristal. Neuf légendaires seulement l'ont."},
  g1:  {n:"Primordiale",   w:1.5, c:"#e8e2cf", d:"Sprite Rouge et Bleu. Quatre pièces existent."},
  mn:  {n:"Sans index",    w:0,   c:"#8b5cf6", d:"Aucune génération ne la revendique."}
};
const CARD_ORDER = ["art", "g5", "g3", "g2", "g1"];

/* especes concernees, deduites de l'atlas d'illustrations */
const CARD_MONS = (function(){
  const set = new Set();
  for(const k in CARD_INDEX) set.add(+k.split(":")[1]);
  return [...set].sort((a,b)=>a-b);
})();
function cardVariants(id){ return CARD_ORDER.filter(s=>CARD_INDEX[s + ":" + id] !== undefined); }
function cardKey(s, id){ return s + ":" + id; }
function cardHas(s, id){ return !!(S.cards && S.cards[cardKey(s, id)]); }
function cardEntry(s, id){ return S.cards && S.cards[cardKey(s, id)]; }
function cardTotal(){ return Object.keys(CARD_INDEX).length + 1; }   /* +1 : la piece secrete */
function cardOwnedCount(){ return Object.keys(S.cards || {}).length; }

/* ---------- obtention ---------- */
function grantCardV(series, id){
  S.cards = S.cards || {};
  const k = cardKey(series, id);
  if(S.cards[k]){ S.cards[k].dup = (S.cards[k].dup || 0) + 1; return false; }
  S.cards[k] = {t: Date.now(), dup: 0};
  saveSoon();
  return true;
}
/* tirage pondéré ; `bias` releve la chance des series anciennes */
function rollCardSeries(id, bias){
  const pool = [];
  for(const s of cardVariants(id)){
    let w = CARD_SERIES_DEF[s].w;
    if(bias) w *= Math.pow(bias, CARD_ORDER.indexOf(s));
    for(let i = 0; i < Math.max(1, Math.round(w)); i++) pool.push(s);
  }
  return pool.length ? pick(pool) : "art";
}
function randomCard(bias){
  const id = pick(CARD_MONS);
  return {id, s: rollCardSeries(id, bias)};
}
/* pièce secrète : elle ne se tire pas, elle se rencontre */
function grantSecretCard(){
  S.cards = S.cards || {};
  if(S.cards["mn:0"]){ S.cards["mn:0"].dup = (S.cards["mn:0"].dup||0)+1; return false; }
  S.cards["mn:0"] = {t: Date.now(), dup: 0};
  saveSoon();
  return true;
}

/* ---------- rendu ---------- */
function cardArt(series, id, cls){
  /* les variables de grille viennent de l'atlas genere, jamais codees en dur */
  if(series === "mn") return `<span class="cardart mn ${cls||""}"></span>`;
  const i = CARD_INDEX[cardKey(series, id)];
  if(i === undefined) return `<span class="cardart ${cls||""}"></span>`;
  const c = i % CARD_COLS, r = Math.floor(i / CARD_COLS);
  return `<span class="cardart ${cls||""}"
    style="--cc:${c};--cr:${r};--ccols:${CARD_COLS};--crows:${CARD_ROWS}"></span>`;
}
function cardTitleOf(id){
  const g = REGIONS.flatMap(x=>x.guardians).find(x=>x.id === id);
  if(g) return g.title;
  const p = POKE[id];
  return p.leg === 2 ? "Signature fabuleuse" : "Signature légendaire";
}

/* ===== 74-eggs.js ===== */
/* ============================================================
   74 — ŒUFS ET INCUBATION
   Repris de la v1, avec une différence : un œuf n'éclôt pas au
   bout d'un minuteur mais après un nombre de captures. Le module
   récompense donc le jeu, jamais l'attente.
   ============================================================ */

const EGG_TIERS = {
  e_common: {n:"Œuf Commun",     steps:12,  rar:[0,1],     shinyMul:1.5, cores:0,  c:"#5ce07a",
             d:"Une espèce commune ou peu commune de vos secteurs ouverts."},
  e_rare:   {n:"Œuf Rare",       steps:30,  rar:[1,2,3],   shinyMul:3,   cores:4,  c:"#4fb2ff",
             d:"Une espèce peu commune à très rare. Chance de chromatique triplée."},
  e_epic:   {n:"Œuf Épique",     steps:60,  rar:[2,3,4],   shinyMul:6,   cores:9,  c:"#b06bff",
             d:"Une espèce rare à corrompue. Chance de chromatique multipliée par six."},
  e_origin: {n:"Œuf Originel",   steps:120, rar:[3,4,5],   shinyMul:12,  cores:20, c:"#ffd24a",
             d:"Les signatures les plus hautes, légendaires comprises. Chromatique très probable."}
};
const EGG_SLOT_COST = [0, 0, 5, 12];       /* les deux premiers emplacements sont offerts */
const EGG_MAX_SLOTS = 4;

function eggState(){
  S.eggs = S.eggs || {slots:2, inc:[], bag:{}};
  if(!S.eggs.bag) S.eggs.bag = {};
  if(!S.eggs.inc) S.eggs.inc = [];
  return S.eggs;
}
function eggOwned(){ const e = eggState(); return Object.values(e.bag).reduce((a,b)=>a+b, 0); }
function eggSlots(){ return Math.min(EGG_MAX_SLOTS, eggState().slots || 2); }
function eggFreeSlot(){ return eggState().inc.length < eggSlots(); }

function grantEgg(tier){
  const e = eggState();
  e.bag[tier] = (e.bag[tier] || 0) + 1;
  saveSoon();
  return tier;
}
function randomEggTier(){
  const w = {e_common:60, e_rare:26, e_epic:11, e_origin:3};
  const pool = [];
  for(const k in w) for(let i=0;i<w[k];i++) pool.push(k);
  return pick(pool);
}

/* chaque capture fait progresser tous les œufs en incubation */
function eggTick(){
  const e = eggState();
  if(!e.inc.length) return;
  let ready = 0;
  for(const egg of e.inc){
    if(egg.steps < EGG_TIERS[egg.tier].steps) egg.steps++;
    if(egg.steps >= EGG_TIERS[egg.tier].steps) ready++;
  }
  if(ready && !S._eggToast){
    S._eggToast = true;
    toast(ready > 1 ? `${ready} œufs prêts à éclore` : "Un œuf est prêt à éclore", "warn", "box");
    setTimeout(()=>{ S._eggToast = false; }, 30000);
  }
  saveSoon();
}

function eggPool(tier){
  const t = EGG_TIERS[tier];
  const out = [];
  for(const r of unlockedRegions())
    for(let i = r.from; i <= r.to; i++){
      const p = POKE[i];
      if(!p || !t.rar.includes(p.rar)) continue;
      if(p.leg && tier !== "e_origin") continue;        /* les légendaires sont réservés */
      if(isGuardianSpecies(i) && !isReleasedGuardian(i)) continue;
      out.push(i);
    }
  if(!out.length) for(const r of unlockedRegions())
    for(let i = r.from; i <= r.to; i++) if(POKE[i] && !POKE[i].leg) out.push(i);
  return out;
}

ACTIONS.eggput = d => {
  const e = eggState();
  if(!eggFreeSlot()){ toast("Aucun incubateur libre", "bad", "cross"); return; }
  if(!(e.bag[d.t] > 0)) return;
  e.bag[d.t]--;
  e.inc.push({tier:d.t, steps:0, at:Date.now()});
  Sfx.click();
  toast(EGG_TIERS[d.t].n + " placé en incubation", "", "box");
  save(); refresh();
};
ACTIONS.eggback = d => {
  const e = eggState(), i = +d.i;
  const egg = e.inc[i];
  if(!egg || egg.steps >= EGG_TIERS[egg.tier].steps) return;
  e.inc.splice(i, 1);
  e.bag[egg.tier] = (e.bag[egg.tier] || 0) + 1;
  toast("Œuf retiré — la progression est perdue", "bad", "cross");
  save(); refresh();
};
ACTIONS.eggslot = () => {
  const e = eggState();
  const next = eggSlots();
  if(next >= EGG_MAX_SLOTS) return;
  const cost = EGG_SLOT_COST[next];
  if(!pay("cores", cost)){ toast("Noyaux insuffisants", "bad", "cross"); return; }
  e.slots = next + 1;
  Sfx.win();
  toast("Incubateur supplémentaire installé", "warn", "box");
  save(); refresh();
};

ACTIONS.egghatch = d => {
  const e = eggState(), i = +d.i;
  const egg = e.inc[i];
  if(!egg) return;
  const t = EGG_TIERS[egg.tier];
  if(egg.steps < t.steps) return;
  e.inc.splice(i, 1);

  const pool = eggPool(egg.tier);
  const id = pick(pool);
  const shiny = rng() < Math.min(0.35, shinyOdds() * t.shinyMul * 4);
  const lvl = levelFor(POKE[id].rar);
  const isNew = addToDex(id, lvl, shiny);
  addIntegrity(RARITY[POKE[id].rar].integ * (isNew ? 0.85 : 0.04));
  gain("coins", 200 + POKE[id].bst);
  addXp(60 + POKE[id].bst / 3);
  if(shiny){ S.stats.shinies++; S.stats.eggShinies = (S.stats.eggShinies||0) + 1; }
  S.stats.hatched = (S.stats.hatched||0) + 1;
  questTick("dayNew", isNew ? 1 : 0);
  save(); checkAchievements(); guideTick();

  showHatch(id, shiny, isNew, egg.tier);
};

/* ---------- éclosion : l'œuf se fend avant de révéler ---------- */
function showHatch(id, shiny, isNew, tier){
  const box = document.getElementById("discover");
  const t = EGG_TIERS[tier];
  if(!box){ toast("Éclosion : " + POKE[id].name, "warn", "box"); return; }

    <div class="dc-rays"></div>
    <div class="dc-inner">

        <div class="egg" id="hx-egg" style="--ec:${t.c}">

        </div>

            ${sprite(id, shiny, "", {anim:true, eager:true})}</span>
        </div>
      </div>
      <div class="dc-name" id="hx-name"></div>
      <div class="wrap dc-tags" id="hx-tags" style="justify-content:center"></div>
      <div class="dc-lore" id="hx-lore"></div>
      <button class="btn pri wide dc-ok" id="hx-ok" data-act="dcdone">Archiver</button>
    </div>`;

  const egg = document.getElementById("hx-egg");
  const shake = k => setTimeout(()=>{
    if(egg){ egg.classList.remove("crack"); void egg.offsetWidth; egg.classList.add("crack"); }
    Sfx.wobble(); buzz(14);
  }, k);
  shake(220); shake(620); shake(1020);

  setTimeout(()=>{
    if(egg) egg.classList.add("burst");
    const st = document.getElementById("hx-stage");
    if(st) burstEl(st, {n:30, spread:150, colors:[t.c, "#ffffff", shiny?"#ffc857":"#35f0d6"], dur:950});
    const sp = document.getElementById("hx-spr");
    if(sp) sp.classList.add("in");
    box.classList.add("flash");
    setTimeout(()=>box.classList.remove("flash"), 260);
    shiny ? Sfx.shiny() : Sfx.caught();
    buzz([25,40,70]);
    const k = document.getElementById("hx-kick");
    if(k){ k.textContent = isNew ? "NOUVELLE ENTRÉE D'ARCHIVE" : "ÉCLOSION"; k.classList.add("done"); }
    const n = document.getElementById("hx-name");
    if(n){ n.innerHTML = esc(POKE[id].name) + (shiny ? ' <span class="gold-t">◆</span>' : "");
           n.classList.add("in"); }
    const tg = document.getElementById("hx-tags");
    if(tg){ tg.innerHTML = typeTags(POKE[id].types) + rarTag(POKE[id].rar) +
      `<span class="tt t1">Niv.${S.dex[id].lvl}</span>` +

    const lo = document.getElementById("hx-lore");
    if(lo){ lo.textContent = loreOf(id); lo.classList.add("in"); }
    const ok = document.getElementById("hx-ok");
    if(ok) ok.classList.add("in");
  }, 1450);
}

    const e = eggState();

      <div class="h">${ic("box")} COUVEUSE ${infoBtn("eggs")}</div>
      <div class="sub">Un œuf n'éclôt pas avec le temps : il éclôt avec vos captures.
        Chaque restauration fait avancer tous les œufs en incubation.</div>

      <div class="h sm">INCUBATEURS — ${e.inc.length}/${slots}</div>

/* ============================================================
   COMPAGNON
   Un Pokemon vous suit. Il gagne de l'affinite a chaque capture,
   ce qui lui fait gagner des niveaux permanents (donc utiles en
   combat) et lui fait trouver des objets. Son palier donne un
   bonus passif modeste sur les gains et le taux de capture.
   ============================================================ */

const BUDDY_TIER_AFF = 60;          /* affinite par palier */
const BUDDY_MAX_TIER = 12;

function buddy(){ return S.buddy && S.dex[S.buddy.id] ? S.buddy : null; }
function buddyTier(){
  const b = buddy();
  if(!b) return 0;
  return clamp(Math.floor(b.aff / BUDDY_TIER_AFF), 0, BUDDY_MAX_TIER);
}
function buddyBonus(){
  const t = buddyTier();
  return {coin: 1 + t*0.025, catch: 1 + t*0.012, xp: 1 + t*0.02};
}
function buddyNextAff(){
  const b = buddy(); if(!b) return 0;
  const t = buddyTier();
  if(t >= BUDDY_MAX_TIER) return 0;
  return (t+1)*BUDDY_TIER_AFF - b.aff;
}
function setBuddy(id){
  if(!S.dex[id]) return;
  S.buddy = {id, aff:0, since:Date.now(), finds:0};
  toast(POKE[id].name + " vous accompagne", "", "heart");
  setTimeout(()=>tutoMaybe("buddy"), 600);
  pzFlash("Il te suivra. Je ne sais pas pourquoi ils font ça.");
  save();
}

/* objets que le compagnon rapporte en chemin */
const BUDDY_FINDS = [
  {w:30, rw:()=>({coins: randInt(60, 240)})},
  {w:22, rw:()=>({balls:{poke: randInt(2,5)}})},
  {w:14, rw:()=>({balls:{super: randInt(1,3)}})},
  {w:12, rw:()=>({berries:{framby: 1}})},
  {w:9,  rw:()=>({shards: randInt(2,6)})},
  {w:6,  rw:()=>({berries:{nanab: 1}})},
  {w:4,  rw:()=>({balls:{hyper: 1}})},
  {w:2,  rw:()=>({berries:{micle: 1}})},
  {w:1,  rw:()=>({cores: 1})}
];
/* valeur approximative d'une trouvaille, pour chiffrer l'apport du compagnon */
function findWorth(rw){
  let v = rw.coins || 0;
  v += (rw.shards || 0) * 120;
  v += (rw.cores  || 0) * 3000;
  for(const b in (rw.balls||{}))   v += BALLS[b].price * rw.balls[b] * (BALLS[b].cur === "coins" ? 1 : 120);
  for(const b in (rw.berries||{})) v += BERRIES[b].price * rw.berries[b] * (BERRIES[b].cur === "coins" ? 1 : 120);
  return Math.round(v);
}
function rollBuddyFind(){
  const tot = BUDDY_FINDS.reduce((a,b)=>a+b.w, 0);
  let x = rng()*tot;
  for(const f of BUDDY_FINDS){ x -= f.w; if(x <= 0) return f.rw(); }
  return {coins: 100};
}

/* appele apres chaque capture reussie */
function buddyTick(rar){
  const b = buddy();
  if(!b) return;
  const before = buddyTier();
  b.aff += (1 + Math.floor(rar/2)) * (heldActive("aff") ? 2 : 1);
  const after = buddyTier();

  if(after > before){
    const e = S.dex[b.id];
    const gained = Math.min(2, BUDDY_MAX_TIER - before);
    e.lvl = Math.min(100, e.lvl + gained);
    Sfx.win();
    toast(`${POKE[b.id].name} progresse — niveau ${e.lvl}`, "warn", "heart");
  }
  /* trouvailles : rares mais regulieres */
  if(rng() < 0.035 + buddyTier()*0.004){
    const rw = rollBuddyFind();
    grantReward(rw);
    b.finds = (b.finds||0) + 1;
    /* journal : sans trace, la valeur du compagnon reste invisible */
    b.log = b.log || [];
    b.log.unshift({t: rewardText(rw), at: Date.now()});
    if(b.log.length > 30) b.log.length = 30;
    b.worth = (b.worth||0) + findWorth(rw);
    Sfx.coin();
    toast(`${POKE[b.id].name} a trouvé ${rewardText(rw)}`, "", "seed");
  }
  saveSoon();
}

function buddyStrip(){
  const b = buddy();
  if(!b){
    return `<div class="panel tight buddy-empty" data-act="buddypick">
      <div class="row">
        <div class="buddy-slot">${ic("heart")}</div>
        <div class="grow"><div class="tiny">Aucun compagnon</div>
          <div class="tiny dim">Choisissez un Pokémon : il gagnera des niveaux et trouvera des objets.</div></div>
        ${ic("arrow")}
      </div></div>`;
  }
  const t = buddyTier(), nx = buddyNextAff();
  const pct = t >= BUDDY_MAX_TIER ? 100 : ((b.aff % BUDDY_TIER_AFF) / BUDDY_TIER_AFF * 100);
  const bo = buddyBonus();
  return `<div class="panel tight buddy" data-act="buddyinfo">
    <div class="row">
      <span class="sprbox buddy-av" style="width:46px;height:46px">
        ${sprite(b.id, S.dex[b.id].shiny, "alive", {anim:true})}</span>
      <div class="grow">
        <div class="row between">
          <span style="font-size:11.5px">${esc(POKE[b.id].name)}</span>
          <span class="tiny cy">Affinité ${t}/${BUDDY_MAX_TIER}</span>
        </div>
        <div class="bar thin" style="margin:4px 0 3px"><i style="width:${pct}%"></i></div>
        <div class="tiny dim">Niv.${S.dex[b.id].lvl} · +${Math.round((bo.coin-1)*100)}% PokéCoins
          · +${Math.round((bo.catch-1)*100)}% capture${nx?` · ${nx} avant le palier`:" · palier maximum"}</div>
      </div>
    </div>
    ${(()=>{ const e = heldEquipped();
      return `<div class="helditem" data-act="heldpick">
        ${e ? `<span class="sprbox" style="width:22px;height:22px">${sprite(HELD_ITEMS[e].spr,false,"")}</span>
               <span class="tiny">${esc(HELD_ITEMS[e].n)}</span>`
            : `<span class="tiny dim">Aucun objet tenu</span>`}
        <span class="grow"></span><span class="tiny dim">modifier</span>
      </div>`; })()}
  </div>`;
}

/* ---------- objets tenus ----------
   Un seul objet a la fois, porte par le compagnon. Chacun renforce
   un module different : c'est le liant entre les salles du jeu. */
const HELD_ITEMS = {
  h_coin:  {n:"Bourse percée",     rar:0, k:"coin",  spr:52,  d:"+20% de PokéCoins sur chaque capture."},
  h_xp:    {n:"Amplificateur",     rar:1, k:"xp",    spr:113, d:"+25% d'expérience."},
  h_berry: {n:"Baie Miracle",      rar:1, k:"catch", spr:43,  d:"+12% de taux de capture."},
  h_rest:  {n:"Restes",            rar:1, k:"exp",   spr:143, d:"+1 restauration au départ de chaque expédition."},
  h_aff:   {n:"Collier de lien",   rar:2, k:"aff",   spr:133, d:"Double l'affinité gagnée par le compagnon."},
  h_rune:  {n:"Pièce Rune",        rar:2, k:"poker", spr:150, d:"Double les Fragments gagnés au Poké-Poker."},
  h_guard: {n:"Bandeau tactique",  rar:2, k:"boss",  spr:68,  d:"+12% de statistiques contre les Data Guardians."},
  h_relic: {n:"Boussole fêlée",    rar:3, k:"relic", spr:249, d:"Une relique de plus au départ d'expédition."},
  h_charm: {n:"Amulette Chroma",   rar:3, k:"shiny", spr:151, d:"+40% de chance de chromatique."}
};
function heldOwned(){ return (S.held && S.held.owned) || []; }
function heldEquipped(){
  const e = S.held && S.held.eq;
  return (e && HELD_ITEMS[e] && buddy()) ? e : null;
}
/* un objet ne produit son effet que s'il est porte par un compagnon actif */
function heldActive(k){
  const e = heldEquipped();
  return !!(e && HELD_ITEMS[e].k === k);
}
function grantHeld(id){
  S.held = S.held || {owned:[], eq:null};
  if(S.held.owned.includes(id)) return false;
  S.held.owned.push(id);
  if(!S.held.eq) S.held.eq = id;
  return true;
}
function randomHeld(){
  const missing = Object.keys(HELD_ITEMS).filter(k=>!heldOwned().includes(k));
  return missing.length ? pick(missing) : null;
}
ACTIONS.heldpick = () => {
  const owned = heldOwned();
  sheet(`${sheetHead("Objet tenu")}
    <div class="tiny muted" style="margin-bottom:9px">Votre compagnon peut porter un objet à la fois.

      : `<div class="empty">Aucun objet tenu. On en trouve dans les archives scellées,
          les trésors d'expédition et certains succès.</div>`}`);
};

/* ============================================================
   QUÊTES HEBDOMADAIRES
   Objectifs longs, recompenses en Noyaux et en archives scellees.
   ============================================================ */
const WEEKLY_POOL = [
  {id:"w_catch", n:"Restaurer {n} entités",              goal:[220,340,520], stat:"wkCatch"},
  {id:"w_new",   n:"Archiver {n} espèces inédites",      goal:[14,22,30],    stat:"wkNew"},
  {id:"w_rare",  n:"Capturer {n} Pokémon rares ou plus", goal:[30,50,80],    stat:"wkRare"},
  {id:"w_exp",   n:"Terminer {n} expéditions",           goal:[3,5,8],       stat:"wkExp"},
  {id:"w_poker", n:"Encaisser {n} manches de Poké-Poker",goal:[20,32,48],    stat:"wkPoker"},
  {id:"w_boss",  n:"Affronter {n} Data Guardians",       goal:[2,3,5],       stat:"wkBoss"},
  {id:"w_evo",   n:"Faire évoluer {n} Pokémon",          goal:[5,8,12],      stat:"wkEvo"},
  {id:"w_fish",  n:"Réussir {n} sondages",               goal:[25,40,60],    stat:"wkFish"},
  {id:"w_energy",n:"Produire {n} d'Énergie Onirique",    goal:[25000,60000,120000], stat:"wkEnergy"}
];
const WEEKLY_REWARDS = [
  {cores:3, chest:"small"},
  {cores:5, chest:"big"},
  {cores:8, chest:"big"}
];
function weekKey(){
  const d = new Date();
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() + 4 - (t.getDay() || 7));
  const y0 = new Date(t.getFullYear(), 0, 1);
  return t.getFullYear() + "-S" + Math.ceil(((t - y0) / 86400000 + 1) / 7);
}
function rollWeekly(){
  const tier = clamp(Math.floor(S.level/14), 0, 2);
  S.weekly = {
    week: weekKey(),
    tier,
    quests: shuffle(WEEKLY_POOL).slice(0,3).map(q=>({
      id:q.id, n:q.n.replace("{n}", fmt(q.goal[tier])), goal:q.goal[tier],
      stat:q.stat, prog:0, claimed:false
    })),
    wk: {wkCatch:0, wkNew:0, wkRare:0, wkExp:0, wkPoker:0, wkBoss:0, wkEvo:0, wkFish:0, wkEnergy:0}
  };
}
function weeklyRollover(){
  if(!S.weekly || S.weekly.week !== weekKey()) rollWeekly();
}
/* les compteurs hebdomadaires suivent les memes evenements que les quotidiens */
const DAILY_TO_WEEKLY = {
  dayCatch:"wkCatch", dayNew:"wkNew", dayRare:"wkRare", dayExp:"wkExp",
  dayPokerBlinds:"wkPoker", dayBoss:"wkBoss", dayEvo:"wkEvo", dayFish:"wkFish", dayEnergy:"wkEnergy"
};
function weeklyTick(stat, n){
  if(!S.weekly) return;
  const k = DAILY_TO_WEEKLY[stat];
  if(!k) return;
  S.weekly.wk[k] = (S.weekly.wk[k]||0) + n;
  for(const q of S.weekly.quests){
    if(q.stat === k && q.prog < q.goal){
      q.prog = Math.min(q.goal, q.prog + n);
      if(q.prog >= q.goal) toast("Objectif hebdomadaire atteint : " + q.n, "warn", "trophy");
    }
  }
  saveSoon();
}
ACTIONS.claimwk = d => {
  const q = S.weekly.quests[+d.i];
  if(!q || q.claimed || q.prog < q.goal) return;
  q.claimed = true;
  const rw = WEEKLY_REWARDS[S.weekly.tier];
  gain("cores", rw.cores);
  const chest = CHESTS[rw.chest];
  const items = openChest(rw.chest, true);
  const wc = randomCard(1 + S.weekly.tier * 0.6);
  const wcNew = grantCardV(wc.s, wc.id);
  Sfx.win();
  save();
  revealSheet("OBJECTIF HEBDOMADAIRE", [
    {icon:"core", label:`${rw.cores} Noyaux`, color:"var(--violet)"},
    {icon:"cards", label:POKE[wc.id].name,
     sub:"carte " + CARD_SERIES_DEF[wc.s].n + (wcNew ? "" : " · doublon"),
     color:CARD_SERIES_DEF[wc.s].c, big:true},
    ...items
  ], {sub:`${esc(q.n)} — ${esc(chest.name)} ouverte`});
};

function weeklyPanel(){
  weeklyRollover();
  const W = S.weekly;
  const rw = WEEKLY_REWARDS[W.tier];
  return `
    <div class="row between" style="margin:2px 0 7px">
      <div class="h sm" style="margin:0">OBJECTIFS DE LA SEMAINE</div>
      <span class="tiny dim">${esc(W.week)}</span>
    </div>
    <div class="list">
      ${W.quests.map((q,i)=>`
        <div class="quest ${q.prog>=q.goal?"done":""}">
          <div class="grow">
            <div class="q-t">${esc(q.n)}</div>
            <div class="bar" style="margin-top:5px"><i style="width:${Math.min(100,q.prog/q.goal*100)}%"></i></div>
            <div class="tiny muted mono-num">${fmt(q.prog)} / ${fmt(q.goal)}</div>
          </div>
          <button class="btn sm ${q.prog>=q.goal&&!q.claimed?"gold":""}" data-act="claimwk" data-i="${i}"
            ${q.prog>=q.goal&&!q.claimed?"":"disabled"}>${q.claimed?"Pris":"Prendre"}</button>
        </div>`).join("")}
    </div>
    <div class="tiny dim" style="margin-top:6px">Chaque objectif accompli rapporte
      ${rw.cores} Noyaux et une ${esc(CHESTS[rw.chest].name)}.</div>`;
}

/* ============================================================
   SÉQUENCE DE RÉVÉLATION
   Utilisee pour les coffres, les hebdomadaires et le tampon
   quotidien : les recompenses apparaissent une par une.
   ============================================================ */
function revealSheet(title, items, opts){
  opts = opts || {};
  sheet(`<div class="center reveal">

function runReveal(items){
  const chest = document.getElementById("rv-chest");
  const glow  = document.getElementById("rv-glow");
  const list  = document.getElementById("rv-list");
  const ok    = document.getElementById("rv-ok");
  if(!list){ return; }

  if(chest) chest.classList.add("shaking");
  Sfx.wobble();
  setTimeout(()=>{ Sfx.wobble(); buzz(14); }, 240);
  setTimeout(()=>{ Sfx.wobble(); buzz(14); }, 480);

  setTimeout(()=>{
    if(chest) { chest.classList.remove("shaking"); chest.classList.add("open"); }
    if(glow) glow.classList.add("on");
    Sfx.caught(); buzz([20,40,60]);
    const stage = document.getElementById("rv-stage");
    if(stage) burstEl(stage, {n:26, spread:120, colors:["#ffc857","#35f0d6","#ffffff"], dur:900});
  }, 760);
