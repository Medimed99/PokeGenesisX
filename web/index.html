    setTimeout(()=>{
      const el = document.createElement("div");
      el.className = "rv-item";
      el.style.setProperty("--ic", it.color || "var(--cyan)");
      el.innerHTML = `
        <span class="rv-ic">${it.id !== undefined
          ? `<span class="sprbox" style="width:34px;height:34px">${sprite(it.id, it.shiny, "")}</span>`
          : ic(it.icon || "star")}</span>
        <span class="rv-lb">${esc(it.label)}</span>
        ${it.sub?`<span class="rv-sb">${esc(it.sub)}</span>`:""}`;
      list.appendChild(el);
      requestAnimationFrame(()=>el.classList.add("in"));
      Sfx.coin();
      if(it.big) burstEl(el, {n:14, spread:70, colors:[it.color||"#ffc857","#ffffff"]});
    }, 900 + i*220);
  });

  setTimeout(()=>{
    if(ok){ ok.style.opacity = 1; ok.style.pointerEvents = "auto"; }
  }, 900 + items.length*220 + 200);
}

/* ---------- ouverture de coffre : logique separee du rendu ---------- */
function openChest(key, silent){
  const c = CHESTS[key];
  const n = c.tier === 1 ? 3 : c.tier === 2 ? 6 : c.tier === 3 ? 5 : 7;
  const out = [];
  for(let i=0;i<n;i++){
    const loot = Object.assign({}, pick(CHEST_LOOT[c.tier]));
    if(loot.stones === "random"){ const k = pick(Object.keys(STONES)); loot.stones = {[k]:1}; }
    if(loot.items === "radar"){
      S.items.radar = (S.items.radar||0) + 1;
      out.push({icon:"boss", label:"Radar Légendaire", color:"var(--magenta)", big:true});
      delete loot.items;
    } else if(loot.items){
      S.items[loot.items] = (S.items[loot.items]||0) + 2;
      out.push({icon:"heart", label:"2 Restaurations", color:"var(--green)"});
      delete loot.items;
    }
    if(loot.egg){
      grantEgg(loot.egg);
      out.push({icon:"box", label:EGG_TIERS[loot.egg].n, sub:"à incuber",
                color:EGG_TIERS[loot.egg].c, big:loot.egg !== "e_common"});
      delete loot.egg;
    }
    if(loot.boost){
      const bid = pick(Object.keys(BOOSTS));
      startBoost(bid);
      out.push({icon:"bolt", label:BOOSTS[bid].n, sub:BOOSTS[bid].min + " min",
                color:"var(--cyan)", big:true});
      delete loot.boost;
    }
    if(loot.held){
      const h = randomHeld();
      if(h && grantHeld(h)) out.push({icon:"star", label:HELD_ITEMS[h].n, sub:"Objet tenu",
        color:"var(--violet)", big:true});
      else out.push({icon:"shard", label:"40 Fragments", color:"var(--cyan)"}), gain("shards",40);
      delete loot.held;
    }
    if(loot.card){
      const c2 = randomCard(c.tier >= 4 ? 2.2 : 1.4);
      const fresh = grantCardV(c2.s, c2.id);
      out.push({id:c2.id, label:POKE[c2.id].name,
                sub:CARD_SERIES_DEF[c2.s].n + (fresh ? "" : " · doublon"),
                color:CARD_SERIES_DEF[c2.s].c, big:true});
      delete loot.card;
    }
    if(Object.keys(loot).length){
      grantReward(loot);
      const big = !!(loot.cores || (loot.balls && loot.balls.master));
      out.push({icon: lootIcon(loot), label: rewardText(loot),
                color: big ? "var(--violet)" : "var(--amber)", big});
    }
  }
  if(!silent) checkAchievements();
  return out;
}
function lootIcon(loot){
  if(loot.cores) return "core";
  if(loot.shards) return "shard";
  if(loot.coins) return "coin";
  if(loot.balls) return BALLS[Object.keys(loot.balls)[0]].icon;
  if(loot.berries) return "seed";
  if(loot.stones) return "stone";
  return "star";
}

   Butin purement monétaire : la pêche gagne une identité économique
   et un moment de jackpot occasionnel. */
const TREASURES = {
  heart_scale: {n:"Écaille Cœur",    sell:600,   w:40, spr:349},
  pearl:       {n:"Perle",           sell:1400,  w:28, spr:90},
  stardust:    {n:"Poussière d'Étoile", sell:2600, w:16, spr:120},
  big_pearl:   {n:"Grande Perle",    sell:5200,  w:9,  spr:91},

  golden:      {n:"Statue Dorée",    sell:26000, w:1,  spr:129}
};
function rollTreasure(depth){
  /* la profondeur augmente la chance et la qualité */
  if(rng() > 0.16 + depth * 0.10) return null;
  const pool = [];
  for(const k in TREASURES){
    let w = TREASURES[k].w;
    if(depth >= 1 && TREASURES[k].sell >= 2000) w *= 2;
    if(depth >= 2 && TREASURES[k].sell >= 5000) w *= 3;
    for(let i=0;i<w;i++) pool.push(k);
  }
  const k = pick(pool);
  S.treasures = S.treasures || {};
  S.treasures[k] = (S.treasures[k]||0) + 1;
  S.stats.treasures = (S.stats.treasures||0) + 1;
  if(TREASURES[k].sell >= 9000){
    Sfx.shiny(); buzz([30,50,30,50,90]);
    pzFlash("Ça, ce n'est pas censé exister dans cette couche.");
  }
  saveSoon();
  return k;
}
function treasureValue(){
  let v = 0;
  for(const k in (S.treasures||{})) v += TREASURES[k].sell * S.treasures[k];
  return v;
}
ACTIONS.sellall = () => {
  const v = treasureValue();
  if(v <= 0) return;
  const items = [];
  for(const k in S.treasures){
    if(!S.treasures[k]) continue;
    items.push({id:TREASURES[k].spr, label:`${S.treasures[k]} × ${TREASURES[k].n}`,
                sub:fmt(TREASURES[k].sell * S.treasures[k]) + " c", color:"var(--amber)",
                big:TREASURES[k].sell >= 9000});
  }
  S.treasures = {};
  gain("coins", v);
  save();
  revealSheet("VENTE DE TRÉSORS", items, {icon:"coin", sub:fmt(v) + " PokéCoins encaissés"});
};

  const owned = Object.keys(S.treasures||{}).filter(k=>S.treasures[k] > 0);

  return `<div class="panel">

/* ============================================================
   78 — JALONS
   Trois horizons complementaires :
   · les PALIERS DE REGION recompensent la completion, tous les 25%
   · les CONTRATS donnent un objectif court qui tourne toutes les 6h
   · le BONUS DE PREMIERE VICTOIRE cree une routine par module

/* ---------- paliers de complétion par secteur ---------- */
const REGION_TIERS = [
  {pct:25,  rw:{coins:2500,  shards:25,  balls:{super:10}},  t:"Le secteur redevient lisible par endroits."},
  {pct:50,  rw:{coins:7000,  shards:60,  cores:2},           t:"La moitié du secteur tient debout toute seule."},
  {pct:75,  rw:{coins:18000, shards:120, cores:4, balls:{hyper:10}}, t:"Il ne reste que des trous isolés."},
  {pct:100, rw:{coins:45000, shards:250, cores:10},          t:"Secteur intégralement restauré."}
];
const REGION_TIER_COS = {
  kanto: ["bg_kanto", null, null, "title_titulaire"],
  johto: ["bg_johto", null, null, null],
  hoenn: ["bg_hoenn", null, null, "title_index"]
};
function regionTiersDone(key){ return (S.regionTiers && S.regionTiers[key]) || []; }
function checkRegionTiers(){
  S.regionTiers = S.regionTiers || {};
  for(const r of REGIONS){
    if(!regionUnlocked(r.key)) continue;
    const pct = dexRegionPct(r.key);
    const done = S.regionTiers[r.key] = S.regionTiers[r.key] || [];
    for(let i=0;i<REGION_TIERS.length;i++){
      const t = REGION_TIERS[i];
      if(pct + 0.001 < t.pct || done.includes(t.pct)) continue;
      done.push(t.pct);
      grantReward(t.rw);
      const cos = (REGION_TIER_COS[r.key]||[])[i];
      if(cos) unlockCosmetic(cos);
      addIntegrity(t.pct === 100 ? 2 : 0.6);
      Sfx.win();
      save();
      showRegionTier(r, t, cos);
      return true;                     /* un seul palier a la fois, pour qu'il se voie */
    }
  }
  return false;
}
function showRegionTier(r, t, cos){
  const items = [];
  for(const k in t.rw){
    if(k === "balls") for(const b in t.rw.balls)
      items.push({icon:BALLS[b].icon, label:`${t.rw.balls[b]} ${BALLS[b].name}`, color:"var(--cyan)"});
    else items.push({icon: k==="cores"?"core":k==="shards"?"shard":"coin",
      label:`${fmt(t.rw[k])} ${CUR_NAME[k]}`, color: k==="cores"?"var(--violet)":"var(--amber)",
      big: k==="cores"});
  }
  if(cos) items.push({icon:"star", label:"Cosmétique : " + COSMETICS[cos].n, color:"var(--amber)", big:true});
  revealSheet(`${r.name.toUpperCase()} — ${t.pct}%`, items, {icon:"dex", sub:esc(t.t)});
  pzFlash(t.t);
}

/* ---------- contrats de secteur ---------- */
/* objectif court, renouvele toutes les six heures, ancre sur une region */
const CONTRACT_MS = 6 * 3600 * 1000;
const CONTRACTS = [
  {id:"c_type", n:"Archiver {n} Pokémon de type {x} à {r}", goal:[4,7,11],
   pick:r=>randInt(1,18),
   test:(id,d)=>POKE[id].types.includes(d.x) && regionOf(id) === d.r,
   label:d=>TYPE_NAMES[d.x]},
  {id:"c_rar",  n:"Capturer {n} Pokémon rares ou plus à {r}", goal:[3,5,8],
   pick:()=>2, test:(id,d)=>POKE[id].rar >= 2 && regionOf(id) === d.r, label:()=>"rare+"},
  {id:"c_bst",  n:"Capturer {n} Pokémon d'au moins {x} en statistiques à {r}", goal:[4,6,9],
   pick:()=>pick([380,430,480]),
   test:(id,d)=>POKE[id].bst >= d.x && regionOf(id) === d.r, label:d=>d.x+" total"},
  {id:"c_evo",  n:"Archiver {n} espèces évoluées à {r}", goal:[5,8,12],
   pick:()=>0, test:(id,d)=>stageOf(id) > 0 && regionOf(id) === d.r, label:()=>"évoluées"},
  {id:"c_new",  n:"Archiver {n} espèces inédites à {r}", goal:[3,5,7],
   pick:()=>0, test:(id,d)=>d.newOnly && regionOf(id) === d.r, label:()=>"inédites", newOnly:true}
];
function rollContract(){
  const tier = clamp(Math.floor(S.level/13), 0, 2);
  const regs = unlockedRegions();
  const r = pick(regs);
  const c = pick(CONTRACTS);
  const x = c.pick(r.key);
  S.contract = {
    id:c.id, r:r.key, x, goal:c.goal[tier], prog:0, claimed:false,
    until: Date.now() + CONTRACT_MS,
    n: c.n.replace("{n}", c.goal[tier]).replace("{x}", String(c.label({x})))
          .replace("{r}", r.name),
    rw: {shards: 18 + tier*14, coins: 900 + tier*900}
  };
  saveSoon();
}
function contractRollover(){
  if(!S.contract || S.contract.until <= Date.now()) rollContract();
}
/* appele a chaque capture reussie */
function contractTick(id, isNew){
  const C = S.contract;
  if(!C || C.claimed || C.prog >= C.goal) return;
  const def = CONTRACTS.find(x=>x.id === C.id);
  if(!def) return;
  const d = {x:C.x, r:C.r, newOnly:isNew};
  let ok = false;
  try { ok = def.test(id, d); } catch(e){ ok = false; }
  if(!ok) return;
  C.prog++;
  if(C.prog >= C.goal){ S.stats.contracts = (S.stats.contracts||0) + 1;
    toast("Contrat rempli : " + C.n, "warn", "trophy"); }
  saveSoon();
}
ACTIONS.claimcontract = () => {
  const C = S.contract;
  if(!C || C.claimed || C.prog < C.goal) return;
  C.claimed = true;
  grantReward(C.rw);
  Sfx.coin();
  toast("Contrat encaissé : " + rewardText(C.rw), "", "check");
  save(); refresh();
};
function contractCard(){
  contractRollover();
  const C = S.contract;
  const left = Math.max(0, C.until - Date.now());
  const ready = C.prog >= C.goal;
  return `<div class="panel bracket contract">
    <div class="row between">
      <div class="h sm" style="margin:0">CONTRAT DE SECTEUR ${infoBtn("contract")}</div>
      <span class="tiny dim">${C.claimed ? "encaissé" : fmtTime(left)}</span>
    </div>
    <div class="tiny" style="margin:4px 0 6px">${esc(C.n)}</div>
    <div class="bar thin"><i style="width:${Math.min(100, C.prog/C.goal*100)}%"></i></div>
    <div class="row between" style="margin-top:6px">
      <span class="tiny dim mono-num">${C.prog} / ${C.goal} · ${esc(rewardText(C.rw))}</span>
      <button class="btn xs ${ready&&!C.claimed?"gold":""}" data-act="claimcontract"
        ${ready&&!C.claimed?"":"disabled"}>${C.claimed?"Pris":"Encaisser"}</button>
    </div>
  </div>`;
}

/* ---------- carte d'objectifs unifiée ----------
   Directive et contrat partageaient deux panneaux : ils disent la meme chose
   au joueur — « voici quoi faire maintenant ». Un seul bloc, deux lignes. */
function objectivesCard(){
  contractRollover();
  const d = currentDirective();
  const C = S.contract;
  const cReady = C.prog >= C.goal && !C.claimed;
  const row = (label, title, cur, goal, accent, extra) => `
    <div class="objrow">
      <div class="objlab ${accent}">${label}</div>
      <div class="grow">
        <div class="objtitle">${title}</div>
        <div class="bar thin" style="margin-top:4px"><i class="${accent}"
          style="width:${Math.min(100, cur/goal*100)}%"></i></div>
      </div>
      <div class="objside">${extra}</div>
    </div>`;

  const dPart = d
    ? row("DIRECTIVE", esc(d.n), d.goal()[0], d.goal()[1], "cy",
        d.go ? `<button class="btn xs" data-act="goto" data-to="${d.go}">Aller</button>`
             : `<span class="tiny dim mono-num">${fmt(Math.min(d.goal()[0], d.goal()[1]))}/${fmt(d.goal()[1])}</span>`)
    : `<div class="objrow"><div class="objlab cy">DIRECTIVE</div>
        <div class="grow objtitle muted">Toutes accomplies. La suite vous appartient.</div></div>`;

  const cPart = row("CONTRAT", esc(C.n), C.prog, C.goal, "vi",
      C.claimed ? `<span class="tiny dim">pris</span>`
      : cReady  ? `<button class="btn xs gold" data-act="claimcontract">Prendre</button>`
                : `<span class="tiny dim">${fmtTime(Math.max(0, C.until - Date.now()))}</span>`);

  return `<div class="panel bracket objectives">
    <div class="row between" style="margin-bottom:6px">
      <div class="h sm" style="margin:0">OBJECTIFS ${infoBtn("contract")}</div>
      <span class="tiny dim">${(S.dirDone||[]).length}/${DIRECTIVES.length} directives</span>
    </div>
    ${dPart}
    <hr class="sep" style="margin:7px 0">
    ${cPart}
    ${d && d.hint ? `<div class="tiny muted" style="margin-top:6px">${esc(d.hint)}</div>` : ""}
  </div>`;
}

/* ---------- bonus de première victoire quotidienne ---------- */
const FIRST_WIN = {
  expedition:{n:"Expédition", mult:2},
  poker:     {n:"Poké-Poker", mult:2},
  boss:      {n:"Data Guardian", mult:2},
  fishing:   {n:"Sonde", mult:2}
};
function firstWinAvailable(k){
  S.daily.firstWin = S.daily.firstWin || {};
  return !S.daily.firstWin[k];
}
/* renvoie le multiplicateur et consomme le bonus */
function consumeFirstWin(k){
  if(!firstWinAvailable(k)) return 1;
  S.daily.firstWin[k] = true;
  const m = FIRST_WIN[k].mult;
  toast(`Première ${FIRST_WIN[k].n} du jour — récompenses ×${m}`, "warn", "star");
  Sfx.win();
  saveSoon();
  return m;
}
function firstWinBadge(k){
  return firstWinAvailable(k) ? `<span class="fwbadge">×2 aujourd'hui</span>` : "";
}

/* point d'entree unique, appele depuis guideTick */
function milestoneTick(){
  contractRollover();
  return checkRegionTiers();
}

/* aucune autre couche ne doit etre ouverte : sinon le tutoriel se superpose */
function overlayBusy(){
  for(const id of ["story", "sheet-root", "discover", "levelup", "boot"]){
    const el = document.getElementById(id);
    if(el && el.className && el.className.indexOf("on") >= 0) return true;
    if(id === "boot" && el && el.style && el.style.display === "flex") return true;
  }
  return false;
}
function tutoMaybe(k){
  if(!TUTOS[k] || tutoSeen(k)) return false;
  if(overlayBusy()) return false;
  (S.tutos = S.tutos || []).push(k);
  saveSoon();
  setTimeout(()=>startTuto(k), 380);
  return true;
}
function startTuto(k, tries){
  /* si une couche s'est ouverte entre-temps, on attend qu'elle se referme */
  if(overlayBusy()){
    if((tries||0) > 40) return;
    setTimeout(()=>startTuto(k, (tries||0)+1), 500);
    return;
  }
  TUTO = {k, i:0};
  drawTuto();
}
function drawTuto(){
  const box = document.getElementById("tuto");
  if(!box || !TUTO){ return; }
  const def = TUTOS[TUTO.k];
  const step = def.steps[TUTO.i];
  if(!step){ endTuto(); return; }
  const app = document.getElementById("app").getBoundingClientRect();
  let hole = "";
  let bubbleTop = true;
  const el = step.sel ? document.querySelector(step.sel) : null;
  if(el){
    const r = el.getBoundingClientRect();
    const x = r.left - app.left - 6, y = r.top - app.top - 6;
    const w = r.width + 12, h = r.height + 12;
    bubbleTop = (y + h/2) > app.height/2;
    hole = `<div class="tuto-hole" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></div>`;
  }
  box.className = "on";
  box.innerHTML = `
    ${hole || '<div class="tuto-dim"></div>'}
    <div class="tuto-box ${bubbleTop?"top":"bottom"}">
      <div class="tuto-who">
        ${pzFace(pzMood(), 34)}
        <span>PORYGON-Z</span>
        <span class="grow"></span>
        <span class="tiny dim">${TUTO.i+1}/${def.steps.length}</span>
      </div>
      <div class="tuto-t">${esc(step.t)}</div>
      <div class="row between" style="margin-top:9px">
        <button class="btn xs ghost" data-act="tutoskip">Passer</button>
        <button class="btn sm pri" data-act="tutonext">
          ${TUTO.i+1 >= def.steps.length ? "Compris" : "Suivant"}</button>
      </div>
    </div>`;
}
ACTIONS.tutonext = () => { if(!TUTO) return; TUTO.i++; drawTuto(); };
ACTIONS.tutoskip = () => endTuto();
function endTuto(){
  TUTO = null;
  const box = document.getElementById("tuto");
  if(box){ box.className = ""; box.innerHTML = ""; }
  save();
}
/* relancer un tutoriel depuis une fiche d'info */

function currentDirective(){
  for(const d of DIRECTIVES) if(!(S.dirDone||[]).includes(d.id)) return d;
  return null;
}
function checkDirectives(){
  const d = currentDirective();
  if(!d || !d.chk()) return false;
  (S.dirDone = S.dirDone || []).push(d.id);
  grantReward(d.rw);
  Sfx.win();
  toast("Directive accomplie : " + d.n, "warn", "check");
  const nx = currentDirective();
  if(nx) pzFlash("Nouvelle directive : " + nx.n);
  saveSoon();
  return true;
}
function directiveCard(){
  const d = currentDirective();
  if(!d) return `<div class="panel bracket"><div class="h sm">DIRECTIVES</div>
    <div class="tiny muted">Toutes les directives sont accomplies. La suite t'appartient.</div></div>`;
  const [cur, goal] = d.goal();
  const pct = Math.min(100, cur/goal*100);
  return `<div class="panel bracket directive">
    <div class="row between">
      <div class="h sm" style="margin:0">DIRECTIVE EN COURS</div>
      <span class="tiny dim">${(S.dirDone||[]).length}/${DIRECTIVES.length}</span>
    </div>
    <div class="row" style="gap:9px;margin-top:5px">
      ${pzFace(pzMood(), 34)}

        <div class="bar thin" style="margin:4px 0 3px"><i style="width:${pct}%"></i></div>
        <div class="tiny dim mono-num">${fmt(Math.min(cur,goal))} / ${fmt(goal)}</div>

}

function checkPzEvents(){
  if(document.getElementById("story")?.className === "on") return false;
  S.pzSeen = S.pzSeen || [];
  for(const e of PZ_EVENTS){
    if(S.pzSeen.includes(e.id)) continue;
    let ok = false;
    try { ok = e.c(); } catch(x){ ok = false; }
    if(ok){
      S.pzSeen.push(e.id);
      saveSoon();
      pzTalk(e.t);
      return true;
    }
  }
  return false;
}
/* bandeau de dialogue court, non bloquant */
function pzTalk(text){
  const box = document.getElementById("pztalk");
  if(!box) return;
  box.innerHTML = `
    <div class="pzt-in">
      ${pzFace(pzMood(), 40)}
      <div class="grow"><div class="pzt-who">PORYGON-Z</div>
        <div class="pzt-t">${esc(text)}</div></div>
      <button class="x" data-act="pzclose">${ic("cross")}</button>
    </div>`;
  box.className = "on";
  clearTimeout(box._t);
  box._t = setTimeout(()=>{ box.className = ""; }, 11000);
}
ACTIONS.pzclose = () => { const b = document.getElementById("pztalk"); if(b){ b.className=""; b.innerHTML=""; } };

/* point d'entree unique appele apres chaque action significative */
function guideTick(){
  if(!S) return;
  /* un palier prend le pas sur le bavardage du guide, mais ne doit jamais
     empecher l'evaluation des directives : elles sont la colonne vertebrale
     de la progression. */
  const milestone = milestoneTick();
  checkDirectives();
  if(!milestone) checkPzEvents();
}

/* ============================================================
   NOUVEAU CYCLE
   Relance la partie en conservant ce qui relève de la collection
   et du prestige, et en remettant la progression à zéro. Les
   modificateurs choisis augmentent le gain de Noyaux Zéro.
   ============================================================ */
const CYCLE_MODS = {
  m_tough: {n:"Verrous renforcés",   d:"Data Guardians et expéditions +30% de statistiques.", bonus:.15},
  m_rare:  {n:"Index fragmenté",     d:"Les espèces communes se raréfient d'un cran.",        bonus:.20},
  m_chain: {n:"Chaîne fragile",      d:"La chaîne se brise aussi sur un lancer raté.",        bonus:.25},
  m_econ:  {n:"Économie stricte",    d:"PokéCoins et Fragments divisés par deux.",            bonus:.20},
  m_slow:  {n:"Réparation lente",    d:"Gains d'intégrité réduits de 40%.",                   bonus:.20}
};
function cycleMod(k){ return !!(S.cycle && S.cycle.mods && S.cycle.mods.includes(k)); }
function cycleN(){ return (S.cycle && S.cycle.n) || 0; }

const PERKS = {
  p_catch: {n:"Protocole affiné",   max:3, cost:l=>2+l*2, d:l=>`+${4*(l+1)}% de taux de capture.`},
  p_coin:  {n:"Trésorerie",         max:3, cost:l=>2+l*2, d:l=>`+${15*(l+1)}% de PokéCoins.`},
  p_shiny: {n:"Œil chromatique",    max:3, cost:l=>4+l*3, d:l=>`+${20*(l+1)}% de chance de chromatique.`},
  p_start: {n:"Départ anticipé",    max:3, cost:l=>3+l*2, d:l=>`Commencer au niveau ${1+4*(l+1)}.`},
  p_keep:  {n:"Mémoire persistante",max:1, cost:()=>6,    d:()=>"Conserver les objets tenus entre les cycles."},
  p_quest: {n:"Charge de travail",  max:1, cost:()=>5,    d:()=>"Une quête quotidienne supplémentaire."}
};
function perkLv(k){ return (S.perks && S.perks[k]) || 0; }
function perkMul(k, per){ return 1 + per * perkLv(k); }

/* Noyaux Zéro gagnés en bouclant un cycle */
function cycleReward(){
  const base = 8
    + Math.floor(dexTotal() / 40)
    + S.bosses.length
    + Math.floor((S.stats.shinies || 0) / 5)
    + Math.floor(S.level / 12);
  const mult = 1 + (S.cycle && S.cycle.mods ? S.cycle.mods.reduce((a,k)=>a + CYCLE_MODS[k].bonus, 0) : 0);
  return Math.max(1, Math.round(base * mult));
}
function cycleReady(){ return !!(S.flags && S.flags.climax); }

ACTIONS.togglemod = d => {
  S.nextMods = S.nextMods || [];
  const i = S.nextMods.indexOf(d.k);
  if(i >= 0) S.nextMods.splice(i,1); else S.nextMods.push(d.k);
  saveSoon(); refresh();
};
ACTIONS.buyperk = d => {
  const p = PERKS[d.k], lv = perkLv(d.k);
  if(lv >= p.max) return;
  const cost = p.cost(lv);
  if((S.zero||0) < cost){ toast("Noyaux Zéro insuffisants", "bad", "cross"); return; }
  S.zero -= cost;
  S.perks = S.perks || {};
  S.perks[d.k] = lv + 1;
  Sfx.win();
  toast(p.n + " — niveau " + (lv+1), "warn", "star");
  save(); refresh();
};
ACTIONS.cycleask = () => {
  if(!cycleReady()) return;
  const g = cycleReward();
  sheet(`${sheetHead("Boucler le cycle ?")}
    <div class="tiny muted">Le monde est remis à zéro. Vous conservez vos cartes, vos cosmétiques,
      vos succès, le journal et vos avantages permanents.</div>
    <div class="tiles" style="margin:10px 0">
      <div class="tile gold"><div class="k">Noyaux Zéro gagnés</div><div class="v">+${g}</div></div>
      <div class="tile accent"><div class="k">Prochain cycle</div><div class="v">${cycleN()+2}</div></div>
    </div>
    <div class="tiny bad">Cette action est définitive.</div>
    <div class="btn-grid c2" style="margin-top:10px">
      <button class="btn ghost" data-act="closesheet">Annuler</button>
      <button class="btn dan" data-act="cycledo">Boucler</button>
    </div>`, true);
};
ACTIONS.cycledo = () => {
  const g = cycleReward();
  const keep = {
    cards: S.cards, cos: S.cos, ach: S.ach, story: S.story, tutos: S.tutos,
    zero: (S.zero||0) + g, perks: S.perks || {}, name: S.name,
    netRev: S.netRev, netMail: S.netMail, settings: S.settings,
    cycle: {n: cycleN() + 1, mods: (S.nextMods || []).slice()},
    held: perkLv("p_keep") ? S.held : {owned:[], eq:null},
    lifetime: {
      catches: ((S.lifetime && S.lifetime.catches)||0) + S.stats.catches,
      shinies: ((S.lifetime && S.lifetime.shinies)||0) + S.stats.shinies,
      cycles: cycleN() + 1
    }
  };
  const fresh = newState();
  Object.assign(fresh, keep);
  /* avantages de départ */
  const startLv = 1 + 4*perkLv("p_start");
  if(startLv > 1){ fresh.level = startLv; }
  fresh.nextMods = [];
  S = fresh;
  applyCorruption();
  save();
  closeSheet();
  Sfx.win();
  revealSheet(`CYCLE ${cycleN()+1}`, [
    {icon:"core", label:`${g} Noyaux Zéro`, color:"var(--violet)", big:true},
    ...((S.cycle.mods||[]).map(k=>({icon:"bolt", label:CYCLE_MODS[k].n, sub:"modificateur actif",
      color:"var(--magenta)"}))),
    {icon:"dex", label:"Archive remise à zéro", color:"var(--cyan)"}
  ], {icon:"refresh", sub:"Le condensateur est rempli. Le compteur repart."});
};

/* ---------- actions ---------- */
function admDone(msg){
  admMark(); save(); toast(msg || "Appliqué", "warn", "gear");
  closeSheet(); refresh();
}

ACTIONS.admcur = d => { gain(d.c, +d.n); admDone(`+${fmt(+d.n)} ${CUR_NAME[d.c]}`); };
ACTIONS.admrich = () => {
  gain("coins", 5000000); gain("shards", 50000); gain("cores", 500); gain("energy", 1000000);
  admDone("Coffres remplis");
};
ACTIONS.admlvl = d => { for(let i=0;i<+d.n;i++) addXp(xpForLevel(S.level) - S.xp); admDone(`Niveau ${S.level}`); };
ACTIONS.admxp = d => { addXp(Math.round(xpForLevel(S.level) * +d.n)); admDone("XP ajoutée"); };
ACTIONS.admlvlset = d => { S.level = +d.n; S.xp = 0; admDone(`Niveau ${S.level}`); };
ACTIONS.admunlock = () => {
  if(S.level < 14){ S.level = 14; S.xp = 0; }
  if(dexTotal() < 25) admFillDex(25);
  if(S.team.length < 3) S.team = ownedSorted().slice(0,3);
  if(!S.bosses.length) admBeatNext();
  admDone("Tous les modules accessibles");
};
ACTIONS.admint = d => { addIntegrity(+d.n); admDone(`Intégrité ${S.integrity.toFixed(1)}%`); };
ACTIONS.admintset = d => {
  S.integrity = clamp(+d.n, 0, 100);
  applyCorruption(); Bus.emit("integrity", S.integrity);
  admDone(`Intégrité ${S.integrity.toFixed(1)}%`);
};
ACTIONS.admcorrupt = () => {
  closeSheet();
  let v = 0;
  const id = setInterval(()=>{
    v += 4;
    document.documentElement.style.setProperty("--corrupt", (Math.abs(Math.sin(v/40))).toFixed(3));
    if(v > 250){ clearInterval(id); applyCorruption(); }
  }, 40);
  toast("Balayage de l'effet de corruption", "warn", "eye");
};

function admFillDex(n){
  const miss = [];
  for(let i=1;i<=386;i++) if(!S.dex[i]) miss.push(i);
  for(const id of shuffle(miss).slice(0, n)) addToDex(id, Math.max(20, S.level*2), false);
}
ACTIONS.admdex = d => { admFillDex(+d.n); admDone(`${dexTotal()} espèces archivées`); };
ACTIONS.admdexreg = () => {
  const r = regionDef(S.region);
  for(let i=r.from;i<=r.to;i++) if(!S.dex[i]) addToDex(i, Math.max(20, S.level*2), false);
  admDone(`${r.name} complété`);
};
ACTIONS.admdexall = () => {
  for(let i=1;i<=386;i++) if(!S.dex[i]) addToDex(i, Math.max(30, S.level*2), false);
  admDone("Pokédex complet");
};
ACTIONS.admshiny = () => {
  const owned = Object.keys(S.dex).map(Number).filter(id=>!S.dex[id].shiny);
  for(const id of shuffle(owned).slice(0,5)){ S.dex[id].shiny = true; S.dex[id].s++; S.stats.shinies++; }
  admDone("5 chromatiques ajoutés");
};
ACTIONS.admteamlvl = () => {
  for(const id of Object.keys(S.dex)) S.dex[id].lvl = Math.max(S.dex[id].lvl, 70);
  admDone("Collection au niveau 70");
};
ACTIONS.admballs = () => { for(const k in BALLS) S.balls[k] = (S.balls[k]||0) + 99; admDone("Balls ajoutées"); };
ACTIONS.admberries = () => { for(const k in BERRIES) S.berries[k] = (S.berries[k]||0) + 50; admDone("Baies ajoutées"); };
ACTIONS.admstones = () => { for(const k in STONES) S.stones[k] = (S.stones[k]||0) + 10; admDone("Pierres ajoutées"); };

  admDone("Objets de combat ajoutés"); };

  for(const id of CARD_MONS) for(const s of cardVariants(id)) grantCardV(s, id);
  grantSecretCard();
  admDone("Collection de cartes complète");
};
ACTIONS.admcos = () => { for(const id in COSMETICS) if(!S.cos.owned.includes(id)) S.cos.owned.push(id);
  admDone("Cosmétiques débloqués"); };

function admBeatGuardian(r, i){
  const g = r.guardians[i];
  const key = guardianKey(r.key, g.id);
  if(S.bosses.includes(key)) return false;
  S.bosses.push(key);
  S.stats.bossWins++;
  addToDex(g.id, guardianLevel(r, i), false);
  addIntegrity(g.core ? 5 : 2.5);
  grantCardV(rollCardSeries(g.id, g.core ? 3.2 : 1.8), g.id);
  return true;
}
function admBeatNext(){
  for(const r of REGIONS)
    for(let i=0;i<r.guardians.length;i++)
      if(admBeatGuardian(r, i)) return r.guardians[i].name;
  return null;
}
ACTIONS.admboss1 = () => { const n = admBeatNext(); admDone(n ? n + " relâché" : "Tous les verrous sont déjà levés"); };

  for(const r of REGIONS) for(let i=0;i<r.guardians.length;i++) admBeatGuardian(r, i);
  admDone("Les neuf verrous sont levés");
};

ACTIONS.admspawn = () => {
  const v = parseInt(document.getElementById("adm-id")?.value || "", 10);
  if(!v || !POKE[v]){ toast("Numéro invalide (1-386)", "bad", "cross"); return; }
  S.region = regionOf(v);
  newEncounter({id:v, rar:POKE[v].rar});
  admMark(); closeSheet(); go("capture");
};
ACTIONS.admspawnrand = d => {
  const wantShiny = d.s === "1";
  const r = regionDef(S.region);
  let pool = [];
  for(let i=r.from;i<=r.to;i++) if(POKE[i] && (d.r ? POKE[i].rar === +d.r : true)) pool.push(i);
  if(!pool.length) for(let i=r.from;i<=r.to;i++) pool.push(i);
  const id = pick(pool);
  newEncounter({id, rar:POKE[id].rar});
  if(wantShiny && ENC){ ENC.shiny = true; Sfx.shiny(); }
  admMark(); closeSheet(); go("capture");
};

ACTIONS.admaff = d => {

/* ===== 95-online.js ===== */
/* ============================================================
   95 — COUCHE EN LIGNE
   Client REST direct vers Supabase : aucun SDK externe n'est
   charge, ce qui preserve le fichier unique et fonctionne meme
   quand les scripts tiers sont bloques.
   Tout est facultatif : sans configuration, le jeu est identique.
   ============================================================ */

/* Configuration. Renseignable dans le jeu (Profil > En ligne) ou ici.
   La cle « anon » est publique par nature : la securite repose sur les
   politiques RLS decrites dans sql/schema.sql, pas sur son secret. */
const ONLINE_DEFAULT = (typeof window !== "undefined" && window.PCG_CONFIG)
  ? {url: window.PCG_CONFIG.url || "", key: window.PCG_CONFIG.key || ""}
  : {url: "", key: ""};
const NET_CFG_KEY = "pcg.net.cfg";
const NET_SESSION_KEY = "pcg.net.session";

const Net = {
  cfg: null, session: null, profile: null, busy: false, lastError: null,

  /* ---------- configuration ---------- */
  load(){
    try {
      const raw = Store.get(NET_CFG_KEY);
      const saved = raw ? JSON.parse(raw) : null;
      /* une configuration fournie par l'hebergement l'emporte sur une saisie ancienne */
      this.cfg = (ONLINE_DEFAULT.url && ONLINE_DEFAULT.key)
        ? Object.assign({}, ONLINE_DEFAULT)
        : (saved || Object.assign({}, ONLINE_DEFAULT));
    } catch(e){ this.cfg = Object.assign({}, ONLINE_DEFAULT); }
    try {
      const raw = Store.get(NET_SESSION_KEY);
      this.session = raw ? JSON.parse(raw) : null;
    } catch(e){ this.session = null; }
  },
  setCfg(url, key){
    this.cfg = {url: (url||"").trim().replace(/\/+$/,""), key: (key||"").trim()};
    Store.set(NET_CFG_KEY, JSON.stringify(this.cfg));
  },
  configured(){ return !!(this.cfg && this.cfg.url && this.cfg.key); },
  signedIn(){ return !!(this.session && this.session.access_token); },
  userId(){ return this.session && this.session.user && this.session.user.id; },
  saveSession(s){
    this.session = s;
    if(s) Store.set(NET_SESSION_KEY, JSON.stringify(s));
    else Store.del(NET_SESSION_KEY);
  },

  /* ---------- transport ---------- */
  async call(path, opts){
    opts = opts || {};
    if(!this.configured()) throw new Error("Service en ligne non configuré");
    const headers = Object.assign({
      "apikey": this.cfg.key,
      "Content-Type": "application/json"
    }, opts.headers || {});
    if(opts.auth !== false && this.signedIn())
      headers["Authorization"] = "Bearer " + this.session.access_token;
    else if(opts.auth !== false)
      headers["Authorization"] = "Bearer " + this.cfg.key;

    const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    const timer = ctrl ? setTimeout(()=>ctrl.abort(), opts.timeout || 15000) : null;
    let res;
    try {
      res = await fetch(this.cfg.url + path, {
        method: opts.method || "GET",
        headers,
        body: opts.body ? JSON.stringify(opts.body) : undefined,
        signal: ctrl ? ctrl.signal : undefined
      });
    } catch(e){
      if(timer) clearTimeout(timer);
      throw new Error("Réseau indisponible");
    }
    if(timer) clearTimeout(timer);

    /* jeton expire : on rafraichit une fois puis on rejoue la requete */
    if(res.status === 401 && this.session && this.session.refresh_token && !opts._retried){
      const ok = await this.refresh();
      if(ok) return this.call(path, Object.assign({}, opts, {_retried:true}));
      this.saveSession(null);
      throw new Error("Session expirée, reconnectez-vous");
    }
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch(e){ data = text; }
    if(!res.ok){
      const msg = (data && (data.msg || data.message || data.error_description || data.error)) || ("Erreur " + res.status);
      throw new Error(msg);
    }
    return data;
  },

  /* ---------- authentification par code a usage unique ---------- */
  async requestCode(email){
    await this.call("/auth/v1/otp", {
      method:"POST", auth:false,
      body:{ email, create_user:true }
    });
    return true;
  },
  /* Selon que le compte existe deja ou non, GoTrue attend un type de
     verification different. On les essaie dans l'ordre plutot que de faire
     echouer une premiere connexion legitime. */
  async verifyCode(email, token){
    const t = String(token).trim();
    let last = null;
    for(const type of ["email", "signup", "magiclink"]){
      try {
        const s = await this.call("/auth/v1/verify", {
          method:"POST", auth:false, body:{ email, token:t, type }
        });
        if(s && s.access_token){ this.saveSession(s); return s; }
      } catch(e){ last = e; }
    }
    throw new Error((last && last.message) || "Code refusé");
  },
  async refresh(){
    try {
      const s = await this.call("/auth/v1/token?grant_type=refresh_token", {
        method:"POST", auth:false, _retried:true,
        body:{ refresh_token: this.session.refresh_token }
      });
      if(s && s.access_token){ this.saveSession(s); return true; }
    } catch(e){}
    return false;
  },
  signOut(){ this.saveSession(null); this.profile = null; },

  /* ---------- sauvegarde distante ---------- */
  /* La revision est monotone : elle tranche les conflits sans dependre
     de l'horloge de l'appareil, qui n'est pas fiable. */
  async pull(){
    const rows = await this.call(
      `/rest/v1/saves?user_id=eq.${this.userId()}&select=rev,updated_at,payload`);
    return (rows && rows[0]) || null;
  },
  async push(force){
    const S2 = JSON.parse(JSON.stringify(S));
    delete S2.expedition; delete S2.poker;      /* les runs en cours ne se synchronisent pas */
    const rev = (S.netRev || 0) + 1;
    const body = {
      user_id: this.userId(),
      rev,
      payload: S2,
      name: S.name,
      level: S.level,
      integrity: +S.integrity.toFixed(2),
      dex_count: dexTotal(),
      shinies: Object.values(S.dex).filter(e=>e.shiny).length,
      best_streak: S.stats.bestStreak,
      best_ante: S.pokerMeta.bestAnte || 0,
      cards: Object.keys(S.cards || {}).length,
      guardians: S.bosses.length,
      tested: !!S.flags.testUsed
    };
    await this.call("/rest/v1/saves?on_conflict=user_id", {
      method:"POST",
      headers:{ "Prefer": force ? "resolution=merge-duplicates" : "resolution=merge-duplicates" },
      body:[body]
    });
    S.netRev = rev;
    saveSoon();
    return rev;
  },

  /* ---------- classements ---------- */
  async leaderboard(metric, limit){
    const cols = "name,level,integrity,dex_count,shinies,best_streak,best_ante,guardians,cards,tested,user_id";
    const q = `/rest/v1/leaderboard?select=${cols}&order=${metric}.desc&limit=${limit||25}`;
    return await this.call(q);
  },

  /* ---------- echanges de cartes ---------- */
  /* la carte est identifiee par sa cle complete, « serie:espece » */
  async offerCard(cardKey){
    return await this.call("/rest/v1/rpc/offer_card", {
      method:"POST", body:{ p_key: cardKey }
    });                                           /* { code } */
  },
  async claimCard(code){
    return await this.call("/rest/v1/rpc/claim_card", {
      method:"POST",
      body:{ p_code: String(code).trim().toUpperCase() }
    });
  },
  async myOffers(){
    return await this.call(
      `/rest/v1/trades?from_user=eq.${this.userId()}&select=code,card_key,species,series,claimed_by,created_at&order=created_at.desc&limit=20`);
  }
};

/* ---------- resolution de conflit ---------- */
function netCompare(remote){
  const localRev = S.netRev || 0;
  if(!remote) return "push";
  if(remote.rev > localRev) return "pull";
  if(remote.rev < localRev) return "push";
  return "same";
}
function netSummary(payload){
  if(!payload) return "—";
  return `niv.${payload.level||"?"} · ${Object.keys(payload.dex||{}).length} espèces · `
       + `${(payload.integrity||0).toFixed(1)}% · ${(payload.stats&&payload.stats.catches)||0} captures`;
}

async function netRun(fn, okMsg){
  Net.busy = true; Net.lastError = null; refresh();
  try {
    const r = await fn();
    if(okMsg) toast(okMsg, "", "check");
    return r;
  } catch(e){
    Net.lastError = e.message || String(e);
    toast(Net.lastError, "bad", "cross");
    return null;
  } finally {
    Net.busy = false; refresh();
  }
}
ACTIONS.netcode = () => {

  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){ toast("Adresse invalide", "bad", "cross"); return; }
  S.netMail = mail; saveSoon();
  netRun(()=>Net.requestCode(mail), "Code envoyé — vérifiez vos courriels");
};
ACTIONS.netverify = () => {
  const mail = (document.getElementById("net-mail")?.value || S.netMail || "").trim();
  const otp  = (document.getElementById("net-otp")?.value || "").trim();
  if(!otp){ toast("Saisissez le code", "bad", "cross"); return; }
  netRun(async ()=>{
    await Net.verifyCode(mail, otp);
    const remote = await Net.pull();
    const verdict = netCompare(remote);
    if(verdict === "pull" && remote) netAskPull(remote);
    else await Net.push();
  }, "Connecté");
};
ACTIONS.netsignout = () => { Net.signOut(); toast("Déconnecté", "", "check"); refresh(); };
ACTIONS.netpush = () => netRun(async ()=>{
  const remote = await Net.pull();
  if(netCompare(remote) === "pull"){ netAskPull(remote); return; }
  await Net.push();
}, "Sauvegarde envoyée");

/* ---------- synchronisation automatique ---------- */
let netAutoTimer = null;
function netAutoSync(){
  if(!Net.signedIn() || Net.busy) return;
  Net.push().catch(()=>{});
}
function netStart(){
  Net.load();
  clearInterval(netAutoTimer);
  netAutoTimer = setInterval(netAutoSync, 5*60*1000);
}

function bootScreen(done){
  const el = document.getElementById("boot");
  el.style.display = "flex";
  el.innerHTML = `
    <div class="logo">POKÉMON<br><span>CODE</span> GENESIS</div>
    <span class="sprbox" style="width:96px;height:96px;opacity:.9">
      ${sprite(474, false, "", {anim:true, eager:true})}</span>
    <div class="term" id="boot-term"></div>
    <div class="tiny dim">jeu de fan non officiel</div>`;
  const term = document.getElementById("boot-term");
  let i = 0;
  const step = () => {
    if(i >= BOOT_LINES.length){
      const b = document.createElement("div");
      b.innerHTML = `<br>`;
      term.appendChild(b);
      const btn = document.createElement("button");
      btn.className = "btn pri wide";
      btn.textContent = "Entrer dans l'archive";
      btn.onclick = () => { el.style.display = "none"; el.innerHTML = ""; done(); };
      el.appendChild(btn);
      return;
    }
    const l = BOOT_LINES[i++];
    const d = document.createElement("div");
    d.className = l.c;
    d.innerHTML = `<b>&gt;</b> ${esc(l.t)}`;
    term.appendChild(d);
    if(term.children.length > 9) term.firstChild.remove();
    Sfx.click();
    setTimeout(step, 150 + rng()*130);
  };
  setTimeout(step, 220);
}

/* --- PWA : manifeste genere a la volee --- */
function installPwaBits(){
  try {
    /* la version hebergee declare deja un manifeste : on ne le double pas */
    if(document.querySelector('link[rel="manifest"]')) return;
    const icon = "data:image/svg+xml;utf8," + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192">
        <rect width="192" height="192" fill="#05070c"/>
        <circle cx="96" cy="96" r="58" fill="none" stroke="#35f0d6" stroke-width="10"/>
        <path d="M38 96h116" stroke="#35f0d6" stroke-width="10"/>
        <circle cx="96" cy="96" r="20" fill="#ff3d7f"/></svg>`);
    const manifest = {
      name: "Pokémon Code Genesis", short_name: "Code Genesis",
      start_url: ".", display: "standalone", orientation: "portrait",
      background_color: "#05070c", theme_color: "#05070c",
      icons: [{src: icon, sizes: "192x192", type: "image/svg+xml", purpose: "any"}]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:"application/json"});
    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  } catch(e){ /* sans consequence */ }
}

/* --- notification de disponibilite du tampon --- */
function maybeNotify(){
  try {
    if(!("Notification" in window) || Notification.permission !== "granted") return;
    if(!canOpenBox()) return;
    const key = "pcg.notif." + today();
    if(Store.get(key)) return;
    Store.set(key, "1");
    new Notification("Pokémon Code Genesis", {
      body: "Le tampon quotidien de Porygon-Z est de nouveau disponible."
    });
  } catch(e){}
}

/* --- boucle principale --- */
let mainTimer = null;
function startLoops(){
  clearInterval(mainTimer);
  mainTimer = setInterval(()=>{
    idleTick();
    renderTopbar();
    if(S.event && S.event.until <= Date.now()){ S.event = null; rollEvent(); }
    if(currentScreen === "idle"){ /* le compteur se met a jour dans son propre intervalle */ }
  }, 1000);
  setInterval(save, 20000);
}

/* --- heure de jeu : succes cache --- */
function checkNightFlag(){
  const h = new Date().getHours();
  if(h >= 3 && h < 5) S.flags.night = true;
}

function boot(){
  installSpriteVars();
  netStart();
  probeAnimated();
  installPwaBits();
  const loaded = load();
  const fresh = !loaded;
  S = loaded || newState();

  applyCorruption();
  dailyRollover();
  checkNightFlag();
  S.idle.last = Date.now();

  const enter = () => {
    startLoops();
    if(fresh){
      /* rien du jeu ne doit apparaitre derriere la scene d'ouverture */
      playStory("intro", ()=>{ go("capture"); tutoMaybe("intro"); });
      checkAchievements();
      save();
      return;
    }
    go("capture");
    {
      if(!showOfflineReport()){ if(!showLuckyDay()){ if(!checkStoryTriggers()) refresh(); } }
    }
    checkAchievements();
    guideTick();
    maybeNotify();
    save();
  };

  if(fresh) bootScreen(enter);
  else { document.getElementById("boot").style.display = "none"; enter(); }
}

/* --- cycle de vie --- */
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){ save(); netAutoSync(); }
  else {
    if(!S) return;
    const rep = offlineReport();
    dailyRollover();
    S.idle.last = Date.now();
    if(rep && rep.away > 300000) showOfflineReport();
    else refresh();
    maybeNotify();
  }
});
window.addEventListener("beforeunload", ()=>{ if(S){ save(); netAutoSync(); } });
window.addEventListener("error", e=>{ console.error(e.error||e.message); });

/* empeche le zoom par double-tap sans bloquer le defilement */
let lastTouch = 0;
document.addEventListener("touchend", e=>{
  const now = Date.now();
  if(now - lastTouch < 300) e.preventDefault();
  lastTouch = now;
}, {passive:false});

let booted = false;
function bootOnce(){ if(booted) return; booted = true; boot(); }
document.addEventListener("DOMContentLoaded", bootOnce);
if(document.readyState !== "loading") bootOnce();
