Il est long, il est mou, et il s'infiltre partout. Non, ce n'est pas ce que vous croyez.
Il a une horloge interne parfaite, ce qui le rend insupportable pour ceux qui aiment dormir le matin.
Il réfléchit tellement que sa tête enfle. L'intellectuel prétentieux de la forêt.
Une coccinelle qui fait de la boxe. La nature a vraiment des idées stupides.
Quatre bras pour mieux vous gifler. Il frappe à la vitesse de la lumière, vous ne verrez rien venir.
Il tisse des toiles avec son visage. Une façon dégoûtante d'être créatif.
Il piège ses proies et les sirote lentement. Ne vous endormez pas près de lui.
Quatre ailes pour voler silencieusement. Il vous vide de votre sang sans même vous réveiller. Sympa.
Il vit au fond de l'eau et électrocute tout. Un grille-pain dans une baignoire, version poisson.
Sa lumière attire les proies. 'Oh, c'est joli !' fut leur dernière pensée.
Il ne sait pas gérer son électricité et s'électrocute lui-même. La sélection naturelle a échoué ici.
On dit que sa forme d'étoile porte chance. Surtout si vous ne marchez pas dessus.
Un ballon rose avec des yeux rouges. Il ressemble à un cauchemar sous hélium.
Une omelette qui pleure. Ne le secouez pas trop fort, il est fragile.
Il apporte le bonheur, mais s'enfuit dès que vous êtes triste. Un ami toxique.
Il sautille parce que ses ailes ne sont pas finies. L'évolution a bâclé le travail.
Il voit le futur et reste immobile, paralysé par l'horreur de votre avenir.
Sa laine génère de l'électricité statique. Touchez-le et perdez vos sourcils.
Il a perdu sa laine et ressemble maintenant à un coton-tige rose géant.
Il brille tellement fort qu'on le voit de l'espace. Aucune intimité possible.
Une fleur qui danse. Si elle danse mal, il pleut. C'est de sa faute si vos vacances sont gâchées.
Une souris d'eau qui flotte comme une bouée. Utile en cas de naufrage, inutile sinon.
Un lapin aquatique qui peut faire des bulles. C'est tout. Il fait des bulles.
Il fait semblant d'être un arbre. Les chiens lui pissent dessus. Triste vie.
Une grenouille avec une coupe afro. Le roi du disco des marais.
Il est si léger que le vent l'emporte. On en perd des centaines chaque année.
Il flotte sur la tête des gens pour absorber leurs nutriments. Un chapeau parasite.

Il ne bouge que s'il y a du soleil. La nuit, c'est juste un légume.

Il fait du jus de baie dans sa coquille. Les autres Pokémon le boivent. C'est... spécial.

Il vole les œufs des autres pour les manger. Un criminel né.

De la lave vivante. Il ne peut jamais dormir dans un lit sans mettre le feu.

Un chat mignon qui charme ses ennemis. Ne lui faites pas confiance.
Il est obsédé par la propreté. Si vous êtes sale, il vous attaque.
Il mange des pierres précieuses et a des yeux en diamant. Un régime coûteux.
Il a une mâchoire d'acier dans le dos. On ne sait pas laquelle est la vraie tête.
Il mange du métal pour renforcer son armure. Il va manger votre vélo.

Il mange tellement de fer qu'il est devenu un monstre d'acier. Lourd.

La même chose, mais en rouge. Toujours aussi insupportablement positifs.

Il a des roses à la place des mains. Beau mais épineux.
Un estomac liquide qui dissout tout. Ne le prenez pas dans vos bras.
Il avale tout ce qui bouge. Un trou noir avec des moustaches.
Un piranha féroce. Il mord tout. Ne mettez pas les doigts dans l'eau.

Un cactus qui marche la nuit pour suivre les voyageurs. Flippant.
Un épouvantail maudit qui vous suit. Ne regardez pas derrière vous.
Un oiseau nuage. Il se cache dans le ciel. Il est doux comme du coton.
Il chante magnifiquement mais ses ailes sont en coton. Un dragon fragile.
Une mangouste en colère. Elle déteste les serpents. Rivalité ancestrale.
Un serpent venimeux. Il déteste les mangoustes. Rivalité ancestrale, le retour.
Une lune en pierre qui flotte. Elle tire des rayons cosmiques.
Un soleil en pierre qui flotte. Il brûle tout ce qui s'approche.
Un poisson vaseux. Il est glissant et ne sert à rien.
Un poisson chat qui provoque des séismes. Il ne le fait pas exprès, il est juste maladroit.
Une écrevisse agressive. Elle attaque tout ce qui entre dans son territoire.
Un homard géant. Il est fort et il le sait. Il claque ses pinces.
Une poupée d'argile qui tourne. Elle a été créée par une civilisation ancienne.
Une statue d'argile qui tire des rayons laser. La technologie antique était bizarre.
Un fossile de plante marine. Il a des tentacules bizarres.
Il vit au fond de l'océan et attrape ses proies avec ses ventouses. Le kraken préhistorique.
Un fossile d'insecte avec des griffes. Il est rapide et mortel.
Un guerrier en armure d'insecte. Il est honoré et dangereux.
Un poisson moche mais résistant. Il survit à tout, même à la pollution.
Le plus beau des Pokémon (selon lui). Il vit pour être admiré.
Il change de forme selon la météo. Un baromètre vivant.
Un caméléon qui se camoufle. Vous ne le verrez jamais venir.
Une poupée maudite qui cherche son propriétaire. Histoire d'horreur classique.
Une marionnette fantôme. Elle sourit, mais elle veut votre âme.
Un fantôme cyclope. Il voit tout, surtout vos péchés.
Une momie cyclope. Il piège les gens dans son corps vide. Très accueillant.
Un dinosaure volant avec des bananes au menton. Design audacieux.
Une cloche qui tinte dans le vent. Elle apaise les esprits.
Un désastre sur pattes. Il apparaît quand une catastrophe arrive. Porte-poisse.
Il est toujours heureux. Pourquoi ? Personne ne sait. Suspect.
Il grelotte tout le temps. Mettez-lui un pull.
Une tête de glace géante. Il gèle tout sur son passage.
Une boule de graisse qui nage et applaudit. Le public idéal.
Un morse avec une moustache magnifique. Il brise la glace avec ses dents.
Une perle qui nage. Elle est précieuse, ne la perdez pas.
Une anguille des abysses. Elle chasse en utilisant sa lumière. Terrifiant.
Un serpent des mers magnifique mais dangereux. Il vit dans les profondeurs.
Un poisson qui ne sait pas nager. Sérieusement ? L'évolution a merdé.
Un poisson ancien et puissant. Sa tête est dure comme la pierre.
Un cœur qui nage. Il cherche l'amour dans l'océan. Romantique.
Un dragon qui veut voler. Il saute des falaises pour apprendre. Courageux ou suicidaire.
Il a une coquille dure pour se protéger en attendant de voler.
Enfin, il vole ! Il est furieux d'avoir attendu si longtemps. Il brûle tout.
Un robot cyclope en métal. Il calcule tout. Il n'a pas d'âme.
Deux robots cyclopes fusionnés. Deux fois plus de calculs, zéro âme.
Un superordinateur de combat à quatre pattes. Il gagne aux échecs et à la guerre.
Un golem de roche. Si vous le cassez, il se répare. Pratique.
Un golem de glace. Il fond si on lui fait un câlin. Triste.
Un golem d'acier. Il ne fond pas, ne casse pas. L'ennui total.
Un dragon femelle qui vole à la vitesse du son. Elle est invisible quand elle va vite.
Un dragon mâle qui vole encore plus vite. Il protège sa sœur.
Le maître des océans. Il veut noyer le monde. Un peu extrême comme ambition.
Le maître de la terre. Il veut assécher les océans. Il déteste se mouiller.
Le maître du ciel. Il descend pour calmer les deux autres abrutis. La nounou cosmique.
Il exauce les vœux. Attention à ce que vous demandez, il a un sens de l'humour tordu.
Un alien virus. Il change de forme pour mieux vous détruire. Bienvenue sur Terre.
`;

const POKE = {};        /* id -> fiche */
const POKE_IDS = [];
(function parseDex(){
  for(const line of DEX_BLOB.trim().split("\n")){
    const p = line.split("|");
    const id = +p[0];
    const evo = p[7] ? p[7].split(";").map(e=>{const q=e.split(":");return {to:+q[0],lvl:+q[1],stone:q[2]||""};}) : [];
    const st = p[3].split(",").map(Number);
    POKE[id] = {
      id, name:p[1], types:p[2].split(",").map(Number),
      hp:st[0], atk:st[1], def:st[2], spa:st[3], spd:st[4], spe:st[5], bst:st.reduce((a,b)=>a+b,0),
      catch:+p[4], gen:+p[5], rar:+p[6], evo, leg:+p[8]
    };
    POKE_IDS.push(id);
  }
  for(const id of POKE_IDS) for(const e of POKE[id].evo) if(POKE[e.to]) POKE[e.to].from = id;
})();

/* jusqu'a 4 attaques, coherentes avec les types et le niveau */
function movesFor(p, level){
  const tier = level >= 45 ? 3 : level >= 30 ? 2 : level >= 15 ? 1 : 0;
  const out = [];
  for(const t of p.types){
    out.push(MOVE_POOL[t][Math.min(tier, 3)]);
    if(tier >= 2) out.push(MOVE_POOL[t][Math.max(0, tier-2)]);
  }
  out.push(MOVE_POOL[1][Math.min(tier,3)]);
  const seen = new Set(), res = [];
  for(const m of out){ if(!seen.has(m.name)){ seen.add(m.name); res.push(m); } }
  /* a partir du niveau 12, une manœuvre remplace la derniere attaque */
  if(level >= 12){
    const t = p.types[0];
    const u = UTILITY_MOVES[t];
    if(u && !seen.has(u.name)){
      const util = Object.assign({type:t, tier:0, util:true}, u);
      if(res.length >= 4) res[3] = util; else res.push(util);
    }
  }
  return res.slice(0, 4);
}

/* composition du bouquet selon le niveau d'Archiviste */
function questMix(level){
  if(level < 8)  return ["easy","easy","easy","medium"];
  if(level < 16) return ["easy","easy","medium","medium"];
  if(level < 26) return ["easy","medium","medium","hard"];
  if(level < 40) return ["medium","medium","hard","hard"];
  return ["medium","hard","hard","expert"];
}

/* --- stockage resilient : localStorage si dispo, memoire sinon --- */
const Store = (function(){
  let ok = true, mem = {};
  try { const k="__t"; localStorage.setItem(k,"1"); localStorage.removeItem(k); }
  catch(e){ ok = false; }
  return {
    available: ok,
    get(k){ try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
    set(k,v){ try { ok ? localStorage.setItem(k,v) : (mem[k]=v); } catch(e){ ok=false; mem[k]=v; } },
    del(k){ try { ok ? localStorage.removeItem(k) : delete mem[k]; } catch(e){ delete mem[k]; } }
  };
})();

const rng = () => Math.random();
function mulberry32(a){ return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function pick(arr, r){ return arr[Math.floor((r||rng)()*arr.length)]; }
function randInt(a,b,r){ return a + Math.floor(((r||rng)())*(b-a+1)); }
function shuffle(arr, r){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor((r||rng)()*(i+1));
  [a[i],a[j]]=[a[j],a[i]]; } return a; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }

function save(){
  if(!S) return;
  S.lastSeen = Date.now();
  try { Store.set(SAVE_KEY, JSON.stringify(S)); } catch(e){ console.warn("sauvegarde impossible", e); }
}
let saveTimer = null;
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 900); }

function load(){
  const raw = Store.get(SAVE_KEY);
  if(!raw) return null;
  try {
    const d = JSON.parse(raw);
    if(!d || typeof d !== "object") return null;
    const base = newState();
    /* fusion tolerante : les nouvelles cles apparaissent sans casser l'ancienne sauvegarde */
    const merged = deepFill(d, base);
    merged.v = SAVE_VER;
    merged.cards = migrateCards(merged.cards);
    return merged;
  } catch(e){ console.warn("sauvegarde illisible", e); return null; }
}
function deepFill(obj, def){
  if(obj === null || obj === undefined) return def;
  if(Array.isArray(def)) return Array.isArray(obj) ? obj : def;
  if(typeof def !== "object") return typeof obj === typeof def ? obj : def;
  const out = Array.isArray(obj) ? obj : {};
  for(const k in def) out[k] = deepFill(obj[k], def[k]);
  for(const k in obj) if(!(k in out)) out[k] = obj[k];
  return out;
}

function today(){ const d = new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

/* --- monnaies --- */
const CUR_NAME = {coins:"PokéCoins", shards:"Fragments", cores:"Noyaux", energy:"Énergie"};
function gain(cur, n){
  if(n <= 0) return;
  S[cur] = (S[cur]||0) + n;
  if(cur === "energy") S.stats.energyTotal += n;
  Bus.emit("currency", {cur, n});
  saveSoon();
}
function canPay(cur, n){ return (S[cur]||0) >= n; }
function pay(cur, n){
  if(!canPay(cur,n)) return false;
  S[cur] -= n;
  if(cur === "coins"){ S.stats.spend += n; S.daily.daySpend += n; questTick("daySpend", n); }
  Bus.emit("currency", {cur, n:-n});
  saveSoon();
  return true;
}

/* --- niveau d'archiviste --- */
/* palier initial volontairement plat : les premiers niveaux doivent se meriter
   sans faire attendre, puis la courbe reprend une pente normale */
function xpForLevel(l){ return Math.floor(180 + 55 * Math.pow(l, 1.75)); }
function addXp(n){
  if(n<=0) return;
  const mult = (eventActive("ev_xp") ? 2 : 1) * (heldActive("xp") ? 1.25 : 1)
             * (boostActive("xp") ? 1.4 : 1) * (luckyF("xp") || 1);
  S.xp += Math.round(n*mult);
  let up = 0;
  while(S.xp >= xpForLevel(S.level)){ S.xp -= xpForLevel(S.level); S.level++; up++; }
  if(up){
    gain("coins", 200*S.level);
    if(S.level % 5 === 0) gain("cores", 1);
    Bus.emit("levelup", S.level);
    toast(`Niveau d'Archiviste ${S.level}`, "warn", "star");
    pzFlash(pzLine("levelup"));
  }
  saveSoon();
}

/* --- integrite du monde --- */
function addIntegrity(n){
  if(cycleMod("m_slow")) n *= 0.6;
  if(n<=0) return;
  const before = S.integrity;
  Bus.emit("integGain", n);
  S.integrity = clamp(S.integrity + n, 0, 100);
  if(Math.floor(S.integrity) !== Math.floor(before)) Bus.emit("integrity", S.integrity);
  applyCorruption();
  /* les scenes sont declenchees aux points surs (fermeture de feuille, nouvelle rencontre) */
  saveSoon();
}
function applyCorruption(){
  const c = clamp(1 - S.integrity/100, 0, 1);
  document.documentElement.style.setProperty("--corrupt", (c*0.9).toFixed(3));
}

/* --- pokedex --- */
function dexEntry(id){ return S.dex[id]; }
function dexHas(id){ return !!S.dex[id]; }
function dexCount(regionKey){
  const r = regionDef(regionKey); let n = 0;
  for(let i=r.from; i<=r.to; i++) if(S.dex[i]) n++;
  return n;
}
function dexTotal(){ return Object.keys(S.dex).length; }
function dexRegionPct(key){
  const r = regionDef(key);
  return dexCount(key) / (r.to - r.from + 1) * 100;
}

function addToDex(id, level, shiny){
  const isNew = !S.dex[id];
  if(isNew) S.dex[id] = {c:0, s:0, lvl:level||5, shiny:false};
  const e = S.dex[id];
  e.c++;
  if(shiny){ e.s++; e.shiny = true; }
  if((level||5) > e.lvl) e.lvl = level;
  if(isNew){
    S.daily.dayNew++; questTick("dayNew",1);
    if(S.team.length < 6) S.team.push(id);
  }
  return isNew;
}

/* --- evenements a duree limitee --- */
function eventActive(id){ return S.event && S.event.id === id && S.event.until > Date.now(); }
function currentEvent(){ return (S.event && S.event.until > Date.now()) ? S.event : null; }
function rollEvent(force){
  if(!force && currentEvent()) return;
  if(!force && rng() > 0.5) { S.event = null; return; }
  const e = pick(EVENT_TYPES);
  S.event = {id:e.id, n:e.n, d:e.d, until: Date.now() + e.dur*60000};
  saveSoon();
}

/* --- quetes quotidiennes --- */
function rollQuests(){
  const mix = questMix(S.level).slice();
  if(perkLv("p_quest")) mix.push("medium");
  const banned = new Set(S.lastQuestIds || []);
  const chosen = [], used = new Set();
  for(const tier of mix){
    const pool = QUEST_POOLS[tier].filter(q=>!used.has(q.id) && !banned.has(q.id));
    /* si l'anti-repetition vide le vivier, on relache la contrainte plutot que d'echouer */
    const src = pool.length ? pool : QUEST_POOLS[tier].filter(q=>!used.has(q.id));
    if(!src.length) continue;
    const q = pick(src);
    used.add(q.id);
    chosen.push({id:q.id, n:q.n.replace("{n}", fmt(q.g)), goal:q.g, stat:q.stat,
                 tier, prog:0, claimed:false, rw:Object.assign({}, q.rw)});
  }
  S.lastQuestIds = chosen.map(q=>q.id);
  S.quests = chosen;
  S.questDay = today();
}

function questTick(stat, n){
  weeklyTick(stat, n);
  if(!S.quests) return;
  let changed = false;
  for(const q of S.quests){
    if(q.stat === stat && q.prog < q.goal){
      q.prog = Math.min(q.goal, q.prog + n);
      if(q.prog >= q.goal){ changed = true; toast("Quête accomplie : " + q.n, "warn", "check"); }
    }
  }
  if(changed) Bus.emit("quest");
  saveSoon();
}
function questSet(stat, value){
  for(const q of S.quests||[]) if(q.stat === stat && value > q.prog){
    const was = q.prog >= q.goal;
    q.prog = Math.min(q.goal, value);
    if(!was && q.prog >= q.goal) toast("Quête accomplie : " + q.n, "warn", "check");
  }
}
function claimQuest(i){
  const q = S.quests[i];
  if(!q || q.claimed || q.prog < q.goal) return;
  q.claimed = true;
  for(const k in q.rw) gain(k, q.rw[k]);
  toast("Récompense encaissée", "", "coin");
  Bus.emit("quest"); saveSoon();
}

/* --- rollover quotidien --- */
function dailyRollover(){
  const t = today();
  if(S.daily.day !== t){
    S.daily = {day:t, dayCatch:0, dayNew:0, dayStreak:0, dayFish:0, daySpend:0, dayExp:0,
               dayPokerBlinds:0, dayRare:0, dayEvo:0, dayEnergy:0, dayThrow:0, dayBoss:0, firstWin:{}};
  }
  if(S.questDay !== t) rollQuests();
  /* serie de connexion */
  if(S.login.last !== t){
    if(S.login.last === yesterdayStr()) S.login.days++;
    else S.login.days = 1;
    S.login.last = t;
    if(S.login.days > S.login.best) S.login.best = S.login.days;
  }
  weeklyRollover();
  contractRollover();
  luckyRollover();
  rollEvent();
  saveSoon();
}
function loginRewardFor(day){
  const d = ((day-1) % 7) + 1;
  const cycle = Math.floor((day-1)/7);
  const b = 1 + cycle*0.35;
  const tbl = [
    {coins:Math.round(300*b)}, {balls:{super:Math.round(4*b)}}, {shards:Math.round(18*b)},
    {coins:Math.round(700*b)}, {berries:{framby:3}}, {shards:Math.round(35*b)},
    {cores:1+cycle, balls:{hyper:Math.round(3*b)}}
  ];
  return tbl[d-1];
}
function claimLogin(){
  const t = today();
  if(S.login.claimed === t) return false;
  S.login.claimed = t;
  const rw = loginRewardFor(S.login.days);
  grantReward(rw);
  saveSoon();
  return rw;
}

function grantReward(rw){
  for(const k in rw){
    if(k === "balls"){ for(const b in rw.balls) S.balls[b] = (S.balls[b]||0) + rw.balls[b]; }
    else if(k === "berries"){ for(const b in rw.berries) S.berries[b] = (S.berries[b]||0) + rw.berries[b]; }
    else if(k === "stones"){ for(const b in rw.stones) S.stones[b] = (S.stones[b]||0) + rw.stones[b]; }
    else if(k === "cos"){ unlockCosmetic(rw.cos); }
    else if(k === "dex"){ addToDex(rw.dex, 5, false); }
    else gain(k, rw[k]);
  }
}
function rewardText(rw){
  const out = [];
  for(const k in rw){
    if(k === "balls") for(const b in rw.balls) out.push(`${rw.balls[b]} ${BALLS[b].name}`);
    else if(k === "berries") for(const b in rw.berries) out.push(`${rw.berries[b]} ${BERRIES[b].name}`);
    else if(k === "stones") for(const b in rw.stones) out.push(`${rw.stones[b]} ${STONES[b].name}`);
    else if(k === "cos") out.push("Cosmétique : " + (COSMETICS[rw.cos]?.n||""));
    else if(k === "dex") out.push(POKE[rw.dex].name);
    else out.push(`${fmt(rw[k])} ${CUR_NAME[k]||k}`);
  }
  return out.join(" · ");
}

function checkAchievements(){
  let any = false;
  for(const a of ACHIEVEMENTS){
    if(S.ach.includes(a.id)) continue;
    let ok = false;
    try { ok = a.chk(S); } catch(e){ ok = false; }

      S.ach.push(a.id);

      toast("Succès : " + a.n, "warn", "trophy");

}

/* --- cartes legendaires --- */
const CARD_RAR = ["Standard","Holographique","Corrompue","Originelle"];
/* Les cartes etaient indexees par espece avec un niveau de qualite ; elles le
   sont desormais par serie d'illustration. La conversion est directe : les
   quatre anciennes qualites correspondent exactement aux quatre premieres
   series, de la plus courante a la plus rare. */
const CARD_MIGRATE = ["art", "g5", "g3", "g2"];
function migrateCards(cards){
  if(!cards) return {};
  const out = {};
  for(const k in cards){
    const v = cards[k];
    if(k.indexOf(":") >= 0){ out[k] = v; continue; }     /* deja au nouveau format */
    const series = CARD_MIGRATE[Math.min(3, Math.max(0, v.r|0))];
    out[series + ":" + k] = {t: v.t || Date.now(), dup: v.dup || 0};
  }
  return out;
}

/* --- formatage --- */
function fmt(n){
  n = Math.floor(n);
  if(n >= 1e9) return (n/1e9).toFixed(2)+"Md";
  if(n >= 1e6) return (n/1e6).toFixed(2)+"M";
  if(n >= 1e4) return (n/1e3).toFixed(1)+"k";
  return n.toLocaleString("fr-FR");
}
function fmtTime(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60;
  if(h) return `${h}h${String(m).padStart(2,"0")}`;
  if(m) return `${m}m${String(ss).padStart(2,"0")}`;
  return `${ss}s`;
}

/* --- pokemon individuel pour le combat --- */
function statAt(base, level, isHp){
  if(isHp) return Math.floor((2*base*level)/100) + level + 10;
  return Math.floor((2*base*level)/100) + 5;
}
function makeFighter(id, level, opts){
  opts = opts || {};
  const p = POKE[id];
  const lv = clamp(level||5, 1, 100);
  const boost = opts.boost || 1;
  const f = {
    id, name: p.name, types: p.types, level: lv, shiny: !!opts.shiny,
    maxHp: Math.floor(statAt(p.hp, lv, true) * boost),
    atk: Math.floor(statAt(p.atk, lv) * boost), def: Math.floor(statAt(p.def, lv) * boost),
    spa: Math.floor(statAt(p.spa, lv) * boost), spd: Math.floor(statAt(p.spd, lv) * boost),
    spe: Math.floor(statAt(p.spe, lv) * boost),
    moves: movesFor(p, lv), buff: {atk:1, def:1, spe:1}, status:null
  };
  f.hp = f.maxHp;
  return f;
}
function damageCalc(att, def, move, crit){
  const phys = move.type === 1 || [2,3,5,6,7,8,9,16,17].includes(move.type);
  let A = phys ? att.atk*att.buff.atk : att.spa;
  if(att.status && att.status.k === "brn" && phys) A *= 0.5;   /* brûlure */
  const D = phys ? def.def*def.buff.def : def.spd;
  const stab = att.types.includes(move.type) ? 1.5 : 1;
  const eff = typeMult(move.type, def.types);
  const rand = 0.85 + rng()*0.15;
  const c = crit ? 1.8 : 1;
  const base = (((2*att.level/5 + 2) * move.pw * (A/Math.max(1,D))) / 50) + 2;
  return {dmg: Math.max(1, Math.floor(base * stab * eff * rand * c)), eff};
}
function effLabel(e){
  if(e === 0) return "Aucun effet.";
  if(e >= 2) return "C'est super efficace !";
  if(e > 1) return "C'est efficace.";
  if(e < 1 && e > 0) return "Ce n'est pas très efficace…";
  return "";
}

/* ============================================================
   15 — RETOUR SENSORIEL (particules, gains flottants, transitions)
   ============================================================ */

function fxLayer(){ return document.getElementById("fx"); }
/* selecteur tolerant : la couche d'effets ne doit jamais interrompre le jeu */
function fxQ(sel){
  try { return document.querySelector ? document.querySelector(sel) : null; }
  catch(e){ return null; }
}

/* gerbe de particules a une position absolue de l'ecran */
function burst(x, y, opts){
  const host = fxLayer(); if(!host) return;
  opts = opts || {};
  const n = opts.n || 14;
  const colors = opts.colors || ["#35f0d6", "#ffc857", "#ffffff"];
  for(let i=0;i<n;i++){
    const p = document.createElement("i");
    p.className = "pt";
    const ang = (Math.PI*2) * (i/n) + rng()*0.5;
    const dist = (opts.spread || 60) * (0.45 + rng()*0.75);
    const size = opts.size || (3 + rng()*4);
    p.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;
      background:${colors[i % colors.length]};opacity:1;
      transition:transform ${(opts.dur||700)}ms cubic-bezier(.15,.8,.3,1), opacity ${(opts.dur||700)}ms linear;`;
    host.appendChild(p);
    requestAnimationFrame(()=>{
      p.style.transform = `translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist - (opts.lift||14)}px) scale(.25)`;
      p.style.opacity = "0";
    });
    setTimeout(()=>p.remove(), (opts.dur||700) + 60);
  }
}
/* gerbe centree sur un element */
function burstEl(el, opts){
  if(!el) return;
  const host = fxLayer(); if(!host) return;
  const r = el.getBoundingClientRect(), h = host.getBoundingClientRect();
  burst(r.left - h.left + r.width/2, r.top - h.top + r.height/2, opts);
}

/* nombre flottant */
function numPop(x, y, text, color){
  const host = fxLayer(); if(!host) return;
  const d = document.createElement("div");
  d.className = "numpop";
  d.style.left = x + "px"; d.style.top = y + "px";
  d.style.color = color || "var(--amber)";
  d.textContent = text;
  host.appendChild(d);
  setTimeout(()=>d.remove(), 1050);
}
function numPopEl(el, text, color){
  const host = fxLayer(); if(!host || !el) return;
  const r = el.getBoundingClientRect(), h = host.getBoundingClientRect();
  numPop(r.left - h.left + r.width/2 - 14, r.top - h.top, text, color);
}

let fxQueue = {};
Bus.on("currency", d=>{
  if(d.n <= 0 || d.cur === "energy") return;
  fxQueue[d.cur] = (fxQueue[d.cur]||0) + d.n;
  clearTimeout(fxQueue._t);
  fxQueue._t = setTimeout(flushCurrencyFx, 140);
});
function flushCurrencyFx(){
  for(const cur in fxQueue){
    if(cur === "_t") continue;
    const el = fxQ(`.pill[data-cur="${cur}"]`);
    if(el){
      el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
      numPopEl(el, "+" + fmt(fxQueue[cur]), CUR_COLOR[cur]);
    }
  }
  fxQueue = {};
}

/* toute icone porte la classe `gi` : elle a donc une taille par defaut meme
   dans un contexte qui ne la style pas. Les regles de composant la surchargent. */
function ic(name, cls){
  const g = ICONS[name] || ICONS.node;
  return `<svg viewBox="0 0 24 24" class="gi ${cls||""}" aria-hidden="true">${g}</svg>`;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* --- sprites ---------------------------------------------------------
   Base garantie : atlas PNG embarque dans le fichier (aucun reseau requis).
   Amelioration : si l'environnement autorise les requetes externes, un GIF
   anime vient se superposer. La sonde est faite une fois au demarrage.
   -------------------------------------------------------------------- */
let ANIM_OK = false;
const SPR_JSD = "https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/";
const SPR_ANI = "versions/generation-v/black-white/animated/";

function slugOf(id){ return id <= 386 ? SLUGS[id-1] : SLUG_EXTRA[id]; }
/* l'atlas contient d'abord toutes les faces, puis les dos */
function atlasIndex(id, back){
  if(back) return (id >= 1 && id <= 386) ? ATLAS_BACK0 + id - 1 : -1;
  if(id === 474) return 386;
  return (id >= 1 && id <= 386) ? id - 1 : -1;
}
function animUrl(id, shiny, back){
  return SPR_JSD + SPR_ANI + (back ? "back/" : "") + (shiny ? "shiny/" : "") + id + ".gif";
}
function installSpriteVars(){
  const r = document.documentElement.style;
  r.setProperty("--pzstrip", `url("${PZ_STRIP}")`);
  r.setProperty("--atlas", `url("${ATLAS_URL}")`);
  r.setProperty("--cardatlas", `url("${CARD_ATLAS}")`);
  r.setProperty("--glitchtile", `url("${MISSING_SPRITE}")`);
}
/* teste une seule image ; en cas de succes les grandes vues passent en anime */
function probeAnimated(){
  try{
    const img = new Image();
    img.onload = () => { ANIM_OK = true; refresh(); };
    img.onerror = () => { ANIM_OK = false; };
    img.src = animUrl(25, false);
  }catch(e){ ANIM_OK = false; }
}

function sprite(id, shiny, cls, opts){
  if(typeof opts === "string") opts = {attrs: opts};
  opts = opts || {};
  const idx = atlasIndex(id, opts.back);
  if(idx < 0){
    return `<span class="spr missing ${cls||""}" ${opts.attrs||""}></span>`;
  }
  const c = idx % ATLAS_COLS, r = Math.floor(idx / ATLAS_COLS);
  const wantAnim = opts.anim && ANIM_OK;
  const shinyCls = shiny ? (wantAnim ? "shinyglow" : "shiny") : "";
  /* quand le GIF se charge, on efface le fond d'atlas : sinon les deux
     versions du sprite restent visibles l'une derriere l'autre */
  const over = wantAnim
    ? `<img class="sprani" src="${animUrl(id, shiny, opts.back)}" alt="" decoding="async"
         onerror="this.remove()" onload="this.classList.add('on');this.parentNode.classList.add('animon')">`
    : "";
  return `<span class="spr ${cls||""} ${shinyCls}" style="--sc:${c};--sr:${r}"
    ${opts.attrs||""}>${over}</span>`;
}
function sprBox(id, shiny, size, opts){
  opts = opts || {};
  return `<span class="sprbox" style="width:${size}px;height:${size}px">
    ${sprite(id, shiny, "", opts)}${opts.shadow ? '<i class="sprshadow"></i>' : ""}</span>`;
}
function typeTags(types){
  return types.map(t=>`<span class="tt t${t}">${TYPE_NAMES[t]}</span>`).join("");
}
function rarTag(r){
  return `<span class="tt rar r${r}" style="--rc:${RARITY[r].c}">${RARITY[r].n}</span>`;
}

/* --- visage de Porygon-Z ---
   Son humeur suit l'etat du monde : inquiet tant que l'integrite est basse,
   confiant quand elle remonte. Une ligne de dialogue peut forcer une emotion. */
function pzMood(line){
  if(line && line.m && PZ_EMOS.includes(line.m)) return line.m;
  if(S && S.flags && S.flags.climax) return "Determined";
  const i = S ? S.integrity : 0;
  if(i < 12) return "Worried";
  if(i < 40) return "Normal";
  if(i < 75) return "Determined";
  if(i < 99) return "Happy";
  return "Joyous";
}
function pzFace(mood, size, cls){
  const i = Math.max(0, PZ_EMOS.indexOf(mood || "Normal"));
  return `<span class="pzface ${cls||""}" style="--pe:${i};width:${size}px;height:${size}px"></span>`;
}

/* --- son procedural (WebAudio, aucun fichier externe) --- */
const Sfx = (function(){
  let ctx = null;
  function ac(){ if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ctx; }
  function beep(freq, dur, type, vol, slide){
    if(!S || !S.settings.sfx) return;
    const c = ac(); if(!c) return;
    if(c.state === "suspended") c.resume();
    const o = c.createOscillator(), g = c.createGain();
    o.type = type||"square"; o.frequency.setValueAtTime(freq, c.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide), c.currentTime+dur);
    g.gain.setValueAtTime(vol||0.05, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+dur);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur);
  }
  return {
    click(){ beep(420, .05, "square", .035); },
    throwb(){ beep(300, .16, "triangle", .05, 720); },
    wobble(){ beep(520, .07, "square", .04); },
    caught(){ beep(660,.09,"square",.05); setTimeout(()=>beep(880,.1,"square",.05),90);
              setTimeout(()=>beep(1180,.2,"square",.05),190); },
    fail(){ beep(220, .22, "sawtooth", .05, 110); },
    shiny(){ [0,90,180,270].forEach((d,i)=>setTimeout(()=>beep(880+i*220,.12,"sine",.05),d)); },
    hit(){ beep(160,.09,"sawtooth",.05,80); },
    coin(){ beep(1050,.06,"square",.035); setTimeout(()=>beep(1400,.08,"square",.035),60); },
    glitch(){ for(let i=0;i<6;i++) setTimeout(()=>beep(80+Math.random()*900,.04,"sawtooth",.04),i*40); },
    win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16,"square",.05),i*110)); },
    lose(){ [400,330,260,180].forEach((f,i)=>setTimeout(()=>beep(f,.2,"triangle",.05),i*130)); }
  };
})();

/* --- routeur --- */
const SCREENS = {};
const ACTIONS = {};
let currentScreen = "capture";
let screenArg = null;

function go(name, arg){
  if(!SCREENS[name]) return;
  if(typeof stopAim === "function") stopAim();
  const changed = currentScreen !== name;
  currentScreen = name; screenArg = arg||null;
  render(changed);
  document.getElementById("screen").scrollTop = 0;
}
function render(anim){
  const host = document.getElementById("screen");
  const def = SCREENS[currentScreen];
  host.innerHTML = def.html(screenArg);
  if(anim){ host.classList.remove("swap"); void host.offsetWidth; host.classList.add("swap"); }
  if(def.after) def.after(host, screenArg);
  renderTopbar();
  renderDock();
  renderAdmFab();
}
function refresh(){ if(document.getElementById("screen")) render(); }

/* delegation d'evenements : tout element [data-act] declenche ACTIONS[act] */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-act]");
  if(!t) return;
  const fn = ACTIONS[t.dataset.act];
  if(fn){ Sfx.click(); fn(t.dataset, t, e); }
});

/* --- lecteur narratif --- */
let storyQueue = [], storyIdx = 0, storyTyping = null, storyDone = null, storyCur = null;

function playStory(id, onDone){
  const sc = STORY_BY_ID[id];
  if(!sc) { onDone && onDone(); return; }
  if(!S.story.includes(id)) S.story.push(id);
  storyCur = sc; storyQueue = sc.lines; storyIdx = 0; storyDone = onDone;
  const box = document.getElementById("story");
  box.className = "on";
  box.innerHTML = `
    <div class="story-bg"></div>
    <div class="art" id="story-art"></div>
    <div class="box">
      <div class="who" id="story-who"></div>
      <div class="txt" id="story-txt"></div>
      <div class="nx" id="story-nx">toucher pour continuer</div>
      <i class="prog" id="story-prog" style="width:0%"></i>
    </div>`;
  box.onclick = storyAdvance;
  showLine();
  saveSoon();
}
function showLine(){
  const l = storyQueue[storyIdx];
  if(!l){ endStory(); return; }
  const who = document.getElementById("story-who");
  const txt = document.getElementById("story-txt");
  const art = document.getElementById("story-art");
  const box = document.getElementById("story");
  /* la teinte de la scene suit celui qui parle */
  if(box) box.setAttribute("data-who", l.w || "");
  if(art){
    const pic = storyPortrait(l.w, storyCur ? storyCur.art : -1, l);
    if(pic && pic !== art.dataset.last){
      art.dataset.last = pic;
      art.innerHTML = pic;
      art.classList.remove("swapin"); void art.offsetWidth; art.classList.add("swapin");
    }
  }
  /* la faille secoue la scene */
  if(l.w === "bad" && box){
    box.classList.remove("jolt"); void box.offsetWidth; box.classList.add("jolt");
  }
  const names = {sys:"SYSTÈME", pz:"PORYGON-Z", prof:"PROF. RACINE", bad:"?????"};
  who.className = "who " + (l.w==="sys"?"sys":l.w==="bad"?"bad":"");
  who.textContent = names[l.w] || "";
  const nx0 = document.getElementById("story-nx");
  if(nx0) nx0.classList.remove("ready");
  if(l.w === "bad") Sfx.glitch();
  else if(l.w === "pz") Sfx.click();
  const pr = document.getElementById("story-prog");
  if(pr) pr.style.width = ((storyIdx+1) / storyQueue.length * 100) + "%";
  txt.innerHTML = "";
  let i = 0;
  const full = l.t;
  clearInterval(storyTyping);
  storyTyping = setInterval(()=>{
    i += 2;
    let s = full.slice(0, i);
    if(l.g && i < full.length){
      s = s.replace(/.$/, String.fromCharCode(33+Math.floor(rng()*90)));
    }
    txt.innerHTML = esc(s) + (i<full.length?'<span class="caret">▌</span>':"");
    if(i >= full.length){
      clearInterval(storyTyping);
      const nx = document.getElementById("story-nx");
      if(nx) nx.classList.add("ready");
    }
  }, 16);
}
function storyAdvance(){
  const l = storyQueue[storyIdx];
  const txt = document.getElementById("story-txt");
  if(l && txt && txt.textContent.replace("▌","").length < l.t.length){
    clearInterval(storyTyping); txt.textContent = l.t; return;
  }
  storyIdx++;
  if(storyIdx >= storyQueue.length) endStory(); else showLine();
}
function endStory(){
  clearInterval(storyTyping);
  const box = document.getElementById("story");
  box.className = ""; box.innerHTML = ""; box.onclick = null;
  const cb = storyDone; storyDone = null; storyCur = null;
  checkAchievements();
  save();
  if(cb) cb(); else refresh();
}

/* --- declencheurs narratifs --- */
function seen(id){ return S.story.includes(id); }
function checkStoryTriggers(){
  if(document.getElementById("story").className === "on") return false;
  const K = dexCount("kanto"), J = dexCount("johto"), H = dexCount("hoenn");
  const beat = (id, cond) => (!seen(id) && cond);

  if(beat("first_catch", S.stats.catches >= 1)) return playStory("first_catch"), true;
  if(beat("beat_early", S.integrity >= 3)) return playStory("beat_early"), true;
  if(beat("pz_box", S.stats.boxOpens >= 1)) return playStory("pz_box"), true;
  if(beat("pz_shiny", S.stats.shinies >= 1)) return playStory("pz_shiny"), true;
  if(beat("pz_first_guardian_fail", S.flags.guardFail)) return playStory("pz_first_guardian_fail"), true;
  if(beat("pz_egg", (S.stats.hatched||0) >= 1)) return playStory("pz_egg"), true;
  if(beat("pz_treasure", (S.stats.treasures||0) >= 1)) return playStory("pz_treasure"), true;
  if(beat("pz_buddy", buddyTier() >= 2)) return playStory("pz_buddy"), true;
  if(beat("pz_region_full", REGIONS.some(r=>dexRegionPct(r.key) >= 99.9))) return playStory("pz_region_full"), true;
  if(beat("pz_cycle", cycleN() >= 1)) return playStory("pz_cycle"), true;
  if(beat("kanto_half", K >= 45)) return playStory("kanto_half"), true;
  if(beat("guardian_first", moduleUnlocked("boss"))) return playStory("guardian_first"), true;
  if(beat("boss_first_done", S.bosses.length >= 1)) return playStory("boss_first_done"), true;
  if(beat("missingno_1", S.flags.sawMissing)) return playStory("missingno_1"), true;
  if(beat("kanto_done", S.bosses.includes("kanto:150"))) return playStory("kanto_done"), true;
  if(beat("johto_mid", J >= 45)) return playStory("johto_mid"), true;
  if(beat("johto_done", S.bosses.includes("johto:249"))) return playStory("johto_done"), true;
  if(beat("hoenn_mid", H >= 60)) return playStory("hoenn_mid"), true;
  if(beat("hoenn_done", S.bosses.includes("hoenn:384"))) return playStory("hoenn_done"), true;
  if(beat("climax", S.integrity >= 100 && S.bosses.length >= 9)){
    S.flags.climax = true;
    playStory("climax", ()=>{ playStory("epilogue", ()=>{ S.flags.zero = true; refresh(); }); });
    return true;
  }
  return false;
}

/* ============================================================
   30 — CAPTURE (module central)
   ============================================================ */

let ENC = null;          /* rencontre courante */
let busy = false;

/* condition d'ouverture, formulee pour le joueur */
function regionGate(key){
  const r = regionDef(key);
  if(r.act === 1) return null;
  const prev = REGIONS[r.act-2];
  const core = prev.guardians[2];
  return {prev, core, done: S.bosses.includes(prev.key + ":" + core.id),
          need: core.need, have: dexCount(prev.key)};
}
function regionUnlocked(key){
  const r = regionDef(key);
  if(r.act === 1) return true;
  const prev = REGIONS[r.act-2];
  return S.bosses.includes(prev.key + ":" + prev.guardians[2].id);
}
function unlockedRegions(){ return REGIONS.filter(r=>regionUnlocked(r.key)); }

/* Pokemon vedette du jour : deterministe a partir de la date.
   La rarete est ponderee : une vedette tres rare apparaissant 8% du temps
   deformerait completement l'economie du secteur. */
const FEATURED_TIER_W = [45, 30, 20, 5];       /* commun -> tres rare */
function featuredId(){
  const d = today();
  let h = 0;
  for(let i=0;i<d.length;i++) h = (h*31 + d.charCodeAt(i)) >>> 0;
  const pools = [[],[],[],[]];
  for(const r of unlockedRegions())
    for(let i=r.from;i<=r.to;i++){
      const p = POKE[i];
      if(p && p.leg === 0 && p.rar <= 3) pools[p.rar].push(i);
    }
  const tot = FEATURED_TIER_W.reduce((a,b,i)=>a + (pools[i].length ? b : 0), 0);
  let x = h % Math.max(1, tot), tier = 0;
  for(let i=0;i<4;i++){
    if(!pools[i].length) continue;
    if(x < FEATURED_TIER_W[i]){ tier = i; break; }
    x -= FEATURED_TIER_W[i];
    tier = i;
  }
  const pool = pools[tier].length ? pools[tier] : pools.flat();
  return pool[(h >>> 5) % pool.length];
}

/* --- generation de rencontre --- */
function rollRarity(){
  const regionPct = dexRegionPct(S.region);
  const legAllowed = regionPct >= 60;
  const boostRare = eventActive("ev_rare") || boostActive("rare") || luckyF("rare") > 0;
  const rareMul = 4.5 * (boostActive("rare") ? 1.6 : 1) * (1 + luckyF("rare"));
  let pool = RARITY.map((r,i)=>{
    let w = r.w;
    if(i === 5 && !legAllowed) w = 0;
    if(boostRare && i >= 2) w *= rareMul;
    /* l'integrite basse favorise les entites corrompues */
    if(i === 4) w *= (1 + (100-S.integrity)/140);
    if(cycleMod("m_rare") && i <= 1) w *= 0.45;
    return w;
  });
  const tot = pool.reduce((a,b)=>a+b,0);
  let x = rng()*tot;
  for(let i=0;i<pool.length;i++){ x -= pool[i]; if(x <= 0) return i; }
  return 0;
}
function speciesForRarity(rar){
  const r = regionDef(S.region);
  const out = [];
  for(let i=r.from; i<=r.to; i++){
    const p = POKE[i]; if(!p) continue;
    if(p.rar !== rar) continue;
    if(isGuardianSpecies(i) && !isReleasedGuardian(i)) continue;   /* verrou encore actif */
    if(p.leg === 1 && !isReleasedGuardian(i)) { if(rar === 5 && dexRegionPct(S.region) < 60) continue; }
    out.push(i);
  }
  if(!out.length){
    for(let i=r.from;i<=r.to;i++) if(POKE[i] && POKE[i].leg===0) out.push(i);
  }
  return pick(out);
}
function isReleasedGuardian(id){ return S.bosses.some(b=>b.endsWith(":"+id)); }
const GUARDIAN_IDS = REGIONS.flatMap(r=>r.guardians.map(g=>g.id));
function isGuardianSpecies(id){ return GUARDIAN_IDS.includes(id); }

function shinyOdds(){
  let base = 1/1000;
  base *= 1 + Math.min(7, S.streak * 0.035);   /* levier principal : la chaine */
  if(S.shinyCharge > 0) base *= 3;
  if(eventActive("ev_shiny")) base *= 2.5;
  if(S.flags.zero) base *= 2.5;                /* Couche Zero */
  if(heldActive("shiny")) base *= 1.4;
  if(boostActive("shiny")) base *= 2;
  if(luckyF("shiny")) base *= luckyF("shiny");
  base *= perkMul("p_shiny", 0.20);
  return Math.min(base, 0.025);
}
function shinyOddsText(){ return "1 sur " + fmt(Math.round(1/shinyOdds())); }

function levelFor(rar){
  const base = 3 + S.level*1.35 + rar*5;
  return clamp(Math.round(base + randInt(-3, 4)), 2, 92);
}

function newEncounter(force){
  const featured = featuredId();
  let rar, id;
  if(!force && rng() < 0.08){ id = featured; rar = POKE[id].rar; }
  else { rar = force?.rar ?? rollRarity(); id = force?.id ?? speciesForRarity(rar); rar = POKE[id].rar; }

  /* apparition rare de la faille */
  const missChance = S.stats.catches > 60 && !S.flags.sawMissing ? 0.018 : 0.0016;
  if(!force && S.stats.catches > 40 && rng() < missChance){
    ENC = {id:0, level:0, shiny:false, rar:5, missing:true, attempts:0};
    S.shinyCharge = Math.max(0, S.shinyCharge-1);
    return ENC;
  }

  /* charme de collection : une rencontre sur cinq vise une espece manquante */
  if(!force && boostActive("new") && rng() < 0.2){
    const miss = [];
    const rg = regionDef(S.region);
    for(let i=rg.from;i<=rg.to;i++) if(POKE[i] && !S.dex[i] && POKE[i].leg===0) miss.push(i);
    if(miss.length){ id = pick(miss); rar = POKE[id].rar; }
  }
  const shiny = rng() < shinyOdds();
  ENC = {id, level: levelFor(rar), shiny, rar, attempts:0, featured: id===featured, fleeing:false};
  if(S.shinyCharge > 0) S.shinyCharge--;
  if(shiny){ Sfx.shiny(); buzz([18,40,18,40,30]); pzFlash(pzLine("shiny")); }
  else if(rar >= 3){ pzFlash(pzLine("rare")); }
  saveSoon();
  return ENC;
}

/* --- formule de capture ---
   La courbe en puissance compresse le bas de l'echelle : un commun se capture
   presque toujours, et la difficulte se concentre sur les hautes raretes.
   C'est ce qui rend la serie tenable, donc la chasse au chromatique atteignable. */
function catchChance(ballKey){
  if(!ENC || ENC.missing) return 0;
  const ball = BALLS[ballKey];
  if(ball.mult >= 255) return 1;
  const p = POKE[ENC.id];
  let c = Math.pow(p.catch / 255, 0.55) * ball.mult;
  if(S.buffs.framby) c *= 1.5;
  c *= 1 + Math.min(0.35, S.streak * 0.002);          /* appoint de serie */
  c *= clamp(1.15 - ENC.level / 220, 0.62, 1.15);     /* niveau de la cible */
  c *= 1 + ENC.attempts * 0.12;                       /* chaque essai fatigue l'entite */
  c *= [1, .95, .88, .80, .70, .52][ENC.rar];
  if(ENC.shiny) c *= 0.88;
  c *= buddyBonus().catch;
  if(heldActive("catch")) c *= 1.12;
  c *= perkMul("p_catch", 0.04);
  return clamp(c, 0.03, 0.98);
}
/* probabilite que l'entite se desindexe apres un lancer rate */
function fleeChance(){
  return clamp(0.04 + ENC.attempts * 0.06 + ENC.rar * 0.028, 0, 0.60);
}

/* --- visée : mini-jeu d'adresse ---
   Principe repris de la v1 : uniquement du bonus, jamais de malus.
   Rater la zone rend exactement la chance nominale, viser juste la majore
   jusqu'a x1.25. Le geste devient actif sans punir le joueur pressé. */
let AIM = null;
function skillEnabled(){ return S && S.settings && S.settings.skill !== false; }
function aimNeeded(){
  if(!skillEnabled() || !ENC || ENC.missing || busy) return false;
  if(selBall() === "master") return false;
  return catchChance(selBall()) < 0.95;      /* inutile quand la prise est acquise */
}
function startAim(){
  if(AIM) return;
  const w = 30 - Math.min(16, ENC.rar * 4);              /* zone plus etroite si rare */
  const lo = 18 + rng() * (78 - w);
  AIM = {pos: 0, dir: 1, speed: 1.15 + ENC.rar * 0.32, zone: [lo, lo + w], timer: null, best: 1};
  refresh();
  AIM.timer = setInterval(()=>{
    if(!AIM) return;
    AIM.pos += AIM.dir * AIM.speed;
    if(AIM.pos >= 100){ AIM.pos = 100; AIM.dir = -1; }
    if(AIM.pos <= 0){ AIM.pos = 0; AIM.dir = 1; }
    const c = document.getElementById("aim-cursor");
    if(!c){ stopAim(); return; }
    c.style.left = AIM.pos + "%";
    const inZone = AIM.pos >= AIM.zone[0] && AIM.pos <= AIM.zone[1];
    c.classList.toggle("hot", inZone);
  }, 16);
}
function stopAim(){ if(AIM){ clearInterval(AIM.timer); AIM = null; } }
function aimBonus(pos, zone){
  if(pos < zone[0] || pos > zone[1]) return 1;
  const center = (zone[0] + zone[1]) / 2, half = (zone[1] - zone[0]) / 2;
  return 1 + (1 - Math.abs(pos - center) / half) * 0.25;
}
function lockAim(){
  if(!AIM) return;
  const bonus = aimBonus(AIM.pos, AIM.zone);
  const perfect = bonus >= 1.22;
  stopAim();
  if(bonus > 1){
    S.stats.skill = (S.stats.skill||0) + 1;
    if(perfect){
      S.stats.perfect = (S.stats.perfect||0) + 1;
      Sfx.shiny(); buzz([15,30,15]);
      toast("Verrouillage parfait — ×" + bonus.toFixed(2), "warn", "star");
    } else {
      Sfx.wobble(); buzz(12);
      toast("Verrouillage ×" + bonus.toFixed(2), "", "check");
    }
  }
  refresh();
  throwBall(selBall(), bonus);
}

/* --- lancer --- */
function throwBall(ballKey, skill){
  if(busy || !ENC) return;
  if((S.balls[ballKey]||0) <= 0){ toast("Plus de " + BALLS[ballKey].name, "bad", "cross"); return; }
  busy = true;
  S.balls[ballKey]--;
  S.stats.throws++; S.daily.dayThrow++; questTick("dayThrow",1);

  if(ENC.missing){ resolveMissing(ballKey); return; }

  const chance = Math.min(0.99, catchChance(ballKey) * (skill || 1));
  const success = rng() < chance;
  const wobbles = success ? 3 : (chance > 0.6 ? 3 : chance > 0.3 ? 2 : randInt(0,2));
  animateThrow(ballKey, wobbles, success, ()=>{
    if(success) onCatch(ballKey);
    else onFail(ballKey);
  });
  saveSoon();
}

function animateThrow(ballKey, wobbles, success, done){
  const stage = document.getElementById("enc-stage");
  if(!stage){ done(); return; }
  const sp = document.getElementById("enc-sprite");
  const b = document.createElement("div");
  b.className = "ball-fly";
  b.innerHTML = `<svg viewBox="0 0 24 24" style="width:100%;height:100%">${ICONS[BALLS[ballKey].icon]}</svg>`;
  b.style.animation = "throwarc .42s forwards cubic-bezier(.2,.6,.4,1)";
  stage.appendChild(b);
  Sfx.throwb(); buzz(10);

  setTimeout(()=>{
    if(sp){
      sp.style.transition = "opacity .18s, transform .18s";
      sp.style.opacity = 0;
      sp.style.transform = "scale(.3) translateY(-46px)";
    }
    const ring = document.createElement("div");
    ring.className = "catch-ring";
    stage.appendChild(ring);
    setTimeout(()=>ring.remove(), 620);

    b.style.animation = "none";
    b.style.transform = "translate(-50%,-160px)";
    let i = 0;
    const tick = () => {
      if(i >= wobbles){
        if(success){
          b.style.transition = "filter .2s, transform .2s";
          b.style.filter = "brightness(1.8) drop-shadow(0 0 14px var(--cyan))";
          Sfx.caught(); buzz([24,40,60]);
          burstEl(b, {n:22, spread:90, colors:["#35f0d6","#ffffff","#ffc857"], dur:800});
          setTimeout(()=>{ b.remove(); done(); }, 460);
        } else {
          if(sp){ sp.style.opacity = 1; sp.style.transform = "none"; }
          b.style.transition = "opacity .2s";
          b.style.opacity = 0;
          Sfx.fail(); buzz(30);
          burstEl(b, {n:8, spread:45, colors:["#ff3d7f","#5e7391"], dur:500});
          setTimeout(()=>{ b.remove(); done(); }, 280);
        }
        return;
      }
      b.style.animation = "wobble .42s";
      Sfx.wobble(); buzz(8);
      i++;
      setTimeout(()=>{ b.style.animation = "none"; b.style.transform = "translate(-50%,-160px)";
        setTimeout(tick, 110); }, 430);
    };
    setTimeout(tick, 270);
  }, 420);
}

function onCatch(ballKey){
  const caughtRar = ENC.rar;
  const p = POKE[ENC.id];
  const rarDef = RARITY[ENC.rar];
  const isNew = addToDex(ENC.id, ENC.level, ENC.shiny);
  contractTick(ENC.id, isNew);

  /* recompenses */
  let coins = randInt(rarDef.coin[0], rarDef.coin[1]);
  coins = Math.round(coins * (1 + Math.min(0.6, S.streak*0.004))    /* appoint, pas jackpot */
                            * (1 + S.level*0.014) * buddyBonus().coin
                            * (heldActive("coin") ? 1.2 : 1)
                            * (boostActive("coin") ? 1.8 : 1) * (luckyF("coin") || 1)
                            * perkMul("p_coin", 0.15) * (cycleMod("m_econ") ? 0.5 : 1));
  if(S.buffs.sitrus) coins *= 2;
  if(eventActive("ev_coin")) coins *= 2;
  if(ENC.featured) coins = Math.round(coins*1.5);
  coins = Math.round(coins);

  let xp = rarDef.xp * (isNew?2.2:1);
  if(S.buffs.nigma) xp *= 2;
  xp = Math.round(xp * (1 + ENC.level*0.02) * buddyBonus().xp);

  let integ = rarDef.integ * (isNew ? 0.85 : 0.04);
  if(BALLS[ballKey].integBonus) integ *= BALLS[ballKey].integBonus;
  if(ENC.shiny) integ *= 2;

  gain("coins", coins);
  addXp(xp);
  addIntegrity(integ);
  if(eventActive("ev_shard") || luckyF("shard")) gain("shards", (luckyF("shardMul")||1));
  if(ENC.rar >= 4) gain("shards", randInt(2,5));
  if(ENC.shiny) gain("shards", 8);

  S.streak++; S.failStreak = 0;
  if(S.streak > S.stats.bestStreak) S.stats.bestStreak = S.streak;
  S.stats.catches++;
  if(ENC.shiny) S.stats.shinies++;
  S.daily.dayCatch++; questTick("dayCatch",1);
  questSet("dayStreak", S.streak);
  if(ENC.rar >= 2){ S.daily.dayRare++; questTick("dayRare",1); }
  if(ballKey === "master" && ENC.rar <= 1) S.flags.masterWaste = true;
  /* exploits d'adresse et de chance */
  if(ENC.rar === 5 && ENC.attempts === 0 && ballKey !== "master") S.flags.legendFirst = true;
  if(ENC.shiny){ S.chainShiny = (S.chainShiny||0) + 1;
    if(S.chainShiny >= 3) S.flags.shiny3 = true; }

  clearBuffs();
  eggTick();
  buddyTick(caughtRar);
  streakMilestone();

  const st = document.getElementById("enc-stage");
  if(st) burstEl(st, {n: c_isBig(ENC) ? 30 : 16, spread: c_isBig(ENC) ? 130 : 80,
    colors: ENC.shiny ? ["#ffc857","#ffffff"] : [RARITY[ENC.rar].c, "#ffffff", "#35f0d6"], dur:900});
  const caught = Object.assign({}, ENC);
  ENC = null; busy = false;
  checkAchievements();
  guideTick();
  save();

  if(isNew) showDiscovery(caught, {coins, xp, integ, isNew});
  else showCatchResult(caught, {coins, xp, integ, isNew});
}

function onFail(ballKey){
  const safe = !!S.buffs.nanab;
  ENC.attempts++;
  S.failStreak++;
  if(S.failStreak >= 10 && !S.flags.fail10){ S.flags.fail10 = true; playStory("pz_fail"); }
  clearBuffs();
  pzFlash(pzLine("fail"));

  busy = false;
  if(cycleMod("m_chain") && !safe && S.streak > 0) breakStreak();
  /* un lancer rate ne coute que la ball : seule une fuite rompt la chaine */
  if(rng() < fleeChance()){
    const name = POKE[ENC.id].name;
    if(safe){
      toast("Baie Nanab : série préservée", "warn", "check");
    } else if(S.streak > 0){
      breakStreak();
    }
    toast(`${name} s'est désindexé.`, "bad", "cross");
    pzFlash(pzLine("flee"));
    const sp = document.getElementById("enc-sprite");
    if(sp) sp.classList.add("flee");
    ENC = null;
    setTimeout(()=>{ newEncounter(); refresh(); }, 420);
  } else refresh();
  checkAchievements();
  guideTick();
  saveSoon();
}

/* rupture de chaine : c'est le seul evenement punitif du module, il doit se voir */
function breakStreak(){
  const lost = S.streak;
  S.streak = 0;
  S.chainShiny = 0;
  S.lastBreak = {n: lost, t: Date.now()};
  Sfx.lose(); buzz([60, 40, 90]);
  shakeApp();
  const box = document.querySelector(".streakbox");
  if(box){ box.classList.remove("broken"); void box.offsetWidth; box.classList.add("broken"); }
  toast(`Chaîne rompue à ${lost}`, "bad", "cross");
}

function resolveMissing(ballKey){
  const stage = document.getElementById("enc-stage");
  if(stage) stage.classList.add("shake");
  Sfx.glitch(); buzz([40,30,40,30,80]);
  S.flags.sawMissing = true;
  setTimeout(()=>{
    ENC = null; busy = false;
    gain("shards", 25); gain("cores", 1);
    toast("Fragments arrachés à la faille : +25", "warn", "shard");
    /* la piece sans index ne se gagne pas : elle s'inscrit d'elle-meme */
    if(grantSecretCard()){
      save();
      setTimeout(()=>showCardWin("mn", 0, true), 700);
      return;
    }
    save();
    if(!checkStoryTriggers()){ newEncounter(); refresh(); }
  }, 900);
}

/* --- révélation d'une espèce inédite ---
   Le cœur emotionnel d'un jeu de collection merite mieux qu'une notification. */
let DISCOVER = null;
function showDiscovery(c, rw){
  const box = document.getElementById("discover");
  if(!box){ showCatchResult(c, rw); return; }
  const p = POKE[c.id];
  const accent = c.shiny ? "var(--amber)" : RARITY[c.rar].c;
  box.className = "on";
  box.style.setProperty("--ac", accent);
  box.innerHTML = `
    <div class="dc-rays"></div>
    <div class="dc-inner">
      <div class="dc-kicker" id="dc-kicker">SIGNATURE NON RÉPERTORIÉE</div>
      <div class="dc-art" id="dc-art">
        <span class="sprbox" style="width:152px;height:152px">
          ${sprite(c.id, c.shiny, "ghosted", {anim:true, eager:true})}</span>
      </div>
      <div class="dc-num" id="dc-num"></div>
      <div class="dc-name" id="dc-name"></div>
      <div class="wrap dc-tags" id="dc-tags" style="justify-content:center"></div>
      <div class="dc-lore" id="dc-lore"></div>
      <div class="tiles dc-rw" id="dc-rw"></div>
      <button class="btn pri wide dc-ok" id="dc-ok" data-act="dcdone">Archiver</button>
    </div>`;
  box.onclick = e => { if(DISCOVER && DISCOVER.step < 4) dcJump(); };

  DISCOVER = {c, rw, step:0, timers:[]};
  const at = (ms, fn) => DISCOVER.timers.push(setTimeout(fn, ms));

  at(520, ()=>{
    DISCOVER.step = 1;
    const art = document.getElementById("dc-art");
    const spr = art && art.querySelector(".spr");
    if(spr) spr.classList.remove("ghosted");
    if(art){ art.classList.add("revealed"); burstEl(art, {n:30, spread:150,
      colors:[accent, "#ffffff", "#35f0d6"], dur:1000}); }
    box.classList.add("flash");
    setTimeout(()=>box.classList.remove("flash"), 260);
    Sfx.shiny(); buzz([25,40,70]);
    const k = document.getElementById("dc-kicker");
    if(k){ k.textContent = "NOUVELLE ENTRÉE D'ARCHIVE"; k.classList.add("done"); }
  });
  at(1000, ()=>{
    DISCOVER.step = 2;
    const el = document.getElementById("dc-num");
    if(!el) return;
    const full = "N°" + String(c.id).padStart(3, "0");
    let i = 0;
    const t = setInterval(()=>{
      i++;
      el.textContent = full.slice(0, i);
      Sfx.click();
      if(i >= full.length) clearInterval(t);
    }, 70);
    DISCOVER.timers.push(t);
  });
  at(1420, ()=>{
    DISCOVER.step = 3;
    const n = document.getElementById("dc-name");
    if(n){ n.textContent = p.name + (c.shiny ? " ◆" : ""); n.classList.add("in"); }
    const tg = document.getElementById("dc-tags");
    if(tg){ tg.innerHTML = typeTags(p.types) + rarTag(c.rar) +
      `<span class="tt t1">Niv.${c.level}</span>`; tg.classList.add("in"); }
  });
  at(1780, ()=>{ dcJump(); });
}
function dcJump(){
  if(!DISCOVER || DISCOVER.step >= 4) return;
  DISCOVER.timers.forEach(t=>{ clearTimeout(t); clearInterval(t); });
  DISCOVER.step = 4;
  const {c, rw} = DISCOVER;
  const p = POKE[c.id];
  const set = (id, html, cls) => { const el = document.getElementById(id);
    if(el){ el.innerHTML = html; if(cls) el.classList.add(cls); } };
  const art = document.getElementById("dc-art");
  const spr = art && art.querySelector(".spr");
  if(spr) spr.classList.remove("ghosted");
  if(art) art.classList.add("revealed");
  set("dc-kicker", "NOUVELLE ENTRÉE D'ARCHIVE", "done");
  set("dc-num", "N°" + String(c.id).padStart(3, "0"));
  set("dc-name", esc(p.name) + (c.shiny ? ' <span class="gold-t">◆</span>' : ""), "in");
  set("dc-tags", typeTags(p.types) + rarTag(c.rar) + `<span class="tt t1">Niv.${c.level}</span>`, "in");
  set("dc-lore", esc(loreOf(c.id)), "in");
  set("dc-rw", `
    <div class="tile gold"><div class="k">PokéCoins</div><div class="v">+${fmt(rw.coins)}</div></div>
    <div class="tile accent"><div class="k">Expérience</div><div class="v">+${fmt(rw.xp)}</div></div>
    <div class="tile"><div class="k">Intégrité</div><div class="v ok">+${rw.integ.toFixed(2)}%</div></div>
    <div class="tile"><div class="k">Chaîne</div><div class="v">${S.streak}</div></div>`, "in");
  const ok = document.getElementById("dc-ok");
  if(ok) ok.classList.add("in");
}

/* ---------- tirage : le rouleau défile puis ralentit ---------- */
let BOXROLL = null;
ACTIONS.openbox = () => {
  if(!canOpenBox() || BOXROLL) return;
  const miss = missingSpecies();
  let id;
  if(miss.length) id = pick(miss);
  else { const r = regionDef(S.region); id = randInt(r.from, r.to); }

  S.pokebox.last = today();
  S.stats.boxOpens++;
  const shiny = rng() < shinyOdds()*3;
  const lvl = levelFor(POKE[id].rar);
  save();

  const reel = document.getElementById("mc-reel");
  const machine = document.querySelector(".machine");
  if(!reel){ finishBox(id, shiny, lvl); return; }
  if(machine) machine.classList.add("rolling");

  /* le rouleau pioche dans le vivier, puis decelere jusqu'au resultat */
  const strip = shuffle(miss.length ? miss : [id]).slice(0, 26);
  BOXROLL = {i:0, delay:45, id, shiny, lvl};
  const step = () => {
    if(!BOXROLL) return;
    const cur = strip[BOXROLL.i % strip.length];
    reel.innerHTML = `<span class="sprbox" style="width:96px;height:96px">${sprite(cur,false,"")}</span>`;
    reel.classList.remove("tick"); void reel.offsetWidth; reel.classList.add("tick");
    Sfx.click();
    BOXROLL.i++;
    BOXROLL.delay *= BOXROLL.i > 18 ? 1.26 : 1.04;      /* deceleration progressive */
    if(BOXROLL.delay > 320){
      reel.innerHTML = `<span class="sprbox" style="width:96px;height:96px">
        ${sprite(BOXROLL.id, BOXROLL.shiny, "", {anim:true, eager:true})}</span>`;
      reel.classList.add("landed");
      if(machine){ machine.classList.remove("rolling"); machine.classList.add("hit"); }
      burstEl(reel, {n:26, spread:130, colors:[shiny?"#ffc857":"#35f0d6","#ffffff"], dur:900});
      Sfx.caught(); buzz([20,40,70]);
      const {id:fid, shiny:fs, lvl:fl} = BOXROLL;
      BOXROLL = null;
      setTimeout(()=>finishBox(fid, fs, fl), 680);
      return;
    }
    BOXROLL.t = setTimeout(step, BOXROLL.delay);
  };
  step();
};
function finishBox(id, shiny, lvl){
  const isNew = addToDex(id, lvl, shiny);
  addIntegrity(RARITY[POKE[id].rar].integ * (isNew?0.85:0.04));
  gain("coins", 150 + S.level*25);
  addXp(40 + S.level*4);
  if(shiny) S.stats.shinies++;
  save(); checkAchievements(); guideTick();
  if(isNew) showDiscovery({id, shiny, rar:POKE[id].rar, level:lvl},
                          {coins:150 + S.level*25, xp:40 + S.level*4,
                           integ:RARITY[POKE[id].rar].integ*0.85, isNew:true});
  else showCatchResult({id, shiny, rar:POKE[id].rar, level:lvl},
                       {coins:150 + S.level*25, xp:40 + S.level*4, integ:0, isNew:false});
}

let FISH = {state:"idle", t:0, pos:0, dir:1, timer:null, zone:[40,62], depth:1};

const FISH_DEPTHS = [
  {n:"Couche de surface", cost:0,  types:[11], rarBoost:0,  d:"Eau uniquement."},
  {n:"Couche intermédiaire", cost:6, types:[11,15,4], rarBoost:1, d:"Eau, Glace, Poison. Raretés plus hautes."},
  {n:"Couche profonde", cost:18, types:[11,15,16,8], rarBoost:2, d:"Eau, Glace, Dragon, Spectre. Fort taux de rare."}
];
function fishPool(depth){
  const d = FISH_DEPTHS[depth];
  const r = regionDef(S.region);
  const out = [];
  for(let i=r.from;i<=r.to;i++){
    const p = POKE[i]; if(!p || p.leg) continue;
    if(p.types.some(t=>d.types.includes(t))) out.push(i);
  }
  return out.length ? out : [POKE[r.from].id];
}

ACTIONS.setdepth = d => { if(FISH.state!=="idle") return; FISH.depth = +d.i; refresh(); };
ACTIONS.fishleave = () => { stopFish(); go("modules"); };

function stopFish(){ clearInterval(FISH.timer); clearTimeout(FISH.timer); FISH.timer=null; FISH.state="idle"; }

ACTIONS.cast = () => {
  const d = FISH_DEPTHS[FISH.depth];
  const free = boostActive("lure");
  if(d.cost && !free && !pay("shards", d.cost)){ toast("Fragments insuffisants", "bad", "cross"); return; }
  FISH.state = "wait"; refresh();
  const delay = 700 + rng()*2400;
  FISH.timer = setTimeout(()=>{
    FISH.state = "bite"; Sfx.wobble(); buzz(25); refresh();
    FISH.timer = setTimeout(()=>{
      if(FISH.state === "bite"){ FISH.state="idle"; toast("La prise s'est échappée.", "bad", "cross"); refresh(); }
    }, 1400);
  }, delay);
};
ACTIONS.hook = () => {
  clearTimeout(FISH.timer);
  const w = 26 - FISH.depth*6;
  const start = 12 + rng()*(72 - w);
  FISH.zone = [start, start+w];
  FISH.pos = 0; FISH.dir = 1;
  FISH.state = "reel"; refresh();
};
function startReelLoop(){
  clearInterval(FISH.timer);
  const speed = 1.5 + FISH.depth*0.8;
  FISH.timer = setInterval(()=>{
    FISH.pos += FISH.dir*speed;
    if(FISH.pos >= 99){ FISH.pos = 99; FISH.dir = -1; }
    if(FISH.pos <= 0){ FISH.pos = 0; FISH.dir = 1; }
    const c = document.getElementById("fish-cursor");
    if(!c){ clearInterval(FISH.timer); return; }
    c.style.left = FISH.pos + "%";
  }, 16);
}
ACTIONS.reel = () => {
  clearInterval(FISH.timer);
  const ok = FISH.pos >= FISH.zone[0] && FISH.pos <= FISH.zone[1];
  FISH.state = "idle";
  if(!ok){ Sfx.fail(); toast("Flux perdu. La prise se désindexe.", "bad", "cross"); refresh(); return; }
  Sfx.coin(); buzz(20);
  S.stats.fish++; S.daily.dayFish++; questTick("dayFish",1);
  gain("shards", Math.round((2 + FISH.depth*3) * consumeFirstWin("fishing")));
  const treasure = rollTreasure(FISH.depth);
  if(treasure) toast("Trésor remonté : " + TREASURES[treasure].n, "warn", "star");
  const pool = fishPool(FISH.depth);
  let id = pick(pool);
  /* la profondeur pousse vers des especes plus rares */
  const tries = FISH_DEPTHS[FISH.depth].rarBoost + (boostActive("lure") ? 2 : 0);
  for(let i=0;i<tries;i++){
    const alt = pick(pool);
    if(POKE[alt].rar > POKE[id].rar) id = alt;
  }
  save();
  toast("Prise stabilisée — capture disponible", "warn", "fish");
  newEncounter({id, rar: POKE[id].rar});
  go("capture");
};

/* ============================================================
   IDLE — Energie Onirique
   ============================================================ */
const GENS = [
  {k:"g1", n:"Boucle de veille",    base:0.35, cost:180,   grow:1.16, d:"Un thread qui rêve en arrière-plan."},
  {k:"g2", n:"Cache onirique",      base:2.2,  cost:2200,  grow:1.18, d:"Stocke les rêves non lus des entités archivées."},
  {k:"g3", n:"Condensateur profond",base:14,   cost:26000, grow:1.20, d:"Comprime l'inactivité en énergie exploitable."},
  {k:"g4", n:"Réacteur du Vide",    base:95,   cost:310000,grow:1.23, d:"Puise directement dans l'espace non alloué."}
];
function genCost(g){ const lv = S.idle.gens[g.k]||0; return Math.round(g.cost * Math.pow(g.grow, lv)); }
function energyRate(){ /* par seconde */
  let r = 0;
  for(const g of GENS) r += (S.idle.gens[g.k]||0) * g.base;
  r *= 1 + S.integrity/150;
  r *= S.idle.mult || 1;
  return r;
}
function idleTick(){
  const now = Date.now();
  const dt = Math.min(60, (now - S.idle.last)/1000);
  if(dt > 0.4){
    const g = energyRate()*dt;
    if(g > 0){ gain("energy", g); S.daily.dayEnergy += g; questTick("dayEnergy", g); }
    S.idle.last = now;
  }
}
function offlineReport(){
  const now = Date.now();
  const away = now - (S.lastSeen || now);
  if(away < 120000) return null;
  const capped = Math.min(away, 12*3600*1000);
  const e = energyRate() * capped/1000;
  const c = Math.round(Math.min(away,8*3600*1000)/1000 * (0.5 + S.level*0.12));
  return {away, energy:e, coins:c};
}

/* ===== 40-battle.js ===== */
/* ============================================================
   40 — MOTEUR DE COMBAT (partage : Data Guardians + Expedition)
   ============================================================ */

let BATTLE = null;

function createBattle(allies, foes, opts){
  opts = opts || {};
  BATTLE = {
    allies, foes, ai: !!opts.ai, speed: opts.speed || 1,
    a: 0, f: 0, log: [], over: false, result: null,
    onEnd: opts.onEnd || null, title: opts.title || "COMBAT",
    phase: 1, boss: opts.boss || null, busy: false, turn: 0
  };
  blog(opts.intro || `${foes[0].name} entre dans l'arène.`);
  return BATTLE;
}
function blog(t){
  if(!BATTLE) return;
  BATTLE.log.push(t);
  const el = document.getElementById("log");
  if(el){
    const d = document.createElement("div");
    d.innerHTML = t;
    el.appendChild(d);
    el.scrollTop = el.scrollHeight;
  }
}
function activeAlly(){ return BATTLE.allies[BATTLE.a]; }
function activeFoe(){ return BATTLE.foes[BATTLE.f]; }
function aliveIdx(arr){ return arr.findIndex(x=>x.hp > 0); }

function bestMove(att, def){
  /* une manœuvre au premier tour si elle apporte quelque chose, sinon la frappe la plus rentable */
  const util = att.moves.find(m=>m.util);
  if(util && !att._used){
    const useful = (util.st && !def.status && typeMult(util.type, def.types) > 0)
                || (util.buff && att.buff.atk < 1.3)
                || (util.heal && att.hp < att.maxHp*0.55);
    if(useful && rng() < 0.55){ att._used = true; return util; }
  }
  let best = null, score = -1;
  for(const m of att.moves){
    if(m.util) continue;
    const e = typeMult(m.type, def.types);
    const stab = att.types.includes(m.type) ? 1.5 : 1;
    const s = m.pw * e * stab * m.acc;
    if(s > score){ score = s; best = m; }
  }
  return best || att.moves[0];
}

/* ---------- altérations d'état ---------- */
function setStatus(f, k){
  if(f.status || f.hp <= 0) return false;
  f.status = {k, turns: k === "slp" ? randInt(1,3) : 0, stack: 0};
  return true;
}
function canAct(f){
  if(!f.status) return {ok:true};
  const st = f.status;
  if(st.k === "slp"){
    if(st.turns > 0){ st.turns--; return {ok:false, msg:`${esc(f.name)} est inactif.`}; }
    f.status = null;
    return {ok:true, msg:`<span class="ok">${esc(f.name)} se réactive.</span>`};
  }
  if(st.k === "par" && rng() < 0.25)
    return {ok:false, msg:`${esc(f.name)} est figé par la paralysie.`};
  return {ok:true};
}
function endOfTurnStatus(f, side){
  if(!f.status || f.hp <= 0) return;
  const st = f.status;
  let dmg = 0;
  if(st.k === "brn") dmg = Math.max(1, Math.floor(f.maxHp/16));
  if(st.k === "psn"){ st.stack = Math.min(6, (st.stack||0)+1); dmg = Math.max(1, Math.floor(f.maxHp*st.stack/24)); }
  if(!dmg) return;
  f.hp = Math.max(0, f.hp - dmg);
  blog(`<span style="color:${STATUS[st.k].c}">${esc(f.name)} subit ${dmg} — ${STATUS[st.k].n}.</span>`);
  popDamage(side, dmg, 1, STATUS[st.k].c);
  if(f.hp <= 0){
    blog(`<span class="bad">${esc(f.name)} est désindexé.</span>`);
    handleKO(side);
  }
}

/* ---------- tour de jeu ---------- */
function doTurn(moveIdx, forcedSwitch){
  if(!BATTLE || BATTLE.over || BATTLE.busy) return;
  BATTLE.busy = true;
  BATTLE.turn++;
  const A = activeAlly(), F = activeFoe();
  const mA = forcedSwitch ? null : (BATTLE.ai ? bestMove(A, F) : A.moves[moveIdx]);
  const mF = bestMove(F, A);
  /* un changement d'équipe consomme le tour : l'adversaire frappe en premier */
  const allyFirst = !forcedSwitch &&
    (A.spe * A.buff.spe * (A.status && A.status.k === "par" ? .5 : 1)) >=
    (F.spe * F.buff.spe * (F.status && F.status.k === "par" ? .5 : 1));
  const seq = [];
  if(allyFirst) seq.push(["a", A, F, mA], ["f", F, A, mF]);
  else          seq.push(["f", F, A, mF], ["a", A, F, mA]);

  let step = 0;
  const run = () => {
    if(BATTLE.over){ BATTLE.busy = false; return; }
    if(step >= seq.length){ resolveEndOfTurn(); return; }
    const [side, att, def, mv] = seq[step++];
    if(att.hp <= 0 || !mv){ run(); return; }
    const act = canAct(att);
    if(act.msg) blog(act.msg);
    if(!act.ok){ renderArena(); setTimeout(run, 480 / BATTLE.speed); return; }
    applyMove(side, att, def, mv);
    setTimeout(run, 640 / BATTLE.speed);
  };
  run();
}
function resolveEndOfTurn(){
  const A = activeAlly(), F = activeFoe();
  endOfTurnStatus(F, "foe");
  if(!BATTLE.over) endOfTurnStatus(A, "ally");
  endTurn();
}

function applyMove(side, att, def, mv){
  const target = side === "a" ? "foe" : "ally";
  lungeSprite(side);

  if(rng() > mv.acc){
    blog(`<span class="muted">${esc(att.name)} tente ${esc(mv.name)} — échec de l'écriture.</span>`);
    renderArena(); return;
  }

  /* manœuvres : montée de statistique, soin, ou altération infligée */
  if(mv.util){
    if(mv.buff){
      for(const k in mv.buff) att.buff[k] = Math.min(2.6, att.buff[k] * mv.buff[k]);
      blog(`<b class="cy">${esc(att.name)}</b> utilise ${esc(mv.name)} — statistiques renforcées.`);
      flashSprite(side === "a" ? "ally" : "foe", "var(--cyan)");
    } else if(mv.heal){
      const h = Math.floor(att.maxHp * mv.heal);
      att.hp = Math.min(att.maxHp, att.hp + h);
      blog(`<span class="ok">${esc(att.name)} récupère ${h} points.</span>`);
      popDamage(side === "a" ? "ally" : "foe", -h, 1, "var(--green)");
    } else if(mv.st){
      if(typeMult(mv.type, def.types) === 0){
        blog(`<span class="muted">${esc(mv.name)} n'a aucun effet sur ${esc(def.name)}.</span>`);
      } else if(setStatus(def, mv.st)){
        blog(`${esc(att.name)} inflige <b style="color:${STATUS[mv.st].c}">${STATUS[mv.st].n}</b> à ${esc(def.name)}.`);
        flashSprite(target, STATUS[mv.st].c);
        Sfx.glitch();
      } else {
        blog(`<span class="muted">${esc(def.name)} est déjà affecté.</span>`);
      }
    }
    renderArena(); return;
  }

  const crit = rng() < 0.0625;
  const {dmg, eff} = damageCalc(att, def, mv, crit);
  def.hp = Math.max(0, def.hp - dmg);
  Sfx.hit(); if(side === "f") buzz(14);
  blog(`${esc(att.name)} utilise <b class="cy">${esc(mv.name)}</b> — <b>${dmg}</b>
    ${crit?'<span class="gold-t">coup critique !</span>':""} <span class="muted">${effLabel(eff)}</span>`);
  popDamage(target, dmg, eff);
  if(eff >= 2 || crit) flashArena(eff >= 2 ? "var(--amber)" : "var(--magenta)");
  renderArena();

  if(def.hp <= 0){
    blog(`<span class="bad">${esc(def.name)} est désindexé.</span>`);
    handleKO(target);
  } else if(BATTLE.boss && side === "a" && BATTLE.phase === 1 && def.hp / def.maxHp <= 0.5){
    bossPhaseTwo(def);
  }
}

function bossPhaseTwo(f){
  BATTLE.phase = 2;
  f.buff.atk *= 1.45; f.buff.spe *= 1.3;
  f.hp = Math.min(f.maxHp, f.hp + Math.floor(f.maxHp*0.12));
  f.status = null;
  Sfx.glitch(); buzz([40,30,60,30,80]);
  shakeApp();
  flashArena("var(--magenta)", 420);
  const ar = document.getElementById("arena");
  if(ar){
    const b = document.createElement("div");
    b.className = "phase-banner";
    b.textContent = "RECONFIGURATION";
    ar.appendChild(b);
    setTimeout(()=>b.remove(), 1400);
  }
  blog(`<span class="bad">Le verrou se reconfigure. Sa signature change.</span>`);
  renderArena();
}

/* ---------- issue d'un échange ---------- */
function handleKO(who){
  if(who === "foe"){
    const n = BATTLE.foes.findIndex((x,i)=>i > BATTLE.f && x.hp > 0);
    if(n === -1){ finishBattle(true); return; }
    BATTLE.f = n;
    blog(`Signature suivante : <b>${esc(BATTLE.foes[n].name)}</b>.`);
  } else {
    const n = BATTLE.allies.findIndex(x=>x.hp > 0);
    if(n === -1){ finishBattle(false); return; }
    BATTLE.a = n;
    blog(`<b class="cy">${esc(BATTLE.allies[n].name)}</b> prend le relais.`);
  }
  renderArena();
}
function endTurn(){
  BATTLE.busy = false;
  renderArena();
  if(!BATTLE.over && BATTLE.ai) setTimeout(()=>doTurn(0), 420 / BATTLE.speed);
}
function finishBattle(win){
  BATTLE.over = true; BATTLE.result = win; BATTLE.busy = false;
  blog(win ? `<b class="ok">Combat remporté.</b>` : `<b class="bad">Votre équipe ne répond plus.</b>`);
  win ? Sfx.win() : Sfx.lose();
  const ar = document.getElementById("arena");
  if(ar){
    const b = document.createElement("div");
    b.className = "phase-banner";
    b.style.color = win ? "var(--cyan)" : "var(--magenta)";
    b.style.textShadow = `0 0 18px ${win ? "var(--cyan)" : "var(--magenta)"},0 3px 0 #000`;
    b.textContent = win ? "VICTOIRE" : "ÉCHEC";
    ar.appendChild(b);
    if(win) burstEl(ar, {n:26, spread:140, colors:["#35f0d6","#ffc857","#ffffff"], dur:900});
    setTimeout(()=>b.remove(), 1400);
  }
  renderArena();
  const cb = BATTLE.onEnd;
  setTimeout(()=>{ if(cb) cb(win); }, 900);
}

/* ---------- retours visuels ---------- */
function popDamage(target, dmg, eff, color){
  const host = document.getElementById("arena"); if(!host) return;
  const heal = dmg < 0;
  const d = document.createElement("div");
  d.className = "dmgpop" + (eff >= 2 ? " big" : "");
  d.textContent = (heal ? "+" : "-") + Math.abs(dmg);
  d.style.color = color || (heal ? "var(--green)" : eff >= 2 ? "var(--amber)"
                  : eff < 1 ? "var(--ink3)" : "var(--magenta)");
  if(target === "foe"){ d.style.right = "46px"; d.style.top = "52px"; }
  else { d.style.left = "46px"; d.style.bottom = "86px"; }
  host.appendChild(d);
  if(!heal){
    const sp = document.getElementById(target === "foe" ? "spr-foe" : "spr-ally");
    if(sp){ sp.classList.add("hit"); setTimeout(()=>sp.classList.remove("hit"), 320); }
  }
  setTimeout(()=>d.remove(), 860);
}
function lungeSprite(side){
  const sp = document.getElementById(side === "a" ? "spr-ally" : "spr-foe");
  if(!sp) return;
  sp.classList.add(side === "a" ? "lunge-up" : "lunge-down");
  setTimeout(()=>sp.classList.remove("lunge-up","lunge-down"), 300);
}
function flashSprite(target, color){
  const sp = document.getElementById(target === "foe" ? "spr-foe" : "spr-ally");
  if(!sp) return;
  sp.style.filter = `drop-shadow(0 0 14px ${color})`;
  setTimeout(()=>{ sp.style.filter = ""; }, 420);
}
function flashArena(color, dur){
  const host = document.getElementById("arena"); if(!host) return;
  const f = document.createElement("div");
  f.className = "arena-flash";
  f.style.background = `radial-gradient(closest-side, ${color}, transparent 72%)`;
  host.appendChild(f);
  setTimeout(()=>f.remove(), dur || 300);
}

/* ---------- changement d'équipier ---------- */
function doSwitch(i){
  if(!BATTLE || BATTLE.over || BATTLE.busy || BATTLE.ai) return;
  const n = BATTLE.allies[i];
  if(!n || n.hp <= 0 || i === BATTLE.a) return;
  closeSheet();
  blog(`<b class="cy">${esc(n.name)}</b> prend le relais.`);
  BATTLE.a = i;
  renderArena();
  setTimeout(()=>doTurn(0, true), 260);
}
ACTIONS.bswitch = () => {
  if(!BATTLE || BATTLE.over || BATTLE.busy) return;
  sheet(`${sheetHead("Changer d'équipier")}
    <div class="tiny muted" style="margin-bottom:9px">Le changement consomme votre tour :
      l'adversaire agira avant votre nouveau Pokémon.</div>
    <div class="list">
      ${BATTLE.allies.map((f,i)=>`
        <div class="item ${i===BATTLE.a?"on":""}" ${f.hp>0&&i!==BATTLE.a?`data-act="bswitchdo" data-i="${i}"`:""}
          style="${f.hp<=0?"opacity:.4":""}">
          <span class="sprbox" style="width:40px;height:40px">${sprite(f.id, f.shiny, "")}</span>
          <div class="grow"><div class="t">${esc(f.name)} <span class="dim tiny">N.${f.level}</span>
            ${f.status?`<span class="stbadge" style="--sc:${STATUS[f.status.k].c}">${STATUS[f.status.k].ab}</span>`:""}</div>
            <div class="bar hp ${hpCls(f)}" style="margin-top:4px"><i style="width:${f.hp/f.maxHp*100}%"></i></div>
            <div class="tiny dim mono-num">${f.hp} / ${f.maxHp}</div></div>
          ${i===BATTLE.a?'<span class="tiny cy">en jeu</span>':f.hp<=0?'<span class="tiny bad">hors ligne</span>':ic("arrow")}
        </div>`).join("")}
    </div>`);
};
ACTIONS.bswitchdo = d => doSwitch(+d.i);

function hpCls(f){ const r = f.hp/f.maxHp; return r > .5 ? "" : r > .2 ? "mid" : "low"; }

function statusBadge(f){
  if(!f.status) return "";
  const st = STATUS[f.status.k];
  return `<span class="stbadge" style="--sc:${st.c}" title="${esc(st.d)}">${st.ab}</span>`;
}
function buffMarks(f){
  const up = [];
  if(f.buff.atk > 1.05) up.push("ATQ");
  if(f.buff.def > 1.05) up.push("DEF");
  if(f.buff.spe > 1.05) up.push("VIT");
  return up.length ? `<span class="buffmark">${up.join(" ")}</span>` : "";
}
function renderArena(){
  const host = document.getElementById("arena");
  if(!host || !BATTLE) return;
  const A = activeAlly(), F = activeFoe();
  const foesLeft = BATTLE.foes.filter(x=>x.hp>0).length;
  host.innerHTML = `
    <div class="arena-bg"></div>
    <div class="arena-pad foe-pad"></div>
    <div class="arena-pad ally-pad"></div>

    <div class="side foe">
      <div class="nmplate">
        <div class="row between">
          <span>${esc(F.name)} ${statusBadge(F)}</span>
          <span class="dim">N.${F.level}</span>
        </div>
        <div class="bar hp ${hpCls(F)}"><i style="width:${F.hp/F.maxHp*100}%"></i></div>
        <div class="row between tiny dim mono-num">
          <span>${buffMarks(F)}</span>
          <span>${F.hp} / ${F.maxHp}</span>
        </div>
      </div>
      <div id="spr-foe" class="combatant">${sprite(F.id, F.shiny, "", {anim:true, eager:true})}</div>
      ${BATTLE.foes.length>1?`<div class="foecount">${foesLeft} / ${BATTLE.foes.length}</div>`:""}
    </div>

    <div class="side ally">
      <div id="spr-ally" class="combatant back">${sprite(A.id, A.shiny, "", {anim:true, eager:true, back:true})}</div>
      <div class="nmplate">
        <div class="row between">
          <span>${esc(A.name)} ${statusBadge(A)}</span>
          <span class="dim">N.${A.level}</span>
        </div>
        <div class="bar hp ${hpCls(A)}"><i style="width:${A.hp/A.maxHp*100}%"></i></div>
        <div class="row between tiny dim mono-num">
          <span>${buffMarks(A)}</span>
          <span>${A.hp} / ${A.maxHp}</span>
        </div>
      </div>
    </div>

    ${BATTLE.over ? "" : `<div class="turnflag ${BATTLE.busy?"wait":""}">
      ${BATTLE.ai ? "COMBAT AUTOMATIQUE" : (BATTLE.busy ? "RÉSOLUTION" : "À VOUS")}</div>`}
    ${BATTLE.phase===2?`<div class="phasetag">PHASE 2</div>`:""}`;

  const ctl = document.getElementById("moves");
  if(ctl && !BATTLE.ai){
    ctl.innerHTML = BATTLE.over ? "" : A.moves.map((m,i)=>{
      if(m.util){
        const what = m.st ? STATUS[m.st].n : m.heal ? "Soin" : "Renfort";
        return `<button class="btn sm mv util" data-act="move" data-i="${i}" ${BATTLE.busy?"disabled":""}>
          <span class="tt t${m.type}">${TYPE_NAMES[m.type]}</span>
          <span class="mv-n">${esc(m.name)}</span>
          <span class="mv-x dim">${what}</span></button>`;
      }
      const e = typeMult(m.type, F.types);
      const cls = e >= 2 ? "sup" : e === 0 ? "nul" : e < 1 ? "weak" : "";
      const tag = e >= 2 ? "×"+e : e === 0 ? "×0" : e < 1 ? "×"+e : "";
      return `<button class="btn sm mv ${cls}" data-act="move" data-i="${i}" ${BATTLE.busy?"disabled":""}>
        <span class="tt t${m.type}">${TYPE_NAMES[m.type]}</span>
        <span class="mv-n">${esc(m.name)}</span>
        <span class="mv-x">${tag}</span></button>`;
    }).join("");
  }
  const team = document.getElementById("battle-team");
  if(team) team.innerHTML = teamStrip(BATTLE.allies);
}
